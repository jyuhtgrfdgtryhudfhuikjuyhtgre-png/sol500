  }

  function shielding(s) {
    const wallCap = s.loadout.waterwall * D.ITEMS.waterwall.kg;
    const wall = wallCap > 0 ? D.ITEMS.waterwall.shielding * s.loadout.waterwall * (s.wallWater / wallCap) : 0;
    return clamp(D.HAB.shielding + wall + s.modules.shield.count * D.MODULES.shield.shielding, 0, D.SHIELD_CAP);
  }

  function activeCount(s, type) {
    const m = s.modules[type];
    return m ? Math.max(0, m.count - m.broken) : 0;
  }

  function isActive(c) { return c.status === 'active'; }

  function defaultPlan(s) {
    const jobs = {};
    for (const c of s.crew) {
      let job = D.DEFAULT_JOB[c.role];
      if (job === 'farming' && s.modules.greenhouse.count === 0) job = 'construction';
      if (c.grounded && D.OUTDOOR_JOBS.includes(job)) job = 'science';
      jobs[c.id] = job;
    }
    const modulesOn = {};
    for (const type of D.CONSUMERS) modulesOn[type] = true;
    const choices = {};
    for (const e of s.events || []) if (e.options) choices[e.type] = e.options[0];
    return { jobs, modulesOn, rations: 'full', habMode: 'normal', choices, drainWall: 0, builds: [], scrap: [], request: null };
  }

  // Plan for the next round: standing orders and jobs carry over, one-off actions reset.
  function nextPlan(s, prev) {
    const p = defaultPlan(s);
    if (!prev) return p;
    for (const c of s.crew) {
      const job = (prev.jobs || {})[c.id];
      if (D.JOBS[job] && !(c.grounded && D.OUTDOOR_JOBS.includes(job))) p.jobs[c.id] = job;
    }
    Object.assign(p.modulesOn, prev.modulesOn || {});
    if (prev.rations) p.rations = prev.rations;
    if (prev.habMode) p.habMode = prev.habMode;
    return p;
  }

  function canRequest(s) {
    return s.status === 'active' && s.depot.drops > 0 && !s.schedule[s.turn].conjunction;
  }

  function canBuild(s, type, pending) {
    const spec = D.BUILDS[type];
    if (!spec) return { ok: false, reason: 'unknown' };
    const pend = pending || [];
    const planned = s.projects.filter(p => p.type === type).length + pend.filter(b => b.type === type).length;
    if (s.modules[type].count + planned >= D.MODULES[type].max) return { ok: false, reason: 'max' };
    const spent = pend.reduce((sum, b) => sum + (D.BUILDS[b.type] ? D.BUILDS[b.type].materials : 0), 0);
    if (s.resources.materials - spent < spec.materials) return { ok: false, reason: 'materials' };
    if (type !== 'shield' && buildSpots(s, type, pend).length === 0) return { ok: false, reason: 'space' };
    return { ok: true };
  }

  // ---------- turn start: reveal events ----------
  function beginTurn(s) {
    const info = s.schedule[s.turn];
    const ev = [];
    if (s.turn === 0) ev.push({ type: 'landing' });
    if (s.turn > 0) {
      const now = seasonAt(s.sol);
      const before = seasonAt(s.sol - D.TURN_SOLS);
      if (now.dustSeason && !before.dustSeason) ev.push({ type: 'dust_season' });
      if (now.winter && !before.winter) ev.push({ type: 'winter' });
    }
    for (const b of s.pending.breakdowns) ev.push({ type: 'breakdown', module: b });
    for (const id of s.pending.injuries) ev.push({ type: 'injury', crewId: id });

    // Earth supply: delays, then arrivals
    if (s.eventsOn && s.depot.incoming.some(d => d.eta <= s.turn) && rng(s.seed, 'delay', s.turn)() < D.DEPOT.delayChance) {
      for (const d of s.depot.incoming) d.eta += 1;
      ev.push({ type: 'supply_delay' });
    }
    const arrived = s.depot.incoming.filter(d => d.eta <= s.turn);
    s.depot.incoming = s.depot.incoming.filter(d => d.eta > s.turn);
    for (const d of arrived) {
      const amount = D.DEPOT.amounts[d.kind];
      s.resources[d.kind] += amount;
      s.morale = clamp(s.morale + D.MORALE.drop, 0, 100);
      ev.push({ type: 'supply_arrived', kind: d.kind, amount });
    }

    if (info.weather === 'global') {
      const first = s.turn === 0 || s.schedule[s.turn - 1].weather !== 'global';
      ev.push({ type: 'dust_global', first });
    } else if (info.weather === 'regional') {
      ev.push({ type: 'dust_regional' });
    }
    if (info.devil) {
      ev.push({ type: 'dust_devil' });
      s.cleanliness = 1;
    }
    if (info.conjunction) {
      ev.push({ type: 'conjunction' });
      s.morale = clamp(s.morale + D.MORALE.conjunction, 0, 100);
    }
    if (info.spe) ev.push({ type: 'spe', options: ['shelter', 'work'] });
    let discovery = s.pending.discovery;
    if (info.flavor) {
      let f = info.flavor;
      if (f === 'perchlorate' && s.modules.greenhouse.count === 0) f = 'earth_message';
      if (f === 'o2_rupture') ev.push({ type: 'o2_rupture', options: ['hide', 'salvage'], emergency: true });
      else if (f === 'water_leak') ev.push({ type: 'water_leak', options: ['patch', 'ignore'] });
      else if (f === 'perchlorate') ev.push({ type: 'perchlorate', options: ['wash', 'hydro'] });
      else if (f === 'discovery') discovery = true;
      else {
        ev.push({ type: 'earth_message' });
        s.morale = clamp(s.morale + D.MORALE.earthMessage, 0, 100);
      }
    }
    if (discovery) ev.push({ type: 'discovery', options: ['investigate', 'log'] });
    const led = s.crew.some(c => c.role === 'commander' && c.status === 'active');
    if (s.eventsOn && s.turn > 0 && s.morale < D.CONFLICT_MORALE && rng(s.seed, 'conflict', s.turn)() < D.CONFLICT_CHANCE * (led ? 0.5 : 1)) {
      ev.push({ type: 'conflict', options: ['meeting', 'push'] });
    }
    s.pending = { discovery: false, injuries: [], breakdowns: [] };
    s.events = ev;
  }

  function resolveChoices(s, plan) {
    const out = { spe: null, perchlorate: null, discovery: null, conflict: null, o2_rupture: null, water_leak: null };
    for (const e of s.events || []) {
      if (!e.options) continue;
      const wanted = (plan.choices || {})[e.type];
      out[e.type] = e.options.includes(wanted) ? wanted : e.options[0];
    }
    if (out.water_leak === 'patch' && s.resources.spares < 1) out.water_leak = 'ignore';
    if (out.perchlorate === 'wash' && s.resources.water < D.PERCHLORATE_WASH_WATER) out.perchlorate = 'hydro';
    return out;
  }

  // ---------- power ----------
  function computePower(s, plan, weather, season) {
    const stormFactor = D.STORM_FACTOR[weather] || 1;
    const solarN = activeCount(s, 'solar');
    const covered = Math.min(solarN, activeCount(s, 'battery') * D.MODULES.battery.covers);
    const perArray = D.MODULES.solar.gen * season.solarFactor * stormFactor * s.cleanliness;
    const solarKw = perArray * (covered + D.NIGHT_LOSS_UNCOVERED * (solarN - covered));
    const reactorKw = activeCount(s, 'reactor') * D.MODULES.reactor.gen;
    const supply = solarKw + reactorKw;
    const habKw = (plan.habMode === 'austerity' ? D.HAB.powerAusterity : D.HAB.powerNormal) +
      (season.winter ? D.WINTER_HEATING : 0);

    const running = {}, requested = {}, shed = {};
    let demand = habKw;
    for (const type of D.CONSUMERS) {
      const on = (plan.modulesOn || {})[type] !== false;
      const n = on ? activeCount(s, type) : 0;
      running[type] = n;
      requested[type] = n;
      shed[type] = 0;
      demand += n * D.MODULES[type].kw;
    }
    let load = demand;
    for (const type of D.SHED_ORDER) {
      while (load > supply + 1e-9 && running[type] > 0) {
        running[type]--;
        shed[type]++;
        load -= D.MODULES[type].kw;
      }
    }
    return {
      supply, solarKw, reactorKw, habKw, demand, load, running, requested, shed,
      habShort: supply + 1e-9 < habKw,
      margin: supply - load,
      stormFactor, solarFactor: season.solarFactor, cleanliness: s.cleanliness,
      solarN, covered,
    };
  }

  // ---------- one turn ----------
  function simulate(state, plan0, random) {
    if (state.status !== 'active') throw new Error('The mission is over.');
    const plan = Object.assign({ jobs: {}, modulesOn: {}, choices: {}, builds: [], scrap: [] }, plan0 || {});
    const s = clone(state);
    const T = D.TURN_SOLS;
    const info = s.schedule[s.turn];
    const weather = info.weather;
    const season = seasonAt(s.sol);
    const ch = resolveChoices(s, plan);
    const start = {
      o2: s.resources.o2, water: s.resources.water, food: s.resources.food,
      spares: s.resources.spares, materials: s.resources.materials, wall: s.wallWater,
    };
    const report = {
      turn: s.turn, sol: s.sol, weather, season, choices: ch, repairs: [], repairMethods: [], warnings: [],
      production: {}, consumption: {}, delta: {}, crew: [], power: null, science: 0,
      started: [], completed: [], revived: [], downs: [], deaths: [], requested: null,
    };
    // Exploring: what the crew delivered this round, and what went wrong outside, count before anything else.
    report.expedition = applyExpedition(s);
    const living = s.crew.filter(c => c.status !== 'dead');
    const n = living.length;
    const workers = s.crew.filter(isActive);

    // Jobs (grounded crew stay indoors)
    const jobOf = {};
    for (const c of s.crew) {
      let job = plan.jobs[c.id];
      if (!D.JOBS[job]) job = 'medical';
      if (c.grounded && D.OUTDOOR_JOBS.includes(job)) job = 'science';
      jobOf[c.id] = job;
    }

    // Work capacity
    const shelterBuilt = s.modules.shelter.count > 0;
    let workFactor = s.morale < 20 ? 0.6 : s.morale < 40 ? 0.8 : 1;
    if (plan.habMode === 'austerity') workFactor *= D.AUSTERITY_WORK;
    if (ch.spe === 'shelter') workFactor *= shelterBuilt ? D.SPE.shelterBuiltWork : D.SPE.shelterWork;
    if (ch.o2_rupture === 'hide') workFactor *= D.O2_RUPTURE.hideWork;
    if (ch.conflict === 'meeting') workFactor *= D.MEETING_WORK;
    if (ch.conflict === 'push') workFactor *= D.PUSH_WORK;
    const leader = workers.find(c => c.role === 'commander');
    const pts = { maintenance: 0, farming: 0, construction: 0, science: 0, eva: 0, medical: 0 };
    for (const c of workers) {
      const job = jobOf[c.id];
      const spec = D.SPECIALTY[c.role].includes(job) ? D.SPECIALIST_BONUS : 1;
      const fit = c.health < 30 ? 0.5 : 1;
      const led = leader && c !== leader ? D.LEADERSHIP.work : 1;
      pts[job] += spec * fit * led * workFactor;
    }
    report.workFactor = workFactor;
    report.points = pts;
    const engineerFixing = workers.some(c => c.role === 'engineer' && jobOf[c.id] === 'maintenance');

    // Event costs paid up front
    if (ch.water_leak === 'patch') s.resources.spares -= 1;

    // Earth support request
    if (plan.request && D.DEPOT.amounts[plan.request] && canRequest(state)) {
      const lead = activeCount(s, 'comms') > 0 ? D.DEPOT.commsLeadTurns : D.DEPOT.leadTurns;
      s.depot.drops -= 1;
      s.depot.incoming.push({ kind: plan.request, eta: s.turn + 1 + lead });
      s.totals.dropsUsed += 1;
      report.requested = plan.request;
    }

    // Scrap modules for spare parts (someone has to be on maintenance to strip them)
    const scrapped = [];
    if (pts.maintenance > 0) {
      for (const type of plan.scrap || []) {
        const m = s.modules[type];
        if (!m || type === 'hab' || type === 'shield' || m.count <= 0) continue;
        m.count--;
        if (m.broken > 0) m.broken--;
        if (type === 'greenhouse') s.crops.sort((a, b) => b - a).pop();
        for (let i = s.layout.length - 1; i >= 0; i--) {
          if (s.layout[i].type === type) { s.layout.splice(i, 1); break; }
        }
        s.resources.spares++;
        s.totals.scrapped++;
        scrapped.push(type);
      }
    }
    report.scrapped = scrapped;

    // Repairs: spare kits first, then materials (workshop, or the engineer's jury-rig once per turn)
    let capacity = Math.floor(pts.maintenance * D.REPAIRS_PER_POINT + 1e-9);
    const workshop = activeCount(s, 'workshop') > 0;
    let juryRig = engineerFixing;
    for (const type of D.REPAIR_ORDER) {
      const m = s.modules[type];
      while (m && m.broken > 0 && capacity > 0) {
        let method = null;
        if (s.resources.spares > 0) method = 'spare';
        else if (s.resources.materials >= D.REPAIR_MATERIALS && (workshop || juryRig)) method = workshop ? 'workshop' : 'juryrig';
        if (!method) break;
        if (method === 'spare') s.resources.spares--;
        else s.resources.materials -= D.REPAIR_MATERIALS;
        if (method === 'juryrig') juryRig = false;
        m.broken--;
        capacity--;
        report.repairs.push(type);
        report.repairMethods.push(method);
      }
    }
    report.unrepaired = D.REPAIR_ORDER.filter(t => s.modules[t] && s.modules[t].broken > 0);

    // New construction projects (materials paid now; work applied at the end of the turn)
    for (const b of plan.builds || []) {
      const spec = D.BUILDS[b.type];
      if (!spec || !canBuild(s, b.type).ok) continue;
      if (b.type !== 'shield' && !buildSpots(s, b.type).some(([x, y]) => x === b.x && y === b.y)) continue;
      s.resources.materials -= spec.materials;
      s.projects.push({ type: b.type, x: b.type === 'shield' ? null : b.x, y: b.type === 'shield' ? null : b.y, progress: 0, work: spec.work });
      report.started.push(b.type);
    }

    // Player drains the water wall
    const drain = clamp(Number(plan.drainWall) || 0, 0, s.wallWater);
    s.wallWater -= drain;
    s.resources.water += drain;
    report.drained = drain;

    // Power
    const power = computePower(s, plan, weather, season);
    report.power = power;
    const run = power.running;
    const habFault = s.modules.hab.broken > 0;

    // Revive one downed crew member (medic on medical care, or anyone on medical care with a med bay)
    const medicCaring = workers.some(c => c.role === 'medic' && jobOf[c.id] === 'medical');
    const medbayOn = run.medbay > 0;
    const canRevive = medicCaring || (medbayOn && workers.some(c => jobOf[c.id] === 'medical'));
    const revivedIds = [];
    if (canRevive) {
      const down = s.crew.filter(c => c.status === 'down').sort((a, b) => b.downTurns - a.downTurns)[0];
      if (down) {
        down.status = 'active';
        down.health = D.REVIVE.health;
        down.revives += 1;
        down.downTurns = 0;
        s.totals.revives += 1;
        revivedIds.push(down.id);
      }
    }
    report.revived = revivedIds;

    // Greenhouses: oldest crops keep the power first
    s.crops.sort((a, b) => b - a);
    const ghRun = run.greenhouse;
    let harvesting = 0;
    for (let i = 0; i < ghRun; i++) if (s.crops[i] >= D.MODULES.greenhouse.growTurns) harvesting++;
    const tended = Math.min(harvesting, pts.farming * D.GREENHOUSES_PER_FARMER);
    let ghFood = D.MODULES.greenhouse.foodPerSol * T * (tended + D.UNTENDED_YIELD * (harvesting - tended));
    if (ch.perchlorate === 'hydro') ghFood = 0;
    const cropsLost = s.crops.some((age, i) => i >= ghRun && age > 0);
    for (let i = 0; i < s.crops.length; i++) s.crops[i] = i < ghRun ? s.crops[i] + 1 : 0;
    const ghO2 = ghRun * D.MODULES.greenhouse.o2PerSol * T;
    const ghWater = ghRun * D.MODULES.greenhouse.waterPerSol * T;
    report.greenhouse = { running: ghRun, harvesting, tended, cropsLost };

    // Oxygen
    const o2Need = D.O2_PER_CREW * n * T;
    const o2Plant = run.oxygen * D.MODULES.oxygen.o2PerSol * T;
    let o2Event = 0;
    if (ch.o2_rupture === 'hide') o2Event = -D.O2_RUPTURE.hideLoss;
    if (ch.o2_rupture === 'salvage') o2Event = D.O2_RUPTURE.salvageGain - D.O2_RUPTURE.salvageLoss;
    const o2Loss = (habFault ? D.HAB_FAULT.o2 : 0);
    s.resources.o2 += o2Plant + ghO2 - o2Need - o2Loss + o2Event;
    let hypoxia = 0;
    if (s.resources.o2 < 0) {
      hypoxia = o2Need > 0 ? Math.min(1, -s.resources.o2 / o2Need) : 0;
      s.resources.o2 = 0;
    }

    // Water
    const waterGross = D.WATER_PER_CREW * n * T;
    const recovered = run.recycler > 0 ? waterGross * D.MODULES.recycler.recovery : 0;
    const iceWater = run.icedrill * D.MODULES.icedrill.waterPerSol * T;
    const washWater = ch.perchlorate === 'wash' ? D.PERCHLORATE_WASH_WATER : 0;
    const leakWater = ch.water_leak === 'ignore' ? D.WATER_LEAK : 0;
    s.resources.water += iceWater + recovered - waterGross - ghWater - washWater - leakWater;
    let autoDrained = 0;
    if (s.resources.water < 0 && s.wallWater > 0) {
      autoDrained = Math.min(-s.resources.water, s.wallWater);
      s.wallWater -= autoDrained;
      s.resources.water += autoDrained;
    }
    report.autoDrained = autoDrained;
    let dehydration = 0;
    if (s.resources.water < 0) {
      dehydration = waterGross > 0 ? Math.min(1, -s.resources.water / (waterGross * (1 - D.MODULES.recycler.recovery) + 1)) : 0;
      s.resources.water = 0;
    }

    // Food
    const rationF = plan.rations === 'reduced' ? D.REDUCED_RATIONS : 1;
    const foodNeed = D.FOOD_PER_CREW * n * T * rationF;
    const foodAvail = s.resources.food + ghFood;
    const foodEaten = Math.min(foodNeed, foodAvail);
    const fed = foodNeed > 0 ? foodEaten / foodNeed : 1;
    s.resources.food = foodAvail - foodEaten;

    report.production = { o2: o2Plant + ghO2, water: recovered + iceWater, food: ghFood, o2Plant, ghO2, recovered, iceWater };
    report.consumption = {
      o2: o2Need + o2Loss, water: waterGross + ghWater + washWater + leakWater, food: foodNeed,
      o2Loss, waterGross, ghWater, washWater, leakWater, o2Event,
    };
    report.hypoxia = hypoxia;
    report.dehydration = dehydration;

    // Crew: radiation and health
    const S = shielding(s);
    report.shielding = S;
    const medic = s.crew.find(c => c.role === 'medic');
    const medicWell = medic && isActive(medic) && medic.health > 50;
    const byDose = list => list.slice().sort((a, b) => a.dose - b.dose);
    const outdoorOk = workers.filter(c => !c.grounded && !revivedIds.includes(c.id));
    let extraDose = {};
    if (ch.discovery === 'investigate') {
      const sci = outdoorOk.find(c => c.role === 'scientist');
      const team = sci ? [sci].concat(byDose(outdoorOk.filter(c => c !== sci)).slice(0, 1)) : byDose(outdoorOk).slice(0, 2);
      for (const c of team) extraDose[c.id] = (extraDose[c.id] || 0) + D.DISCOVERY.dose;
    }
    let salvageTeam = [];
    if (ch.o2_rupture === 'salvage') {
      salvageTeam = byDose(outdoorOk).slice(0, 2);
      for (const c of salvageTeam) extraDose[c.id] = (extraDose[c.id] || 0) + D.O2_RUPTURE.salvageDose;
      s.totals.salvages += 1;
    }
    if (ch.spe === 'shelter') s.totals.shelters += 1;

    let careCount = 0;
    const habitatBonus = run.habitat * D.MODULES.habitat.health;
    for (const c of s.crew) {
      if (c.status === 'dead') {
        report.crew.push({ id: c.id, job: jobOf[c.id], status: 'dead', doseDelta: 0, healthDelta: 0, dose: c.dose, health: 0, exposure: 0 });
        continue;
      }
      const working = isActive(c) && !revivedIds.includes(c.id);
      const job = working ? jobOf[c.id] : 'medical';
      if (working && job === 'medical') careCount++;
      const outdoor = working ? D.JOBS[job].outdoor : 0;
      const exposure = outdoor + (1 - outdoor) * (1 - S);
      let dose = T * D.DOSE_RATE * exposure + (extraDose[c.id] || 0);
      if (ch.spe === 'shelter') dose += shelterBuilt ? D.SPE.shelterBuiltDose : D.SPE.shelterDose;
      if (ch.spe === 'work') dose += D.SPE.dose * exposure;
      c.dose += dose;

      let dh = 0;
      if (working) {
        const harms = [];
        if (rationF < 1) harms.push(['rations', D.HEALTH.reducedRations]);
        if (fed < 1) harms.push(['starvation', D.HEALTH.starvation * (1 - fed)]);
        if (power.habShort) harms.push(['cold', D.HEALTH.cold]);
        if (habFault) harms.push(['habFault', D.HAB_FAULT.health]);
        if (ch.spe === 'work') harms.push(['radiationSickness', D.HEALTH.speWork]);
        if (hypoxia > 0) harms.push(['hypoxia', D.HEALTH.hypoxia * hypoxia]);
        if (dehydration > 0) harms.push(['dehydration', D.HEALTH.dehydration * dehydration]);
        const comfortable = harms.length === 0;
        if (comfortable) dh += D.HEALTH.recovery;
        if (comfortable && job === 'medical') dh += D.HEALTH.rest;
        if (medicCaring) dh += D.HEALTH.care;
        if (medicWell) dh += D.HEALTH.medic;
        if (medbayOn && job === 'medical') dh += D.MODULES.medbay.heal;
        dh += habitatBonus;
        for (const [, x] of harms) dh -= x;
        if (harms.length) c.harm = harms.slice().sort((a, b) => b[1] - a[1])[0][0];
        c.health = clamp(c.health + dh, 0, 100);
      }
      report.crew.push({ id: c.id, job: working ? job : null, status: c.status, doseDelta: dose, healthDelta: dh, dose: c.dose, health: c.health, exposure });
    }

    // Down, dead and grounded
    for (const c of s.crew) {
      if (c.status === 'active' && !revivedIds.includes(c.id) && c.health <= 0) {
        if (c.revives >= D.REVIVE.maxRevives) {
          c.status = 'dead';
          report.deaths.push(c.id);
        } else {
          c.status = 'down';
          c.downTurns = 0;
          report.downs.push(c.id);
        }
      } else if (c.status === 'down' && !revivedIds.includes(c.id)) {
        c.downTurns += 1;
        if (c.downTurns >= D.REVIVE.window) {
          c.status = 'dead';
          report.deaths.push(c.id);
        }
      }
      if (c.status !== 'dead') c.grounded = c.dose > D.DOSE_LIMIT;
    }
    s.totals.downs += report.downs.length;
    s.totals.deaths += report.deaths.length;

    // Morale
    let dm = D.MORALE.baseline;
    if (leader) dm += D.LEADERSHIP.morale;
    dm += Math.min(D.MORALE.greenhouseMax, D.MORALE.perGreenhouse * harvesting);
    dm += D.MORALE.rest * careCount;
    dm += run.habitat * D.MODULES.habitat.morale;
    if (rationF < 1) dm += D.MORALE.reducedRations;
    if (plan.habMode === 'austerity') dm += D.MORALE.austerity;
    if (power.habShort) dm += D.MORALE.cold;
    if (ch.conflict === 'meeting') dm += D.MORALE.meeting;
    if (ch.conflict === 'push') dm += D.MORALE.push;
    if (ch.spe === 'shelter') dm += D.MORALE.shelter;
    if (ch.discovery === 'investigate') dm += D.MORALE.discovery;
    if (ch.o2_rupture === 'hide') dm += D.MORALE.hide;
    dm += D.MORALE.down * report.downs.length + D.MORALE.death * report.deaths.length;
    s.morale = clamp(s.morale + dm, 0, 100);
    report.moraleDelta = dm;

    // Science
    const sci = pts.science * (run.lab > 0 ? D.SCIENCE.lab : D.SCIENCE.noLab) +
      pts.eva * (run.rover > 0 ? D.SCIENCE.eva : D.SCIENCE.evaNoRover) +
      pts.farming * D.SCIENCE.farming +
      (ch.discovery === 'investigate' ? D.DISCOVERY.science : ch.discovery === 'log' ? D.DISCOVERY.logScience : 0);
    s.science += sci;
    report.science = sci + (report.expedition ? report.expedition.got.science : 0);

    // Construction: finish projects in order, leftover work becomes regolith bricks
    let cp = pts.construction;
    for (const p of s.projects) {
      if (cp <= 1e-9) break;
      const use = Math.min(p.work - p.progress, cp);
      p.progress += use;
      cp -= use;
    }
    s.projects = s.projects.filter(p => {
      if (p.progress < p.work - 1e-9) return true;
      s.modules[p.type].count += 1;
      if (p.x != null) s.layout.push({ type: p.type, x: p.x, y: p.y });
      if (p.type === 'greenhouse') s.crops.push(0);
      s.totals.built += 1;
      report.completed.push(p.type);
      return false;
    });
    const regolith = Math.max(0, cp) * D.REGOLITH_PER_POINT;
    s.resources.materials += regolith;
    report.regolith = regolith;

    // Dust on the arrays
    const cleanBefore = s.cleanliness;
    s.cleanliness = clamp(s.cleanliness - (D.DUST_PER_TURN[weather] || 0) + pts.maintenance * D.CLEAN_PER_POINT, D.MIN_CLEANLINESS, 1);
    report.cleanDelta = s.cleanliness - cleanBefore;

    // Earth-independence bookkeeping
    s.totals.o2Used += o2Need;
    s.totals.o2Local += o2Plant + ghO2;
    s.totals.waterUsed += waterGross + ghWater;
    s.totals.waterLocal += recovered + iceWater;
    s.totals.foodUsed += foodEaten;
    s.totals.foodLocal += Math.min(ghFood, foodEaten);

    report.delta = {
      o2: s.resources.o2 - start.o2,
      water: s.resources.water - start.water,
      food: s.resources.food - start.food,
      spares: s.resources.spares - start.spares,
      materials: s.resources.materials - start.materials,
      wall: s.wallWater - start.wall,
      morale: dm,
    };
    report.after = {
      o2: s.resources.o2, water: s.resources.water, food: s.resources.food, spares: s.resources.spares,
      materials: s.resources.materials, wall: s.wallWater, morale: s.morale, cleanliness: s.cleanliness,
      shielding: shielding(s), science: s.science,
    };
    report.fed = fed;
    report.runway = runway(s, report);
    report.warnings = warnings(s, report);

    // Random outcomes (only when resolving a real turn with events on)
    const injuries = [], breakdowns = [];
    if (random && s.eventsOn) {
      const r = rng(s.seed, 'ops', s.turn);
      for (const c of s.crew) {
        if (!isActive(c)) continue;
        let p = D.INJURY[jobOf[c.id]] || 0;
        if (salvageTeam.includes(c) && p < D.O2_RUPTURE.salvageInjury) p = D.O2_RUPTURE.salvageInjury;
        if (p > 0 && r() < p) {
          c.health = clamp(c.health - D.INJURY_HEALTH, 0, 100);
          c.harm = 'injury';
          injuries.push(c.id);
          if (c.health <= 0) {
            if (c.revives >= D.REVIVE.maxRevives) { c.status = 'dead'; report.deaths.push(c.id); s.totals.deaths++; }
            else { c.status = 'down'; c.downTurns = 0; report.downs.push(c.id); s.totals.downs++; }
          }
        }
      }
      const protect = Math.min(D.MAINT_PROTECT_MAX, pts.maintenance * D.MAINT_PROTECT_PER_POINT);
      for (const type of D.MODULE_TYPES) {
        const working = activeCount(s, type);
        for (let i = 0; i < working; i++) {
          if (r() < D.BREAKDOWN[type] * D.DIFFICULTY[s.difficulty].breakdown * (1 - protect)) {
            s.modules[type].broken++;
            breakdowns.push(type);
          }
        }
      }
      const scientistOut = workers.some(c => c.role === 'scientist' && jobOf[c.id] === 'eva');
      s.pending.discovery = pts.eva > 0 && r() < (scientistOut ? D.DISCOVERY.scientistChance : D.DISCOVERY.chance);
    }
    s.pending.injuries = injuries;
    s.pending.breakdowns = breakdowns;
    report.injuries = injuries;
    report.breakdowns = breakdowns;
    return { state: s, report };
  }

  // The bank goes into the base's stocks; each collapse outside (recorded, or a co-op crew member still waiting for a
  // revive) costs that astronaut health and the crew morale, and a solar flare that caught them outside costs a dose.
  // Returns what the report shows.
  function applyExpedition(s) {
    const x = s.expedition;
    if (!x || !x.banked) return null;
    const got = {};
    for (const k of BANK_RES) got[k] = Math.max(0, Number(x.banked[k]) || 0);
    for (const k of ['water', 'materials', 'spares', 'food', 'o2']) s.resources[k] += got[k];
    s.science += got.science;
    s.morale = clamp(s.morale + got.morale, 0, 100);
    const incidents = (x.incidents || []).map(i => ({ crewId: i.crewId, kind: i.kind }));
    for (const id of Object.keys(x.collapsed || {})) incidents.push({ crewId: id, kind: 'collapse' });
    for (const inc of incidents) {
      const c = s.crew.find(k => k.id === inc.crewId);
      if (!c || c.status !== 'active') continue;
      if (inc.kind === 'flare') { c.dose += D.DANGERS.flare.dose; continue; }
      c.health = clamp(c.health - D.EXPEDITION.collapse.health, 0, 100);
      s.morale = clamp(s.morale - D.EXPEDITION.collapse.morale, 0, 100);
    }
    return { got, lines: (x.banked.lines || []).map(l => Object.assign({}, l)), incidents };
  }

  // After a round: the bank and the incidents are spent; what is still in a backpack is banked for the next round (a
  // one-round delay), except that a co-op astronaut still collapsed outside leaves their load where they fell. Everyone
  // starts the next round at the base with a full suit, and the rover comes home with whoever was driving it.
  function rollExpedition(s, endedTurn) {
    const x = s.expedition;
    if (!x) return;
    const next = freshBank();
    for (const crewId of Object.keys(x.carried || {})) {
      const items = x.carried[crewId];
      if (!Array.isArray(items) || !items.length) continue;
      const spot = (x.collapsed || {})[crewId];
      if (spot) x.drops.push({ id: endedTurn + ':' + crewId, x: spot.x, y: spot.y, items });
      else for (const it of items) bankItem(next, crewId, it, true);
    }
    while (x.drops.length > D.EXPEDITION.maxDrops) x.drops.shift();
    x.banked = next;
    x.carried = {};
    x.incidents = [];
    x.collapsed = {};
    x.benched = [];
    x.suits = {};
    x.refills = {};
    x.roverDriven = 0;
    if (x.rover && x.rover.driver) x.rover = null;
    x.flare = null; // a flare that had not hit yet is over with the round: everyone is home
    x.clock = 0;
    x.where = {};
  }

  function runway(s, report) {
    const got = (report.expedition && report.expedition.got) || {};
    const perSol = k => (report.delta[k] - (got[k] || 0)) / D.TURN_SOLS;
    const out = {};
    for (const k of ['o2', 'food']) {
      const d = perSol(k);
      out[k] = d >= 0 ? Infinity : Math.max(0, s.resources[k]) / -d;
    }
    const wNet = (report.production.water - report.consumption.water) / D.TURN_SOLS;
    out.water = wNet >= 0 ? Infinity : (Math.max(0, s.resources.water) + s.wallWater) / -wNet;
    return out;
  }

  function warnings(s, report) {
    const w = [];
    if (report.hypoxia > 0) w.push({ code: 'o2_out' });
    else if (report.runway.o2 < D.TURN_SOLS * 2) w.push({ code: 'o2_low' });
    if (report.dehydration > 0) w.push({ code: 'water_out' });
    else if (report.runway.water < D.TURN_SOLS * 2) w.push({ code: 'water_low' });
    if (report.autoDrained > 0) w.push({ code: 'wall_auto' });
    if (report.fed < 1) w.push({ code: 'food_out' });
    else if (report.runway.food < D.TURN_SOLS * 2) w.push({ code: 'food_low' });
    if (report.power.habShort) w.push({ code: 'hab_cold' });
    for (const type of D.SHED_ORDER) if (report.power.shed[type] > 0) w.push({ code: 'shed', module: type });
    if (report.greenhouse.cropsLost) w.push({ code: 'crops_lost' });
    if (report.unrepaired.length) w.push({ code: 'unrepaired', module: report.unrepaired[0] });
    for (const id of report.deaths) w.push({ code: 'death', crewId: id });
    for (const id of report.downs) w.push({ code: 'down', crewId: id });
    for (const c of s.crew) {
      if (c.status === 'down') w.push({ code: 'dying', crewId: c.id, turns: D.REVIVE.window - c.downTurns });
    }
    for (const c of report.crew) {
      if (c.status !== 'active') continue;
      if (c.dose > D.DOSE_LIMIT) w.push({ code: 'dose_over', crewId: c.id });
      else if (c.dose > D.DOSE_LIMIT * 0.85) w.push({ code: 'dose_high', crewId: c.id });
      if (c.health > 0 && c.health < 35) w.push({ code: 'health_low', crewId: c.id });
    }
    if (s.morale < 40) w.push({ code: 'morale_low' });
    return w;
  }

  function snapshot(s, report) {
    return {
      turn: s.turn,
      sol: s.sol,
      o2: Math.max(0, s.resources.o2),
      water: Math.max(0, s.resources.water),
      food: Math.max(0, s.resources.food),
      spares: s.resources.spares,
      materials: s.resources.materials,
      wall: s.wallWater,
      morale: s.morale,
      science: s.science,
      shielding: shielding(s),
      doses: s.crew.map(c => c.dose),
      health: s.crew.map(c => (c.status === 'dead' ? 0 : c.health)),
      status: s.crew.map(c => c.status),
      supply: report ? report.power.supply : null,
      load: report ? report.power.load : null,
      weather: report ? report.weather : null,
    };
  }

  function forecast(state, plan) {
    return simulate(state, plan, false).report;
  }

  function resolveTurn(state, plan) {
    const { state: s, report } = simulate(state, plan, true);
    rollExpedition(s, s.turn);
    s.turn += 1;
    s.sol += D.TURN_SOLS;

    if (!s.crew.some(isActive)) {
      const last = s.crew.find(c => report.deaths.includes(c.id) || report.downs.includes(c.id)) || s.crew[0];
      s.status = 'lost';
      s.endCause = { type: 'crew', reason: last.harm || 'health', crewId: last.id, sol: s.sol };
    } else if (s.turn >= D.TURNS) {
      s.status = 'success';
    }

    // Solo: if your astronaut died, you take over the first active crewmate. With nobody active the mission is over
    // (status 'lost' above), so nobody takes over and the pilot stays the astronaut you walked as.
    report.pilot = null;
    const pilot = s.pilot && s.crew.find(c => c.id === s.pilot);
    if (pilot && pilot.status === 'dead') {
      const next = s.crew.find(isActive) || null;
      report.pilot = { from: pilot.id, to: next ? next.id : null };
      if (next) s.pilot = next.id;
    }

    s.log.push({
      turn: report.turn, sol: report.sol, weather: report.weather,
      events: (state.events || []).map(e => e.type), choices: report.choices,
      repairs: report.repairs, breakdowns: report.breakdowns, injuries: report.injuries,
      started: report.started, completed: report.completed, scrapped: report.scrapped,
      revived: report.revived, downs: report.downs, deaths: report.deaths, requested: report.requested,
      shed: Object.keys(report.power.shed).filter(k => report.power.shed[k] > 0),
      habShort: report.power.habShort, autoDrained: report.autoDrained, fed: report.fed,
      hypoxia: report.hypoxia, dehydration: report.dehydration, science: report.science,
      solarShare: report.power.supply > 0 ? report.power.solarKw / report.power.supply : 0,
    });
    s.history.push(snapshot(s, report));
    if (s.status === 'active') beginTurn(s);
    else s.events = [];
    return { state: s, report };
  }

  function independenceOf(s) {
    const share = (a, b) => (b > 0 ? Math.min(1, a / b) : 0);
    const t = s.totals;
    return (share(t.o2Local, t.o2Used) + share(t.waterLocal, t.waterUsed) + share(t.foodLocal, t.foodUsed)) / 3;
  }

  function scoreMission(s) {
    const success = s.status === 'success';
    const survivors = s.crew.filter(c => c.status !== 'dead');
    const over = survivors.filter(c => c.dose > D.DOSE_LIMIT);
    const independence = independenceOf(s);
    const parts = {
      // A lost crew leaves samples and instruments behind: only transmitted results count.
      science: Math.round(success ? s.science : s.science * D.SCORE.abortScience),
      health: Math.round(mean(survivors.map(c => c.health))),
      radiation: Math.round(mean(survivors.map(c => Math.max(0, D.DOSE_LIMIT - c.dose))) * D.SCORE.radiation),
      crew: Math.round(survivors.length * D.SCORE.survivor -
        over.reduce((sum, c) => sum + D.SCORE.grounded + (c.dose - D.DOSE_LIMIT) * D.SCORE.overDose, 0)),
      independence: Math.round(independence * D.SCORE.independence),
      depot: success ? s.depot.drops * D.SCORE.unusedDrop : 0,
      completion: success ? D.SCORE.completion : 0,
    };
    const total = Object.values(parts).reduce((a, b) => a + b, 0);
    let grade = 'D';
    if (success) {
      for (const [g, min] of D.SCORE.grades) {
        if (total >= min) { grade = g; break; }
      }
    }
    return { total, parts, grade, independence };
  }

  function achievements(s) {
    const success = s.status === 'success';
    const got = new Set();
    const maxDose = Math.max(...s.crew.filter(c => c.status !== 'dead').map(c => c.dose), 0);
    if (s.turn >= 1) got.add('first_sol');
    if (success) got.add('sol500');
    if (success && s.totals.downs === 0 && s.crew.every(c => c.status === 'active')) got.add('full_crew');
    if (s.totals.revives > 0) got.add('revived');
    if (success && s.schedule.some(t => t.weather === 'global')) got.add('storm_survivor');
    if (success && independenceOf(s) >= 0.6) got.add('closed_loop');
    if (s.totals.foodLocal >= 1000) got.add('green_thumb');
    if (success && maxDose < 150) got.add('lead_apron');
    if (s.totals.built >= 5) got.add('builder');
    if (s.modules.shield.count >= D.MODULES.shield.max) got.add('fortress');
    if (s.totals.scrapped > 0) got.add('scrapper');
    if (success && s.totals.dropsUsed === 0) got.add('self_reliant');
    if (s.science >= 800) got.add('explorer');
    if (success && scoreMission(s).grade === 'S') got.add('grade_s');
    if (success && s.mass <= budgetFor(s.difficulty, s.crewSize) - 4) got.add('lightweight');
    if (s.totals.shelters >= 2) got.add('flare_dodger');
    if (success && s.totals.salvages > 0) got.add('oxygen_hero');
    if (success && s.coop) got.add('team_player');
    return D.ACHIEVEMENTS.filter(id => got.has(id));
  }

  // Engineering advice from Earth: the most urgent problems, in priority order.
  function advise(s, plan) {
    const f = forecast(s, plan);
    const remaining = (D.TURNS - s.turn) * D.TURN_SOLS;
    const out = [];
    if (f.power.habShort) out.push({ code: 'hab_cold' });
    if (f.hypoxia > 0) out.push({ code: 'o2_out' });
    else if (f.runway.o2 < remaining) out.push({ code: 'o2_runway', sols: Math.floor(f.runway.o2) });
    if (f.dehydration > 0) out.push({ code: 'water_out' });
    else if (f.runway.water < remaining) out.push({ code: 'water_runway', sols: Math.floor(f.runway.water) });
    if (f.fed < 1) out.push({ code: 'food_out' });
    else if (f.runway.food < remaining) out.push({ code: 'food_runway', sols: Math.floor(f.runway.food) });
    const down = s.crew.find(c => c.status === 'down');
    if (down && !f.revived.length) out.push({ code: 'crew_down', crewId: down.id });
    const turnsLeft = D.TURNS - s.turn;
    for (const c of f.crew) {
      const crew = s.crew.find(x => x.id === c.id);
      if (crew.status !== 'active' || crew.grounded) continue;
      if (crew.dose + c.doseDelta * turnsLeft > D.DOSE_LIMIT) { out.push({ code: 'dose_projection', crewId: c.id }); break; }
    }
    if (f.unrepaired.length) out.push({ code: 'broken', module: f.unrepaired[0] });
    const shed = D.SHED_ORDER.find(t => f.power.shed[t] > 0);
    if (shed) out.push({ code: 'power_shed', module: shed });
    const solarShare = f.power.supply > 0 ? f.power.solarKw / f.power.supply : 0;
    if (s.turn < D.GLOBAL_STORM_TURNS[1] && solarShare > 0.6) out.push({ code: 'storm_risk' });
    if (s.morale < 45) out.push({ code: 'morale' });
    if (s.resources.spares === 0 && activeCount(s, 'workshop') === 0) out.push({ code: 'spares' });
    if (!out.length) out.push({ code: 'all_good' });
    return out.slice(0, 3);
  }

  // Manifest-screen forecast: steady-state numbers for a proposed loadout.
  function summarizeLoadout(loadout, difficulty, crewSize) {
    const budget = budgetFor(difficulty, crewSize);
    const L = normalizeLoadout(loadout);
    const mass = loadoutMass(L);
    const s = buildState(L, 'MANIFEST', false, difficulty, crewSize);
    s.crops = s.crops.map(() => D.MODULES.greenhouse.growTurns);
    const plan = defaultPlan(s);
    plan.jobs.lena = 'maintenance';
    const f = simulate(s, plan, false).report;
    const storm = computePower(s, plan, 'global', seasonAt(0));
    const perSol = k => f.delta[k] / D.TURN_SOLS;
    const sols = {};
    for (const k of ['o2', 'food']) {
      const d = perSol(k);
      sols[k] = d >= 0 ? Infinity : s.resources[k] / -d;
    }
    const wNet = (f.production.water - f.consumption.water) / D.TURN_SOLS;
    sols.water = wNet >= 0 ? Infinity : s.resources.water / -wNet;
    sols.waterWithWall = wNet >= 0 ? Infinity : (s.resources.water + s.wallWater) / -wNet;
    const S0 = shielding(s);
    const doseIndoor = D.TURNS * D.TURN_SOLS * D.DOSE_RATE * (1 - S0);
    const mission = D.TURNS * D.TURN_SOLS;
    const warn = [];
    if (mass > budget + 1e-9) warn.push('over_budget');
    if (f.power.load < f.power.demand - 1e-9 || f.power.habShort) warn.push('power_short');
    if (storm.supply < f.power.habKw + (L.recycler ? D.MODULES.recycler.kw : 0)) warn.push('storm_risk');
    if (!L.recycler) warn.push('no_recycler');
    if (sols.o2 < mission) warn.push('o2_short');
    if (sols.waterWithWall < mission) warn.push('water_short');
    if (sols.food < mission) warn.push('food_short');
    if (doseIndoor > D.DOSE_LIMIT * 0.8) warn.push('dose_risk');
    if (!L.spares) warn.push('no_spares');
    if (!L.materials) warn.push('no_materials');
    if (!L.lab && !L.rover) warn.push('low_science');
    return {
      mass, budget, remaining: budget - mass, over: mass > budget + 1e-9,
      power: { clear: f.power.supply, storm: storm.supply, demand: f.power.demand, habKw: f.power.habKw },
      sols, shielding: S0, doseIndoor, warnings: warn, mission,
    };
  }

  return {
    createMission, resolveTurn, forecast, defaultPlan, scoreMission, achievements, advise,
    summarizeLoadout, validateLoadout, loadoutMass, normalizeLoadout,
    shielding, seasonAt, newMissionCode, rng, activeCount, independenceOf,
    buildSpots, touchesBase, canBuild, canRequest, difficultyOf, crewSizeOf, budgetFor, referenceKit, nextPlan,
    newExpedition, upgradeMission, repairExpedition, bankItem,
  };
});

    'lesson.storm_solar.title': 'Solar power has a weather problem',
    'lesson.storm_solar.body': 'A global dust storm hit while most of your power came from the Sun. In 2018 one of these storms blocked sunlight for months and ended the Opportunity rover. That is why NASA is developing fission surface power for crewed missions.',
    'lesson.spares.title': 'Spares are life support too',
    'lesson.spares.body': 'Breakdowns are certain on a 500-sol mission. What matters is whether someone can fix them: a crew member on maintenance, spare kits, and materials to improvise with.',
    'lesson.water.title': 'Close the water loop',
    'lesson.water.body': 'Four people use about 700 kg of water every 25 sols. Without recycling, no lander could carry enough. The ISS now recovers 98 % of its water for exactly this reason.',
    'lesson.o2.title': 'Oxygen margins',
    'lesson.o2.body': 'Each person breathes about 0.84 kg of oxygen a day. MOXIE proved oxygen can be made from Martian CO₂, but a plant that breaks without spares makes nothing.',
    'lesson.food.title': 'Food is mass',
    'lesson.food.body': 'Packaged food for 500 sols weighs about 3.6 tonnes. Hydroponics trade mass for power and crew time, and the first harvest comes only after a crop cycle.',
    'lesson.radiation.title': 'Shielding buys time outside',
    'lesson.radiation.body': 'Curiosity measured about 0.64 mSv per sol on the surface. Cruise to Mars and back adds about 660 mSv, which already passes NASA’s 600 mSv career limit. Every layer of shielding at the base gives crews more safe hours outside.',
    'lesson.spe.title': 'Take shelter from solar storms',
    'lesson.spe.body': 'A solar particle event can deliver in hours what the surface gives in weeks. Real Mars habitats plan a heavily shielded core where the crew waits it out.',
    'lesson.morale.title': 'People are a system too',
    'lesson.morale.body': 'Low morale slowed every job. Rest, fresh food and contact with home matter on long missions, and NASA studies them seriously.',
    'lesson.isru.title': 'Living off the land',
    'lesson.isru.body': 'You made much of your oxygen, water and food on Mars. Every kilogram produced locally is a kilogram that does not need to launch from Earth.',
    'lesson.margin.title': 'Margins win missions',
    'lesson.margin.body': 'You kept reserves of power, oxygen, water and dose, so surprises became problems you could solve instead of disasters.',
    'lesson.death.title': 'Every crew member counts',
    'lesson.death.body': 'Losing a crewmate means losing their skills. Injured or collapsed crew need a medic or a med bay, fast.',
    'lesson.revive.title': 'Medical capability saved a life',
    'lesson.revive.body': 'A crew member collapsed and came back. On Mars, help from Earth is months away, so the crew must be its own hospital.',

    'help.title': 'How to play',
    'help.1': 'Pack the lander. Everything has mass, and the budget is fixed. The flight review shows how long oxygen, water and food last and whether power survives a dust storm.',
    'help.2': 'Each round is 25 sols. Give each crew member a job. Specialists work 1.5× faster at their own jobs.',
    'help.3': 'Keep someone on Maintain: breakdowns need a crew member plus a spare kit or materials.',
    'help.4': 'Build next to the base with materials: shield layers on the HQ, solar arrays, hydroponics bays, extractors on ice, a med bay and more. Someone must be on Build for projects to move.',
    'help.5': 'Watch the forecast. It shows exactly what the next 25 sols will do before you commit.',
    'help.6': 'At 0 HP a crew member goes down. The medic on Rest & care, or anyone with a med bay, can revive them within 5 rounds. A second collapse is permanent.',
    'help.7': 'Each astronaut has a 300 mSv surface budget. Past it they are grounded and the mission loses a lot of score.',
    'help.8': 'Earth can drop food, water or materials from orbit a few times per mission, and Mission Control answers one question per round.',
    'help.10': 'Bring things home: ice, metal-rich rock, crashed cargo pods and science sites lie out on the map. Stand by one and hold E (or the action button) to load it into your backpack (3 loads, 8 in the rover), then walk back inside the dashed square around the HQ to deliver. Your suit holds 150 s of oxygen outside each round and pauses at the base; if it runs out you collapse. Deliveries count when the round advances.',

    'region.source': 'Source',
    'region.fact.plains': 'Like the floor of Jezero Crater, where Perseverance landed. About 3.5 billion years ago this 45-km crater had its own river delta and was filled with water.',
    'region.fact.dunes': 'Like the Bagnold Dunes at the foot of Mount Sharp, which Curiosity set out to study in 2015. No one had ever visited active dunes anywhere but Earth. Seen from orbit, some of them move as much as about 1 m every Earth year.',
    'region.fact.craters': 'Like the southern highlands. Mars has two faces: its southern half is ancient, cratered ground, while the north is younger and smoother and was influenced by extensive volcanism.',
    'region.fact.canyons': 'Like Valles Marineris, the Grand Canyon of Mars: about 3,870 km long, up to 600 km across, and about 9.3 km deep at its deepest.',
    'region.fact.icy': 'Like Arcadia Planitia, where orbiters mapped water ice less than 30 cm under the ground. "You wouldn\'t need a backhoe to dig up this ice. You could use a shovel," said NASA scientist Sylvain Piqueux.',
    'region.fact.volcanic': "Like the slopes of the volcano Arsia Mons. NASA's Mars Odyssey spotted seven very dark holes there, about 100 to 225 m across, that may be skylights into caves.",
    'lm.delta.name': 'Ancient river delta',
    'lm.delta.fact': 'Like the delta in Jezero Crater, a fan that formed about 3.5 billion years ago where a river met a lake. There, in 2022, Perseverance made its most abundant organic detections yet, in a rock called Wildcat Ridge.',
    'lm.tube.name': 'Lava tube',
    'lm.tube.fact': "Like the flanks of Arsia Mons, where a lava tube's ceiling collapsed in one spot and made a pit about 50 m across. The tube below is likely at least that big, much bigger than similar caves on Earth.",
    'lm.crater.name': 'Crater with a central peak',
    'lm.crater.fact': 'On Mars, craters wider than about 7 km stop being simple bowls: the walls collapse inward and form a central peak. It brings up material from deep below the surface, a good place to look for ancient rocks.',
    'lm.methane.name': 'Methane vent',
    'lm.methane.fact': 'Like Gale Crater, where Curiosity has repeatedly detected methane just above the ground: under half a part per billion on average, with spikes of up to 20. Microbes can make methane, but so can rocks, water and heat.',
    'lm.scarp.name': 'Exposed ice scarp',
    'lm.scarp.fact': "Like the eight slopes where NASA's Mars Reconnaissance Orbiter found thick buried ice laid bare, some as steep as 55 degrees. The fairly pure ice, likely snow from long ago, lies under just 1–2 m of rock and dust.",
    'lm.stardune.name': 'Giant star dune',
    'lm.stardune.fact': "Star dunes form when the sand-moving wind comes from several directions at different times of day or year. NASA's Mars Reconnaissance Orbiter spotted some between dunes pointing in opposite directions, a sign the area seems to be gathering sand.",
    'fm.arch.name': 'Rock arch',
    'fm.arch.fact': "In Tartarus Colles, NASA's HiRISE camera saw what may be a natural bridge, 23 m wide, over a narrow trough. The trough likely formed as a lava tube whose roof mostly caved in, leaving only a small section standing.",
    'fm.yardang.name': 'Yardang ridges',
    'fm.yardang.fact': "Yardangs are ridges scoured out by windblown sand. They are a hallmark of the Medusae Fossae Formation, imaged by NASA's Mars Odyssey: a patchy pile of eroding sediments spanning over 5,000 km along Mars' equator.",
    'fm.hoodoo.name': 'Hoodoos',
    'fm.hoodoo.fact': "Hoodoos are tall columns protected by a strong cap rock. Mars has something similar: NASA's Mars Reconnaissance Orbiter often sees river channels perched above the land, because the sediment inside them was stronger than its surroundings.",
    'fm.balanced.name': 'Balanced rock',
    'fm.balanced.fact': "NASA's HiRISE camera saw an oblong boulder, about 6 m tall and 3.5 m wide, that tumbled about 500 m down a slope on Mars and came to rest standing upright. Its dotted trail suggests it couldn't roll straight.",
    'fm.ventifact.name': 'Ventifacts',
    'fm.ventifact.fact': 'Wind-sharpened rocks are called ventifacts. In the foothills of Mount Sharp, Curiosity met scaly "gator-back" ventifacts made of sandstone, the hardest rock it has found on Mars. Rocks like these chewed up its wheels earlier in the mission.',
    'fm.layered.name': 'Layered outcrop',
    'fm.layered.fact': "In Becquerel Crater, rock layers averaging 3.6 m thick come in bundles of about 10. That matches a known 10-to-one pattern in how the tilt of Mars' axis changes, suggesting the rhythm comes from cycles in the planet's tilt.",
    'fm.deviltracks.name': 'Dust-devil tracks',
    'fm.deviltracks.fact': 'In southern Schiaparelli Basin, dark tracks form where dust devils scour off a thin blanket of bright dust, exposing darker rock beneath. Martian dust devils can grow as big as tornadoes on Earth, with plumes up to 9 km high.',
    'ks.cache.name': 'Supply cache',
    'ks.cache.log': 'Sol 96. Cache placed and sealed: O₂ canisters, spare kits and food for the crew. The seal is holding; next check in 50 sols. Kestrel Control: "Nice work. The crew launches in 300 sols."',
    'ks.wreck.name': 'Wrecked scout rover',
    'ks.wreck.log': 'Sol 458. Driving to the nearest pod as ordered, but it is nearly dark at noon and my cameras can barely see. Slid down a dune and tipped onto my side: wheel 4 cracked, panels in the sand, battery 9 %. Route map for the crew saved; sending at the next relay pass.',
    'ks.weather.name': 'Weather station',
    'ks.weather.log': 'Sol 455. Dust in the air has tripled in 5 sols, and every station reports the same: a global dust storm is coming. All units: charge your batteries and get ready to sleep through it. Scouts: drive to the nearest pod and park.',
    'ks.mast.name': 'Comms mast',
    'ks.mast.log': 'Sol 512. Storm over. The relay satellite passes twice a sol again, but it is getting old: one pass in five is lost. The scouts have been silent since sol 458, but their last route maps reached me. Saved here for the crew, with the position of every Kestrel unit in range.',
    'ks.pod.name': 'Abandoned hab pod',
    'ks.pod.log': 'Sol 977. Last message from Kestrel Control before the relay satellite went quiet: "The crew is coming, but not in time for us. Keep the pod warm for them." O₂ tanks full, heater on minimum, door unlocked. Waiting.',
    'ks.array.name': 'Dusty solar array',
    'ks.array.log': "Sol 410. Output down to 52 % of a clean panel; no dust devil has passed this way since sol 322. Battery: 410 charge cycles, capacity down to 81 %. Kestrel Control reports that the crew's launch has slipped to the next window, 26 months later. Switching off everything but the heaters.",
    'ks.label': 'Kestrel Survey log · story, fictional',

    'lesson.storm_solar.title': 'Điện mặt trời sợ thời tiết',
    'lesson.storm_solar.body': 'Một cơn bão bụi toàn cầu ập đến khi phần lớn điện của bạn đến từ Mặt Trời. Năm 2018, một cơn bão như vậy che nắng nhiều tháng và chấm dứt robot Opportunity. Vì thế NASA đang phát triển lò phân hạch trên bề mặt cho các sứ mệnh có người.',
    'lesson.spares.title': 'Phụ tùng cũng là hệ thống sự sống',
    'lesson.spares.body': 'Hỏng hóc là chắc chắn trong 500 sol. Điều quan trọng là có ai sửa được không: một người làm bảo trì, phụ tùng, và vật liệu để tự chế.',
    'lesson.water.title': 'Khép kín vòng tuần hoàn nước',
    'lesson.water.body': 'Bốn người dùng khoảng 700 kg nước mỗi 25 sol. Không tái chế thì không tàu nào chở đủ. ISS giờ thu hồi 98 % nước cũng vì lý do đó.',
    'lesson.o2.title': 'Dự phòng oxy',
    'lesson.o2.body': 'Mỗi người thở khoảng 0,84 kg oxy mỗi ngày. MOXIE chứng minh có thể tạo oxy từ CO₂ sao Hỏa, nhưng một trạm hỏng mà không có phụ tùng thì chẳng tạo được gì.',
    'lesson.food.title': 'Thực phẩm là khối lượng',
    'lesson.food.body': 'Đồ ăn đóng gói cho 500 sol nặng khoảng 3,6 tấn. Thủy canh đổi khối lượng lấy điện và công sức, và vụ đầu tiên chỉ có sau một chu kỳ trồng.',
    'lesson.radiation.title': 'Che chắn mua thêm thời gian ngoài trời',
    'lesson.radiation.body': 'Curiosity đo được khoảng 0,64 mSv mỗi sol trên bề mặt. Chuyến bay tới sao Hỏa và trở về thêm khoảng 660 mSv, đã vượt giới hạn cả sự nghiệp 600 mSv của NASA. Mỗi lớp che chắn ở căn cứ cho phi hành đoàn thêm giờ an toàn bên ngoài.',
    'lesson.spe.title': 'Trú ẩn khi có bão Mặt Trời',
    'lesson.spe.body': 'Một bão hạt Mặt Trời có thể mang lại trong vài giờ lượng bức xạ mà bề mặt cho trong nhiều tuần. Các thiết kế căn cứ thật đều có một lõi che chắn dày để phi hành đoàn trú qua.',
    'lesson.morale.title': 'Con người cũng là một hệ thống',
    'lesson.morale.body': 'Tinh thần thấp làm chậm mọi việc. Nghỉ ngơi, rau tươi và liên lạc với gia đình rất quan trọng trong nhiệm vụ dài, và NASA nghiên cứu điều này nghiêm túc.',
    'lesson.isru.title': 'Sống nhờ tài nguyên tại chỗ',
    'lesson.isru.body': 'Bạn đã tự tạo phần lớn oxy, nước và thực phẩm trên sao Hỏa. Mỗi kilôgam sản xuất tại chỗ là một kilôgam không phải phóng từ Trái Đất.',
    'lesson.margin.title': 'Dự phòng quyết định thành công',
    'lesson.margin.body': 'Bạn giữ dự phòng điện, oxy, nước và liều bức xạ, nên bất ngờ chỉ là vấn đề cần giải quyết chứ không thành thảm họa.',
    'lesson.death.title': 'Mỗi thành viên đều quý giá',
    'lesson.death.body': 'Mất một người là mất kỹ năng của người đó. Người bị thương hoặc ngã gục cần bác sĩ hoặc trạm y tế, thật nhanh.',
    'lesson.revive.title': 'Năng lực y tế đã cứu một mạng người',
    'lesson.revive.body': 'Một phi hành gia đã ngã gục và được cứu. Trên sao Hỏa, trợ giúp từ Trái Đất cách hàng tháng trời, nên phi hành đoàn phải tự làm bệnh viện của mình.',

    'help.title': 'Cách chơi',
    'help.1': 'Đóng gói tàu đổ bộ. Mọi thứ đều có khối lượng và ngân sách là cố định. Phần đánh giá chuyến bay cho biết oxy, nước, thực phẩm đủ bao lâu và điện có trụ qua bão bụi không.',
    'help.2': 'Mỗi vòng là 25 sol. Giao việc cho từng phi hành gia. Người làm đúng chuyên môn làm nhanh gấp 1,5 lần.',
    'help.3': 'Luôn có người Bảo trì: hỏng hóc cần một người cùng phụ tùng hoặc vật liệu.',
    'help.4': 'Xây cạnh căn cứ bằng vật liệu: lớp che chắn cho HQ, dàn pin, nhà thủy canh, máy khai thác trên băng, trạm y tế và hơn thế. Phải có người làm Xây dựng thì công trình mới tiến triển.',
    'help.5': 'Xem dự báo. Nó cho thấy chính xác 25 sol tới sẽ ra sao trước khi bạn quyết định.',
    'help.6': 'Hết HP, phi hành gia sẽ ngã gục. Bác sĩ làm Nghỉ & chăm sóc, hoặc bất kỳ ai khi có trạm y tế, có thể cứu trong vòng 5 vòng. Ngã gục lần thứ hai là mãi mãi.',
    'help.7': 'Mỗi phi hành gia có giới hạn 300 mSv trên bề mặt. Vượt qua sẽ bị cấm ra ngoài và nhiệm vụ mất nhiều điểm.',
    'help.8': 'Trái Đất có thể thả thực phẩm, nước hoặc vật liệu từ quỹ đạo vài lần mỗi nhiệm vụ, và Trung tâm điều khiển trả lời một câu hỏi mỗi vòng.',
    'help.10': 'Mang về căn cứ: băng, đá giàu kim loại, khoang hàng bị rơi và địa điểm khoa học nằm rải rác trên bản đồ. Đứng cạnh và giữ phím E (hoặc nút hành động) để chất vào ba lô (3 phần, 8 phần khi đi xe tự hành), rồi đi vào trong ô vuông nét đứt quanh trụ sở để giao hàng. Bộ đồ du hành có 150 giây oxy bên ngoài mỗi vòng và tạm dừng khi ở căn cứ; nếu hết oxy bạn sẽ ngã gục. Hàng giao sẽ được tính khi sang vòng mới.',

    'region.source': 'Nguồn',
    'region.fact.plains': 'Giống như đáy hố Jezero, nơi tàu Perseverance hạ cánh. Khoảng 3,5 tỷ năm trước, hố rộng 45 km này từng có châu thổ sông riêng và chứa đầy nước.',
    'region.fact.dunes': 'Giống như cồn cát Bagnold dưới chân núi Sharp, nơi tàu Curiosity bắt đầu nghiên cứu năm 2015. Trước đó chưa ai từng đến một cồn cát đang di chuyển ở bất kỳ đâu ngoài Trái Đất. Nhìn từ quỹ đạo, một số cồn cát dịch chuyển lên tới khoảng 1 m mỗi năm Trái Đất.',
    'region.fact.craters': 'Giống như vùng cao nguyên phía nam. Sao Hỏa có hai bộ mặt: nửa phía nam là vùng đất cổ xưa có nhiều hố va chạm, còn phía bắc trẻ hơn, bằng phẳng hơn và chịu ảnh hưởng của hoạt động núi lửa trên diện rộng.',
    'region.fact.canyons': 'Giống như Valles Marineris, "Grand Canyon của sao Hỏa": dài khoảng 3.870 km, rộng tới 600 km và sâu khoảng 9,3 km ở chỗ sâu nhất.',
    'region.fact.icy': 'Giống như đồng bằng Arcadia, nơi các tàu quỹ đạo phát hiện băng nước nằm dưới mặt đất chưa đến 30 cm. Nhà khoa học NASA Sylvain Piqueux nói: "Bạn không cần máy xúc để đào lớp băng này. Một cái xẻng là đủ."',
    'region.fact.volcanic': 'Giống như sườn núi lửa Arsia Mons. Tàu Mars Odyssey của NASA đã phát hiện ở đây bảy hố rất tối, rộng khoảng 100 đến 225 m, có thể là cửa sổ trời dẫn vào hang động.',
    'lm.delta.name': 'Châu thổ sông cổ',
    'lm.delta.fact': 'Giống như châu thổ trong hố Jezero, một dạng địa hình hình quạt hình thành khoảng 3,5 tỷ năm trước, nơi một con sông đổ vào hồ. Năm 2022, tàu Perseverance đã phát hiện lượng chất hữu cơ nhiều nhất từ đầu sứ mệnh tại đây, trong khối đá mang tên Wildcat Ridge.',
    'lm.tube.name': 'Ống dung nham',
    'lm.tube.fact': 'Giống như sườn núi lửa Arsia Mons, nơi trần của một ống dung nham sụp xuống ở một chỗ, tạo thành một hố rộng khoảng 50 m. Ống bên dưới có lẽ cũng rộng ít nhất chừng ấy, lớn hơn nhiều so với những hang tương tự trên Trái Đất.',
    'lm.crater.name': 'Hố va chạm có đỉnh trung tâm',
    'lm.crater.fact': 'Trên sao Hỏa, các hố va chạm rộng hơn khoảng 7 km không còn là những cái bát đơn giản: thành hố sụp vào trong và tạo nên một đỉnh ở giữa. Đỉnh này đưa vật chất từ sâu dưới bề mặt lên, nên là nơi thích hợp để tìm đá cổ.',
    'lm.methane.name': 'Lỗ thoát khí mêtan',
    'lm.methane.fact': 'Giống như hố Gale, nơi tàu Curiosity nhiều lần phát hiện khí mêtan ngay sát mặt đất: trung bình chưa đến nửa phần tỷ, có lúc vọt lên tới 20 phần tỷ. Vi sinh vật có thể tạo ra mêtan, nhưng đá, nước và nhiệt cũng có thể.',
    'lm.scarp.name': 'Vách băng lộ thiên',
    'lm.scarp.fact': 'Giống như tám sườn dốc nơi tàu Mars Reconnaissance Orbiter của NASA phát hiện những lớp băng dày bị chôn vùi nay lộ ra, có chỗ dốc tới 55 độ. Lớp băng khá tinh khiết này, có lẽ vốn là tuyết rơi từ rất lâu, chỉ nằm dưới 1–2 m đất đá và bụi.',
    'lm.stardune.name': 'Cồn cát hình sao khổng lồ',
    'lm.stardune.fact': 'Cồn cát hình sao hình thành khi gió cuốn cát thổi tới từ nhiều hướng, vào những thời điểm khác nhau trong ngày hoặc trong năm. Tàu Mars Reconnaissance Orbiter của NASA đã chụp được vài cồn như thế nằm giữa những cồn cát quay về hai hướng ngược nhau, dấu hiệu cho thấy cát dường như đang tích tụ ở vùng này.',
    'fm.arch.name': 'Vòm đá',
    'fm.arch.fact': 'Ở vùng Tartarus Colles, camera HiRISE của NASA đã chụp được một thứ có thể là cây cầu tự nhiên rộng 23 m, bắc qua một rãnh hẹp. Rãnh này có lẽ vốn là một ống dung nham mà phần mái đã sụp gần hết, chỉ còn sót lại một đoạn nhỏ.',
    'fm.yardang.name': 'Dải gờ yardang',
    'fm.yardang.fact': 'Yardang là những dải gờ hình thành khi cát bị gió cuốn bào mòn mặt đất. Chúng là nét đặc trưng của thành hệ Medusae Fossae, được tàu Mars Odyssey của NASA chụp lại: một khối trầm tích đang bị bào mòn, trải thành từng mảng dài hơn 5.000 km dọc xích đạo sao Hỏa.',
    'fm.hoodoo.name': 'Cột đá hoodoo',
    'fm.hoodoo.fact': 'Hoodoo là những cột đá cao được một lớp đá đỉnh cứng che chắn. Sao Hỏa cũng có thứ tương tự: tàu Mars Reconnaissance Orbiter của NASA thường thấy những lòng sông nhô cao hơn địa hình xung quanh, vì trầm tích bên trong chúng bền chắc hơn phần đất bao quanh.',
    'fm.balanced.name': 'Tảng đá cân bằng',
    'fm.balanced.fact': 'Camera HiRISE của NASA đã chụp được một tảng đá thuôn dài, cao khoảng 6 m và rộng 3,5 m, lăn khoảng 500 m xuống một sườn dốc trên sao Hỏa rồi dừng lại ở tư thế dựng đứng. Vệt lăn đứt quãng của nó gợi ý rằng nó không thể lăn thẳng.',
    'fm.ventifact.name': 'Đá gió mài',
    'fm.ventifact.fact': 'Những tảng đá bị gió mài sắc được gọi là ventifact. Ở vùng chân núi Sharp, tàu Curiosity đã gặp những ventifact bằng sa thạch, bề mặt sần như vảy nên được gọi là "lưng cá sấu", loại đá cứng nhất mà nó từng gặp trên sao Hỏa. Những tảng đá như thế từng làm nát bánh xe của nó trước đó trong sứ mệnh.',
    'fm.layered.name': 'Vỉa đá phân lớp',
    'fm.layered.fact': 'Ở hố Becquerel, các lớp đá dày trung bình 3,6 m xếp thành từng cụm khoảng 10 lớp. Tỉ lệ 10:1 này khớp với một quy luật đã biết trong sự thay đổi độ nghiêng trục quay của sao Hỏa, gợi ý rằng nhịp điệu của các lớp đá bắt nguồn từ những chu kỳ nghiêng của hành tinh.',
    'fm.deviltracks.name': 'Vệt lốc bụi',
    'fm.deviltracks.fact': 'Ở phía nam lòng chảo Schiaparelli, những vệt tối hình thành khi lốc bụi quét đi lớp bụi sáng mỏng phủ trên mặt đất, làm lộ ra lớp đá tối màu bên dưới. Lốc bụi trên sao Hỏa có thể lớn ngang những cơn lốc xoáy trên Trái Đất, với cột bụi cao tới 9 km.',
    'ks.cache.name': 'Thùng tiếp tế',
    'ks.cache.log': 'Sol 96. Đã đặt và niêm phong thùng tiếp tế: bình O₂, bộ phụ tùng và thực phẩm cho phi hành đoàn. Nắp vẫn kín; 50 sol nữa kiểm tra lại. Trung tâm điều khiển Kestrel: "Làm tốt lắm. Phi hành đoàn sẽ khởi hành sau 300 sol nữa."',
    'ks.wreck.name': 'Xác xe tự hành trinh sát',
    'ks.wreck.log': 'Sol 458. Đang chạy về khoang sinh hoạt gần nhất theo lệnh, nhưng giữa trưa mà trời gần như tối đen, camera hầu như không thấy gì. Trượt xuống một cồn cát và lật nghiêng: bánh số 4 nứt, tấm pin vùi trong cát, pin còn 9 %. Đã lưu bản đồ tuyến đường cho phi hành đoàn; sẽ gửi khi vệ tinh chuyển tiếp bay qua lần tới.',
    'ks.weather.name': 'Trạm khí tượng',
    'ks.weather.log': 'Sol 455. Lượng bụi trong không khí đã tăng gấp ba sau 5 sol, và trạm nào cũng báo như nhau: một cơn bão bụi toàn cầu đang kéo đến. Tất cả thiết bị: sạc đầy pin và chuẩn bị ngủ đông cho đến khi bão tan. Các xe trinh sát: chạy về khoang sinh hoạt gần nhất và đỗ lại.',
    'ks.mast.name': 'Cột ăng-ten liên lạc',
    'ks.mast.log': 'Sol 512. Bão đã tan. Vệ tinh chuyển tiếp lại bay qua hai lượt mỗi sol, nhưng nó đã cũ: cứ năm lượt thì mất một. Các xe trinh sát im lặng từ sol 458, nhưng bản đồ tuyến đường cuối cùng của chúng đã đến được đây. Đã lưu lại cho phi hành đoàn, cùng vị trí của mọi thiết bị Kestrel trong tầm phủ sóng.',
    'ks.pod.name': 'Khoang sinh hoạt bỏ hoang',
    'ks.pod.log': 'Sol 977. Tin nhắn cuối cùng từ Trung tâm điều khiển Kestrel trước khi vệ tinh chuyển tiếp im bặt: "Phi hành đoàn sẽ đến, nhưng không kịp gặp chúng ta. Hãy giữ ấm khoang cho họ." Bình chứa O₂ đầy, máy sưởi ở mức thấp nhất, cửa không khóa. Đang chờ.',
    'ks.array.name': 'Dàn pin mặt trời phủ bụi',
    'ks.array.log': 'Sol 410. Công suất chỉ còn 52 % so với khi tấm pin còn sạch; từ sol 322 đến nay chưa có cơn lốc bụi nào đi qua đây. Pin lưu trữ: 410 chu kỳ sạc, dung lượng còn 81 %. Trung tâm điều khiển Kestrel báo chuyến phóng của phi hành đoàn đã lùi sang cửa sổ phóng kế tiếp, muộn hơn 26 tháng. Tắt mọi hệ thống, chỉ giữ máy sưởi.',
    'ks.label': 'Nhật ký Khảo sát Kestrel · truyện hư cấu',

      { title: 'Radiation budget', body: 'The cruise to Mars and back adds about 660 mSv (1.84 mSv per day for 360 days). NASA’s career limit is 600 mSv, so a real crew is already over it before landing. That is an unsolved problem. The game gives each astronaut a 300 mSv surface budget to make the trade-off visible.', src: ['zeitlin', 'ochmo'] },
      { title: 'Oxygen, water and food', body: 'NASA’s life-support baseline is about 0.84 kg of oxygen per person per day. Drinking and food water is about 3.5 kg, roughly doubled by hygiene. Packaged ISS food runs about 1.8 kg per person per day with packaging.', src: ['bvad'] },
      { title: 'Recycling water', body: 'The ISS now recovers 98 % of its water from humidity and urine. The game uses 93 %, a little below the best result, because Mars dust and gravity add risk.', src: ['water98'] },
      { title: 'Oxygen from the air', body: 'MOXIE on Perseverance pulled oxygen out of Martian CO₂ 16 times, making 122 g in total and up to 12 g per hour. The game’s O₂ plant is a scaled-up MOXIE.', src: ['moxie'] },
      { title: 'Nuclear power', body: 'NASA’s Kilopower test in 2018 ran a reactor designed to give 1 to 10 kW for at least 10 years. The Fission Surface Power project is now aiming for 40 kW for the Moon and later Mars.', src: ['kilopower', 'fsp'] },
      { title: 'Dust storms', body: 'In June 2018 a planet-wide dust storm blocked sunlight over Opportunity for months. Its solar-powered batteries ran down and the rover never woke up. In the game a global storm cuts solar output to about 8 %.', src: ['opportunity'] },
      { title: 'Dust devils', body: 'Solar panels on Spirit and Opportunity slowly gathered dust, but passing whirlwinds sometimes blew them clean and boosted power. The game models dust as a slow loss that maintenance and dust devils undo.', src: ['spirit'] },
      { title: 'Perchlorate', body: 'The Phoenix lander found perchlorate salts, about 0.5 % of the soil by weight. They are toxic to people and must be washed out before soil is used for growing food.', src: ['perchlorate'] },
      { title: 'Solar conjunction', body: 'About every two years the Sun sits between Earth and Mars. NASA stops sending commands for about two weeks because the Sun’s plasma can corrupt radio signals.', src: ['conjunction'] },
      { title: 'Fresh food', body: 'Astronauts grow lettuce and other crops in the ISS Veggie chamber. Studies show that tending plants and eating fresh food help crew morale.', src: ['veggie'] },
      { title: 'Mission length', body: 'NASA’s Design Reference Architecture 5.0 plans a conjunction-class mission with about 500 days on the surface while Earth and Mars line up again for the trip home. Cargo landers go ahead of the crew, which inspired the orbital supply drops.', src: ['dra5'] },
      { title: 'What is simplified', body: 'Rounds are 25 sols long. Shielding percentages, build times, breakdown rates and science points are game values, chosen so that the trade-offs behave like the real ones.', src: [] },
      { title: 'Regions of Mars', body: 'The six regions of the endless map are modelled on real places: the floor of Jezero Crater (Plains), the Bagnold Dunes (Dune Sea), the cratered southern highlands (Crater Field), Valles Marineris (Canyon Lands), the shallow ice of Arcadia Planitia (Icy Plains) and the possible cave skylights of Arsia Mons (Volcanic Flanks).', src: ['jezero', 'bagnold', 'dichotomy', 'valles', 'iceMap', 'skylights'] },
    ],
    vi: [
      { title: 'Bức xạ trên bề mặt', body: 'Thiết bị RAD trên Curiosity đo được khoảng 0,64 mSv mỗi sol tại hố Gale. Sao Hỏa không có từ trường toàn cầu và khí quyển mỏng, nên tia vũ trụ xuống tới mặt đất. SOL 500 dùng con số này, giảm đi nhờ lớp che chắn của bạn.', src: ['hassler'] },
      { title: 'Giới hạn bức xạ', body: 'Chuyến bay tới sao Hỏa và trở về thêm khoảng 660 mSv (1,84 mSv mỗi ngày trong 360 ngày). Giới hạn cả sự nghiệp của NASA là 600 mSv, nên phi hành đoàn thật đã vượt mức trước cả khi hạ cánh. Đây là bài toán chưa có lời giải. Trò chơi cho mỗi phi hành gia 300 mSv trên bề mặt để thấy rõ sự đánh đổi.', src: ['zeitlin', 'ochmo'] },
      { title: 'Oxy, nước và thực phẩm', body: 'Theo mức chuẩn của NASA, mỗi người cần khoảng 0,84 kg oxy mỗi ngày. Nước uống và nấu ăn khoảng 3,5 kg, gấp đôi khi tính cả vệ sinh. Thực phẩm đóng gói trên ISS khoảng 1,8 kg mỗi người mỗi ngày tính cả bao bì.', src: ['bvad'] },
      { title: 'Tái chế nước', body: 'ISS giờ thu hồi 98 % nước từ hơi ẩm và nước tiểu. Trò chơi dùng 93 %, thấp hơn kết quả tốt nhất một chút, vì bụi và trọng lực sao Hỏa thêm rủi ro.', src: ['water98'] },
      { title: 'Oxy từ không khí', body: 'MOXIE trên Perseverance đã tách oxy từ CO₂ sao Hỏa 16 lần, tổng cộng 122 g và tối đa 12 g mỗi giờ. Trạm tạo oxy trong trò chơi là một MOXIE phóng to.', src: ['moxie'] },
      { title: 'Điện hạt nhân', body: 'Năm 2018, NASA thử lò Kilopower được thiết kế cho 1 đến 10 kW trong ít nhất 10 năm. Dự án Fission Surface Power hiện nhắm tới 40 kW cho Mặt Trăng và sau đó là sao Hỏa.', src: ['kilopower', 'fsp'] },
      { title: 'Bão bụi', body: 'Tháng 6/2018, một cơn bão bụi toàn cầu che nắng trên Opportunity suốt nhiều tháng. Pin năng lượng mặt trời cạn dần và robot không bao giờ tỉnh lại. Trong trò chơi, bão toàn cầu giảm điện mặt trời còn khoảng 8 %.', src: ['opportunity'] },
      { title: 'Lốc bụi', body: 'Tấm pin của Spirit và Opportunity bám bụi dần, nhưng thỉnh thoảng lốc xoáy thổi sạch và làm điện tăng lên. Trò chơi mô phỏng bụi là sự hao hụt chậm, được bảo trì và lốc bụi xóa đi.', src: ['spirit'] },
      { title: 'Perchlorat', body: 'Tàu Phoenix tìm thấy muối perchlorat chiếm khoảng 0,5 % khối lượng đất. Chúng độc với con người và phải được rửa sạch trước khi dùng đất trồng cây.', src: ['perchlorate'] },
      { title: 'Giao hội Mặt Trời', body: 'Khoảng hai năm một lần, Mặt Trời nằm giữa Trái Đất và sao Hỏa. NASA ngừng gửi lệnh khoảng hai tuần vì plasma Mặt Trời có thể làm hỏng tín hiệu vô tuyến.', src: ['conjunction'] },
      { title: 'Rau tươi', body: 'Phi hành gia trồng xà lách và các loại cây khác trong buồng Veggie trên ISS. Nghiên cứu cho thấy chăm cây và ăn rau tươi giúp tinh thần phi hành đoàn.', src: ['veggie'] },
      { title: 'Độ dài nhiệm vụ', body: 'Kiến trúc tham chiếu 5.0 của NASA dự kiến nhiệm vụ kiểu giao hội với khoảng 500 ngày trên bề mặt, chờ Trái Đất và sao Hỏa thẳng hàng lại để trở về. Các tàu chở hàng đi trước phi hành đoàn, và đó là cảm hứng cho các chuyến hàng từ quỹ đạo.', src: ['dra5'] },
      { title: 'Điều gì đã được đơn giản hóa', body: 'Mỗi vòng dài 25 sol. Phần trăm che chắn, thời gian xây, tỉ lệ hỏng hóc và điểm khoa học là giá trị của trò chơi, được chọn để các sự đánh đổi diễn ra giống thực tế.', src: [] },
      { title: 'Các vùng của sao Hỏa', body: 'Sáu vùng trên bản đồ vô tận được mô phỏng theo những nơi có thật: đáy hố Jezero (Đồng bằng), cồn cát Bagnold (Biển cồn cát), cao nguyên phía nam có nhiều hố va chạm (Cánh đồng hố va chạm), Valles Marineris (Vùng hẻm núi), lớp băng nông ở đồng bằng Arcadia (Đồng bằng băng) và các cửa sổ hang động có thể có trên núi Arsia Mons (Sườn núi lửa).', src: ['jezero', 'bagnold', 'dichotomy', 'valles', 'iceMap', 'skylights'] },
    ],

  const STR = { en, vi };

  function t(lang, key, params) {
    const table = STR[lang] || en;
    let s = table[key];
    if (s == null) s = en[key];
    if (s == null) return key;
    if (params) s = s.replace(/\{(\w+)\}/g, (m, k) => (params[k] != null ? String(params[k]) : m));
    return s;
  }

  function has(lang, key) {
    return (STR[lang] && STR[lang][key] != null) || en[key] != null;
  }

  return { t, has, STR, SOURCES, REGION_SOURCES, LANDMARK_SOURCES, FORMATION_SOURCES, NOTES, LANGS: ['en', 'vi'] };
});

  function moduleInner(type, opts) {

    return `<svg width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true">${moduleInner(type, opts)}</svg>`;

  // Supply pallets for the manifest
  const CRATES = {
    spares: `<rect x="12" y="28" width="40" height="24" rx="3" fill="#6b5e57"/><path d="M12 36h40" stroke="#8a7a70"/><path d="M28 40.5a5 5 0 0 0-2 5.8l-5 5 2.6 2.6 5-5a5 5 0 0 0 5.8-2" stroke="#e9a13b" stroke-width="2" fill="none" stroke-linecap="round"/>`,

    food: `<rect x="10" y="26" width="44" height="27" rx="3" fill="#7a6a4e"/><path d="M10 34h44M32 26v27" stroke="#5e5139"/><path d="M40 44c0-5 3-8 8-8 0 5-3 8-8 8z" fill="${GREEN}"/>`,
    o2: `<rect x="12" y="20" width="11" height="33" rx="5.5" fill="#86b8ea"/><rect x="26.5" y="20" width="11" height="33" rx="5.5" fill="#86b8ea"/><rect x="41" y="20" width="11" height="33" rx="5.5" fill="#86b8ea"/><rect x="14" y="23" width="3" height="26" rx="1.5" fill="#fff" opacity="0.35"/>`,
    water: `<rect x="10" y="24" width="44" height="29" rx="4" fill="#3b6fa6"/><path d="M32 30c-3.8 4.8-6 7.2-6 10.4a6 6 0 0 0 12 0c0-3.2-2.2-5.6-6-10.4z" fill="#9fd0ff"/>`,
    waterwall: `<rect x="8" y="18" width="48" height="35" rx="4" fill="#2f5f93"/><path d="M8 28h48M8 38h48" stroke="#5f93c9" stroke-width="1.4"/><path d="M32 42c-2.6 3-4 4.6-4 6.6a4 4 0 0 0 8 0c0-2-1.4-3.6-4-6.6z" fill="#bfe1ff"/>`,

  function itemArt(id, size) {
    const s = size || 44;
    const inner = CRATES[id] ? shadow(22) + CRATES[id] : moduleInner(id, { clean: 1 });
    return `<svg width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true">${inner}</svg>`;
  }

  // ---------- points of interest on the map (64×64, 3/4 view and light from the upper left, as the modules) ----------
  // Each fills a square as wide as its footprint, with its bottom edge on the footprint's: a footprint wider than deep (the
  // 3×2 wreck, the 4×2 array) leaves the top of the square to what stands up, as with the modules. A size that is not a
  // positive number gives 64 px; an unknown id gives a known drawing.
  const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const svg64 = (size, inner) => {

  };

  // The Kestrel Survey (spec §3.7): robotic hardware older than the outpost, so its paint is faded and dust lies on its
  // tops and feet. One teal accent marks the programme; a repaired machine's beacon is lit. Paint: hull, its lit top, its
  // shade, dark.
  const KH = '#c3b7a7', KT = '#d8cdbe', KS = '#968a7c', KD = '#3d3537', TEAL = '#4a978e', LIT = '#a9f4e4', DUST = '#a96f48', STRUT = '#7a736d';

  const KESTREL_ART = {
    // a supply cache on its four landing legs; opened, its lid stands up behind and the box is empty
    cache: done => shadow(27) +

    // a weather station: a box on a tripod with its own small panel; broken, the mast is snapped and its top leans over, a cup

    weather: done => shadow(22) +
      `<path d="M32 40 20 54M32 40l12 14" stroke="${STRUT}" stroke-width="2"/><path d="M15 51v-6" stroke="${STRUT}" stroke-width="1.6"/><path d="M8 45l4-7h10l-4 7z" fill="${done ? PANEL : '#4c5b76'}"/>` +
      (done ? `<path d="M10 41.5h10M15 38l-2 7" stroke="${GRID}" stroke-width="0.7" opacity="0.7"/>` : dust('M8 45l4-7h10l-4 7z', 0.6)) +

    mast: done => shadow(19) +
      `<path d="M31 16 9 53${done ? 'M33 16l22 37' : 'M33 16q7 14 4 24'}" stroke="#9b938c" stroke-width="0.8" opacity="0.8" fill="none"/>` +
      `<path d="M21 50h22l3 4H18z" fill="${STRUT}"/><path d="M26 51 30.5 13M38 51 33.5 13" stroke="#857d76" stroke-width="2"/><path d="M26.6 46l10.6-6-9.9-5 9.3-6-8.7-5 8.1-6" stroke="#857d76" stroke-width="1.1" fill="none"/>` +
      `<rect x="26" y="42" width="12" height="8" rx="1" fill="${KH}"/><rect x="26" y="45" width="12" height="2.5" fill="${TEAL}"/><path d="M34 24h5" stroke="#857d76" stroke-width="1.6"/>` +
      (done ? `<ellipse cx="43" cy="20" rx="8" ry="3.6" transform="rotate(-40 43 20)" fill="${KH}"/><path d="M43 20l4-5" stroke="${KS}" stroke-width="1.2"/><path d="M50 9a7 7 0 0 1 5 5M52 5a11 11 0 0 1 7 8" stroke="${LIT}" stroke-width="1.2" fill="none" opacity="0.7"/>`
        : `<ellipse cx="41" cy="30" rx="8" ry="3.6" transform="rotate(70 41 30)" fill="${KS}"/><ellipse cx="41.6" cy="30" rx="6" ry="2.4" transform="rotate(70 41.6 30)" fill="#7d7268"/>`) +
      beacon(32, 11, done),
    // an abandoned hab pod: its roof from outside; inside (the roof hidden), its room. Drawn for a 5×5 footprint: a ring of

          `<path d="M13 31h38M26 18v28M38 18v28" stroke="#5c524d" stroke-width="0.8"/><rect x="14" y="21" width="9" height="18" rx="1.5" fill="#8c8076"/><rect x="15" y="22" width="7" height="5" rx="1" fill="#c9bfb3"/>` +
          `<rect x="27" y="13" width="12" height="7" rx="1" fill="#3a3436"/><rect x="29" y="14.5" width="8" height="3" fill="${LIT}" opacity="0.65"/>` +
          `<rect x="44" y="20" width="6" height="12" rx="3" fill="#86b8ea"/><circle cx="47" cy="34" r="1.3" fill="${LIT}"/><rect x="42" y="37" width="8" height="8" rx="1" fill="${KS}"/>` + dust('M26 46q6-5 12 0z', 0.5)
        : `<rect x="2" y="3" width="60" height="45" rx="9" fill="#c9bdad"/><rect x="2" y="12" width="60" height="13" fill="${KT}"/><rect x="2" y="33" width="60" height="6" fill="#b4a898"/>` +
          `<path d="M14 4v43M26 3v45M38 3v45M50 4v43" stroke="${KS}" stroke-width="0.8" opacity="0.7"/><rect x="40" y="14" width="12" height="8" rx="2" fill="${KS}"/><rect x="42" y="16" width="8" height="4" rx="1" fill="#837768"/>` +
          dust('M6 22q7-4 14-1t12 0v3H6z', 0.3) + dust('M36 36q8-3 16 0v3H36z', 0.3) + `<path d="M10 12V2" stroke="${STRUT}" stroke-width="1.4"/>` + beacon(10, 2, false)),
    // a dusty solar array of three panels; salvaged, two panels are gone and the one left is wiped clean
    array: done => shadow(28) + [0, 1, 2].map(i => {

  // Natural formations (spec §3.7), real geology in regolith tones: lit top, face, shade and deep shade.
  const R0 = '#c4916a', R1 = '#a06a4b', R2 = '#7a4a34', R3 = '#4f2f23';
  const FORMATION_ART = {
    // a thin span over a wide opening, the ground showing through it
