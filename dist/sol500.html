      `<path d="M10 22l6-6 8-3 10-1 10 1 8 4 4 5-6-1-8-3-9-1-9 1-8 2z" fill="${R0}"/><path d="M52 17l4 5 1 8-2 8 3 8-1 8h-5l1-8-2-8 1-8-1-8z" fill="${R2}"/>` +
      `<path d="M19 54l-1-10 2-10 4-8 8-5-2 4-5 5-2 8-1 8 1 8z" fill="${R3}"/><path d="M5 44h12M48 44h8M7 32h11M49 30h7" stroke="${R3}" stroke-width="0.8" opacity="0.5"/>`,
    // three wind-carved ridges in a row: a blunt head into the wind (from the left), a long tail, grooves along the flanks
    yardang: [[14, 30, 43, 6, 9], [6, 43, 54, 9, 12], [20, 54, 32, 5, 7]].map(([x, y, l, d, h]) =>
      `<ellipse cx="${x + l / 2}" cy="${y + 0.5}" rx="${l / 2 + 1}" ry="2" fill="#000" opacity="0.3"/><path d="M${x} ${y}c0-${h - 4} 2-${h - 1} ${d}-${h}l${l - d} ${h - 2}v2z" fill="${R1}"/>` +
      `<path d="M${x} ${y}c0-${h - 4} 2-${h - 1} ${d}-${h}l${l - d} ${h - 2}-${l - d - 1}-${h - 5}c-3 0-${d - 1} 2-${d} ${h - 5}z" fill="${R0}"/><path d="M${x + d + 2} ${y - 3}l${l - d - 6} 2" stroke="${R2}" stroke-width="0.8" opacity="0.7"/>`).join(''),
    hoodoo: shadow(22) +
      `<path d="M21 54c1-9-2-15 0-23s-1-11 1-17h8c2 6-1 10 0 17s-1 14 1 23z" fill="${R1}"/><path d="M26 14h4c2 6-1 10 0 17s-1 14 1 23h-5z" fill="${R2}"/><ellipse cx="26" cy="14" rx="7.5" ry="3.4" fill="${R3}"/><ellipse cx="25.5" cy="12.8" rx="6.5" ry="2.3" fill="${R0}"/>` +
      `<path d="M38 54c1-7-1-11 0-17s-1-8 0-11h7c1 3-1 6 0 11s-1 10 1 17z" fill="${R1}"/><path d="M42 26h3c1 3-1 6 0 11s-1 10 1 17h-4z" fill="${R2}"/><ellipse cx="41.5" cy="26" rx="6" ry="2.8" fill="${R3}"/><ellipse cx="41" cy="25" rx="5" ry="1.9" fill="${R0}"/>` +
      `<path d="M10 54c1-6-1-9 0-13s0-5 1-7h5c1 2-1 4 0 7s0 7 1 13z" fill="${R1}"/><ellipse cx="13.5" cy="34" rx="4.8" ry="2.2" fill="${R3}"/><ellipse cx="13.2" cy="33.2" rx="4" ry="1.5" fill="${R0}"/>` +
      `<path d="M21 30h10M21 42h11M38 38h8M10 44h7" stroke="${R0}" stroke-width="1.2" opacity="0.6"/>`,
    // the oblong boulder of its fact: it tumbled down a slope, leaving a trail of dents behind it, and came to rest standing
    // on end, nearly twice as tall as it is wide
    balanced: shadow(16) +
      `<ellipse cx="18" cy="46" rx="2.6" ry="1.2" fill="${R3}" opacity="0.5"/><ellipse cx="12" cy="40" rx="2.2" ry="1" fill="${R3}" opacity="0.4"/><ellipse cx="7" cy="34.5" rx="1.8" ry="0.8" fill="${R3}" opacity="0.3"/>` +
      `<path d="M24 54 22 41 24 27 29 19 36 16 42 21 44 34 43 46 41 54z" fill="${R1}"/><path d="M24 54 22 41 24 27 29 19 36 16 32 22 28 34 27 54z" fill="${R0}"/>` +
      `<path d="M42 21 44 34 43 46 41 54H36L38 40 39 27z" fill="${R2}"/><path d="M30 28l3 4M33 45l2-5" stroke="${R2}" stroke-width="0.9" opacity="0.7"/><ellipse cx="47" cy="53" rx="3" ry="1.7" fill="${R2}"/>`,
    ventifact: shadow(24) + `<path d="M10 51 14 35l12-8 14 1 10 10 2 13z" fill="#4a4140"/><path d="M14 35l12-8 6 7-12 7z" fill="#7d716c"/><path d="M26 27l14 1 10 10-18-4z" fill="#605654"/>` +
      `<path d="M40 28l10 10 2 13-12-4z" fill="#2f2928"/><path d="M16 41l8-5M17 45l9-6M19 49l8-5" stroke="#2a2423" stroke-width="0.9"/>` +
      `<path d="M41 55l3-8 8-2 6 5-1 5z" fill="#4a4140"/><path d="M44 47l8-2 2 4-9 1z" fill="#7d716c"/><path d="M15 36l10-7" stroke="#b3a59d" stroke-width="0.8" opacity="0.7"/>`,
    // an outcrop of soft and hard layers: a steep face on the left, ledges stepping down to the right, a ragged cap
    layered: shadow(30) + [[3, 61, 46, 8, '#a2603f'], [4, 57, 39, 7, '#c99f78'], [6, 52, 32, 7, R1], [8, 46, 26, 6, '#cfa883']].map(([a, b, y, h, c]) =>
      `<path d="M${a} ${y + h}l1-${h}h${b - a - 3}l2 ${h}z" fill="${c}"/><path d="M${a + 1} ${y + 0.6}h${b - a - 3}" stroke="#fff" stroke-width="1.2" opacity="0.2"/><path d="M${b - 7} ${y}h5l2 ${h}h-7z" fill="#000" opacity="0.18"/>`).join('') +
      `<path d="M9 26l1-5 4-1 3-2 8-1 3 2h7l4 2 3 2 1 3z" fill="${R2}"/><path d="M9 26l1-5 4-1 3-2 8-1v9z" fill="${R1}"/>` +
      `<path d="M34 39v-7M44 54v-8" stroke="${R3}" stroke-width="0.9" opacity="0.4"/><path d="M52 54l2-3h4l2 3zM6 54l2-2h3l1 2z" fill="${R2}"/>`,
    // dust-devil tracks: dark lanes where the devils scoured off the bright dust, each as wide all along as the devil that
    // made it, crossing one another; flat on the ground, and each ends inside the square, so no track is cut off at its edge
    deviltracks: `<g fill="none" stroke="#1d110d" stroke-linecap="round" opacity="0.26"><path d="M6 49C17 45 27 38 35 32C43 26 50 21 58 17" stroke-width="4"/>` +

      `<path d="M31 58C39 55 47 50 58 45" stroke-width="3"/></g>`,
  };

  // Landmark props (spec §3.6): the skylight into a lava tube, and the methane vent (its puffs: ventPuff).
  const PROP_ART = {
    // a collapse pit with no rim: cracks round it, the far wall lit inside, black below, a slope of rubble going in at the front
    skylight: `<ellipse cx="32" cy="34" rx="28" ry="18" fill="#000" opacity="0.12"/><path d="M5 30l7 2M59 38l-7-2M18 52l4-4M47 15l-3 4M8 42l6-2" stroke="#1a0f0c" stroke-width="1" opacity="0.45"/>` +
      `<ellipse cx="32" cy="34" rx="22" ry="14" fill="#0b0607"/><path d="M10 34a22 14 0 0 1 44 0c-5-5-13-8-22-8s-17 3-22 8z" fill="#4a2a1f"/><path d="M10 34a22 14 0 0 1 44 0c-4-6-12-11-22-11s-18 5-22 11z" fill="#7a4632"/>` +
      `<path d="M10 34a22 14 0 0 0 44 0" stroke="#b07a58" stroke-width="1.2" fill="none" opacity="0.5"/><path d="M25 48l3-6 4-3 4 3 3 6z" fill="#4e2c21"/><path d="M27 46h2M33 44h2M30 41h2" stroke="#8a5538" stroke-width="1.6"/>` +
      `<ellipse cx="9" cy="24" rx="3.5" ry="2.2" fill="${R2}"/><ellipse cx="55" cy="47" rx="3" ry="1.9" fill="${R2}"/><ellipse cx="47" cy="12" rx="2.4" ry="1.5" fill="${R2}"/>`,
    // a low mound split by a fissure, its lips crusted pale, in a faint pale halo
    vent: `<ellipse cx="32" cy="42" rx="27" ry="12" fill="#e3d3ab" opacity="0.14"/><path d="M8 46c4-6 14-10 24-10s20 4 24 10c-6 3-14 4-24 4S14 49 8 46z" fill="#8a5a40"/>` +
      `<path d="M10 45c5-5 13-8 22-8s17 3 22 8c-8-3-14-4-22-4s-15 1-22 4z" fill="#a87250"/><path d="M18 43l6-2 4 1 5-2 4 1 6-2 5 1" stroke="#1a0f0c" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>` +
      `<path d="M19 41.4l5-2 4 1 5-2 4 1 6-2" stroke="#efe4c4" stroke-width="1" fill="none" opacity="0.7"/><path d="M13 47l5-2M46 45l5 2" stroke="#1a0f0c" stroke-width="1" opacity="0.6"/>` +
      `<ellipse cx="22" cy="46.5" rx="3" ry="1.1" fill="#efe4c4" opacity="0.45"/><ellipse cx="42" cy="46" rx="2.5" ry="1" fill="#efe4c4" opacity="0.45"/><ellipse cx="11" cy="50" rx="2.6" ry="1.6" fill="${R2}"/><ellipse cx="53" cy="49" rx="2.2" ry="1.4" fill="${R2}"/>`,
  };

  // opts: { done } opened, salvaged or repaired; { inside } the hab pod's room, drawn while you are in it (its roof hidden).
  function kestrel(id, size, opts) {
    const o = opts || {};
    return svg64(size, KESTREL_ART[own(KESTREL_ART, id) ? id : 'cache'](!!o.done, !!o.inside));
  }
  function formation(id, size) { return svg64(size, FORMATION_ART[own(FORMATION_ART, id) ? id : 'ventifact']); }
  function prop(id, size) { return svg64(size, PROP_ART[own(PROP_ART, id) ? id : 'vent']); }

  // The methane vent's puff, drawn over prop('vent') in the same square: three wisps rise from the fissure, grow and fade,
  // a third of a cycle apart, so phase 1 looks like phase 0 and the loop never jumps. Any phase is safe (not a number: 0).
  function ventPuff(phase, size) {
    const p = Number.isFinite(phase) ? phase - Math.floor(phase) : 0;
    let o = '';
    for (let i = 0; i < 3; i++) {
      const q = (p + i / 3) % 1, x = 33 + q * 10, y = 40 - q * 30, r = 2.5 + q * 8, a = (q * (1 - q) * 1.6).toFixed(2);
      o += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="#efe6dc" opacity="${a}"/>` +
        `<circle cx="${(x - r * 0.6).toFixed(1)}" cy="${(y + r * 0.4).toFixed(1)}" r="${(r * 0.7).toFixed(1)}" fill="#efe6dc" opacity="${a}"/>`;
    }
    return svg64(size, o);
  }

  // ---------- crew portraits (64×64) ----------
  let uid = 0;
  const GLYPH = {
    engineer: '<path d="M44 52.5a3 3 0 0 0-1 3.5l-3 3 1.6 1.6 3-3a3 3 0 0 0 3.5-1" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>',
    biologist: '<path d="M46 58v-4M46 54c0-2.4 1.8-4 4-4 0 2.4-1.8 4-4 4z" stroke="#fff" stroke-width="1.4" fill="none"/>',
    scientist: '<path d="M44.5 50h3M45 50v3l-2.6 4.6h7.2L47 53v-3" stroke="#fff" stroke-width="1.3" fill="none" stroke-linejoin="round"/>',
    medic: '<path d="M46 50.5v7M42.5 54h7" stroke="#fff" stroke-width="2" stroke-linecap="round"/>',
    commander: '<path d="m46 50.3 1.2 2.4 2.6.4-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.8 2.6-.4z" fill="#fff"/>',
  };

  function portrait(role, size, opts) {
    const s = size || 52;
    const o = opts || {};
    const c = ROLE[role] || '#aaa';
    const id = 'v' + (++uid);
    const tilt = o.variant || 0;
    return `<svg class="portrait ${o.status || ''}" width="${s}" height="${s}" viewBox="0 0 64 64" role="img" aria-label="${role}">` +
      `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#0d1624"/><stop offset="0.6" stop-color="#1f3c62"/><stop offset="1" stop-color="${c}"/></linearGradient>` +
      `<clipPath id="${id}c"><circle cx="32" cy="32" r="32"/></clipPath></defs>` +
      `<g clip-path="url(#${id}c)"><rect width="64" height="64" fill="#2b2023"/><circle cx="32" cy="32" r="32" fill="${c}" opacity="0.18"/>` +
      `<path d="M4 66c2-13 13-19 28-19s26 6 28 19z" fill="${HULL}"/><path d="M11 58h42" stroke="${c}" stroke-width="4"/>` +
      `<rect x="25" y="44" width="14" height="6" rx="2" fill="${HULL2}"/>` +
      `<circle cx="32" cy="27" r="18.5" fill="#f3eee7" stroke="${HULL2}" stroke-width="1.2"/>` +
      `<ellipse cx="32" cy="28.5" rx="13.2" ry="10.4" fill="url(#${id})"/>` +
      `<path d="M${22 + tilt} 24.5q6-6.5 16-4.2" stroke="#fff" stroke-width="2" opacity="0.55" fill="none" stroke-linecap="round"/>` +
      `<circle cx="${38 - tilt}" cy="33" r="1.4" fill="#fff" opacity="0.45"/>` +
      `<rect x="27.5" y="9.5" width="9" height="3.2" rx="1.6" fill="${c}"/>` +
      `<circle cx="46" cy="54" r="6.5" fill="${c}"/>${GLYPH[role] || ''}</g></svg>`;
  }

  // ---------- title landscape ----------
  function landscape() {
    let seed = 7;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    let stars = '';
    for (let i = 0; i < 90; i++) {
      const x = rnd() * 1600, y = rnd() * 330, r = rnd() * 1.3 + 0.3;
      stars += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r.toFixed(2)}" fill="#fff" opacity="${(0.25 + rnd() * 0.6).toFixed(2)}"/>`;
    }
    let dust = '';
    for (let i = 0; i < 40; i++) {
      dust += `<circle cx="${(rnd() * 1800).toFixed(0)}" cy="${(470 + rnd() * 200).toFixed(0)}" r="${(rnd() * 1.6 + 0.4).toFixed(2)}" fill="#e7b88a" opacity="${(0.15 + rnd() * 0.3).toFixed(2)}"/>`;
    }
    return `<svg viewBox="0 0 1600 700" preserveAspectRatio="xMidYMax slice" aria-hidden="true">` +
      `<defs>` +
      `<linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120c16"/><stop offset="0.42" stop-color="#271a24"/><stop offset="0.72" stop-color="#5a3834"/><stop offset="1" stop-color="#9c664b"/></linearGradient>` +
      `<radialGradient id="sung" cx="1170" cy="560" r="330" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f4f9ff"/><stop offset="0.05" stop-color="#cfe4fb"/><stop offset="0.28" stop-color="#8cbcec" stop-opacity="0.55"/><stop offset="1" stop-color="#8cbcec" stop-opacity="0"/></radialGradient>` +
      `<linearGradient id="fadeg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b1417" stop-opacity="0.92"/><stop offset="0.55" stop-color="#1b1417" stop-opacity="0.35"/><stop offset="1" stop-color="#1b1417" stop-opacity="0"/></linearGradient>` +
      `</defs>` +
      `<rect width="1600" height="700" fill="url(#skyg)"/>${stars}` +
      `<rect width="1600" height="700" fill="url(#sung)"/><circle cx="1170" cy="560" r="9" fill="#fbfdff"/>` +
      `<path d="M318 132c9-6 23-4 28 5s0 19-10 22-26 1-28-9 1-13 10-18z" fill="#8c7d74"/><circle cx="330" cy="143" r="2.4" fill="#6e6159"/>` +
      `<path d="M0 560 60 548 110 552 170 530 260 528 300 540 420 536 470 518 560 516 600 530 760 534 820 522 900 524 960 540 1100 546 1180 562 1260 552 1340 530 1420 526 1480 540 1600 536V700H0z" fill="#3a2322"/>` +
      `<path d="M0 600c140-30 260-24 400-8s260 18 400-6 300-40 420-20 260 34 380 20V700H0z" fill="#5b2d21"/>` +
      `<path d="M0 640c180-26 380-34 560-18 150 13 260 4 380-10 170-20 360-20 520 6 60 10 100 12 140 8V700H0z" fill="#7a3623"/>` +
      `<g class="dust-drift">${dust}</g>` +
      `<g transform="translate(1270 560)">` +
      `<path d="M-40 34a44 44 0 0 1 88 0z" fill="#1c1215"/><path d="M-26 22h52" stroke="#ffcf7a" stroke-width="3" stroke-dasharray="6 7" opacity="0.8"/>` +
      `<path d="M60 34 96 18 120 26 84 42z" fill="#1c1215"/><path d="M-110 34-74 18-50 26-86 42z" fill="#1c1215"/>` +
      `<path d="M20 -10 32 -34" stroke="#1c1215" stroke-width="3"/><circle cx="32" cy="-35" r="3" fill="#f46e5f" class="pulse"/></g>` +
      `<rect width="1600" height="700" fill="url(#fadeg)"/>` +
      `</svg>`;
  }

  root.SolArt = { icon, module, moduleInner, itemArt, portrait, landscape, ROLE, kestrel, formation, prop, ventPuff };
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
/*
 * SOL 500 — small SVG line charts for the debrief.
 * One y-axis per chart, 2 px lines, legend + direct end labels, crosshair tooltip, and a data table for screen readers.
 * lineChart config: { title, unit, series: [{ name, color, points: [[x, y], ...] }], refLines: [{ y, label }], xLabel, fmt,
 *                     xMin, xMax, xTicks (defaults: 0, max(500, data), 100: the sol axis) }
 * barChart config:  { title, rows: [{ label, value }], color, fmt, tableLabel }: horizontal bars, one hue, value at the tip
 */
(function (root) {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const W = 640, H = 230, M = { l: 48, r: 104, t: 14, b: 30 };

  function el(tag, attrs, parent) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }

  function niceMax(v) {
    if (v <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p;
    return 10 * p;
  }

  function lineChart(container, cfg) {
    const fmt = cfg.fmt || (v => Math.round(v).toLocaleString());
    const series = cfg.series.filter(s => s.points.length);
    const xs = series.flatMap(s => s.points.map(p => p[0]));
    const ys = series.flatMap(s => s.points.map(p => p[1]));
    const xMin = cfg.xMin != null ? cfg.xMin : 0;
    const xMax = cfg.xMax != null ? cfg.xMax : Math.max(500, ...xs);
    const xStep = cfg.xTicks || 100;
    const yMaxData = Math.max(1, ...ys, ...(cfg.refLines || []).map(r => r.y));
    const yMax = niceMax(yMaxData * 1.05);
    const lowest = Math.min(0, ...ys);
    const yMin = lowest < 0 ? -niceMax(-lowest * 1.05) : 0;
    const X = x => M.l + (x - xMin) / Math.max(1e-9, xMax - xMin) * (W - M.l - M.r);
    const Y = y => H - M.b - ((y - yMin) / (yMax - yMin)) * (H - M.t - M.b);

    const wrap = document.createElement('div');
    wrap.className = 'chart';
    if (series.length > 1) {
      const lg = document.createElement('div');
      lg.className = 'chart-legend';
      for (const s of series) {
        const item = document.createElement('span');
        const sw = document.createElement('i');
        sw.style.background = s.color;
        item.appendChild(sw);
        item.appendChild(document.createTextNode(s.name));
        lg.appendChild(item);
      }
      wrap.appendChild(lg);
    }

    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': cfg.title || '' });
    el('title', {}, svg).textContent = cfg.title || '';

    // grid + y axis
    const ticks = 4;
    for (let i = 0; i <= ticks; i++) {
      const v = yMin + ((yMax - yMin) / ticks) * i;
      const y = Y(v);
      el('line', { x1: M.l, x2: W - M.r, y1: y, y2: y, stroke: 'var(--line)', 'stroke-width': Math.abs(v) < 1e-9 ? 1.2 : 0.8 }, svg);
      const t = el('text', { x: M.l - 8, y: y + 4, 'text-anchor': 'end', fill: 'var(--fg-3)', 'font-size': 11, 'font-family': 'var(--font-data)' }, svg);
      t.textContent = fmt(v);
    }
    for (let x = xMin; x <= xMax + 1e-9; x += xStep) {
      const t = el('text', { x: X(x), y: H - M.b + 18, 'text-anchor': 'middle', fill: 'var(--fg-3)', 'font-size': 11, 'font-family': 'var(--font-data)' }, svg);
      t.textContent = String(x);
    }
    if (cfg.xLabel) {
      const t = el('text', { x: W - M.r, y: H - 2, 'text-anchor': 'end', fill: 'var(--fg-3)', 'font-size': 11 }, svg);
      t.textContent = cfg.xLabel;
    }

    // reference lines (e.g. dose budget)
    for (const r of cfg.refLines || []) {
      const y = Y(r.y);
      el('line', { x1: M.l, x2: W - M.r, y1: y, y2: y, stroke: 'var(--fg-2)', 'stroke-width': 1.2, 'stroke-dasharray': '5 4' }, svg);
      // Label sits inside the plot, above the line on the left, so it never meets the series end labels.
      const t = el('text', { x: M.l + 6, y: y - 6, fill: 'var(--fg-2)', 'font-size': 11 }, svg);
      t.textContent = r.label;
    }

    // lines
    for (const s of series) {
      const d = s.points.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
      el('path', { d, fill: 'none', stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg);
    }

    // direct labels at line ends, nudged apart
    const ends = series.map(s => {
      const p = s.points[s.points.length - 1];
      return { s, x: X(p[0]), y: Y(p[1]) };
    }).sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 13) ends[i].y = ends[i - 1].y + 13;
    for (const e of ends) {
      const last = e.s.points[e.s.points.length - 1];
      el('circle', { cx: X(last[0]), cy: Y(last[1]), r: 3.5, fill: e.s.color, stroke: 'var(--panel)', 'stroke-width': 2 }, svg);
      if (series.length <= 5) {
        const t = el('text', { x: W - M.r + 8, y: e.y + 4, fill: 'var(--fg-2)', 'font-size': 11 }, svg);
        t.textContent = e.s.name;
      }
    }

    // hover layer
    const cross = el('line', { y1: M.t, y2: H - M.b, stroke: 'var(--fg-3)', 'stroke-width': 1, visibility: 'hidden' }, svg);
    const dots = series.map(s => el('circle', { r: 4, fill: s.color, stroke: 'var(--panel)', 'stroke-width': 2, visibility: 'hidden' }, svg));
    const hit = el('rect', { x: M.l, y: M.t, width: W - M.l - M.r, height: H - M.t - M.b, fill: 'transparent' }, svg);
    const tip = document.createElement('div');
    tip.className = 'tip';
    tip.hidden = true;
    const allX = [...new Set(xs)].sort((a, b) => a - b);

    function show(evt) {
      const box = svg.getBoundingClientRect();
      const vx = ((evt.clientX - box.left) / box.width) * W;
      const sol = xMin + ((vx - M.l) / (W - M.l - M.r)) * (xMax - xMin);
      let best = allX[0];
      for (const x of allX) if (Math.abs(x - sol) < Math.abs(best - sol)) best = x;
      const cx = X(best);
      cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('visibility', 'visible');
      tip.textContent = '';
      const head = document.createElement('div');
      head.textContent = (cfg.xLabel || 'x') + ' ' + best;
      tip.appendChild(head);
      series.forEach((s, i) => {
        const p = s.points.find(q => q[0] === best);
        if (!p) { dots[i].setAttribute('visibility', 'hidden'); return; }
        dots[i].setAttribute('cx', X(p[0])); dots[i].setAttribute('cy', Y(p[1])); dots[i].setAttribute('visibility', 'visible');
        const row = document.createElement('div');
        const sw = document.createElement('span');
        sw.style.cssText = `display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:${s.color}`;
        row.appendChild(sw);
        row.appendChild(document.createTextNode(s.name + ' '));
        const b = document.createElement('b');
        b.textContent = fmt(p[1]) + (cfg.unit ? ' ' + cfg.unit : '');
        row.appendChild(b);
        tip.appendChild(row);
      });
      tip.hidden = false;
      tip.style.left = (cx / W) * 100 + '%';
      tip.style.top = (M.t / H) * 100 + '%';
    }
    function hide() {
      tip.hidden = true;
      cross.setAttribute('visibility', 'hidden');
      dots.forEach(d => d.setAttribute('visibility', 'hidden'));
    }
    hit.addEventListener('pointermove', show);
    hit.addEventListener('pointerdown', show);
    hit.addEventListener('pointerleave', hide);

    wrap.appendChild(svg);
    wrap.appendChild(tip);

    // accessible table view
    const det = document.createElement('details');
    const sum = document.createElement('summary');
    sum.className = 'hint';
    sum.textContent = cfg.tableLabel || 'Data table';
    det.appendChild(sum);
    const tw = document.createElement('div');
    tw.className = 'tablewrap';
    const table = document.createElement('table');
    table.className = 'log';
    const thead = table.createTHead().insertRow();
    [cfg.xLabel || 'x', ...series.map(s => s.name)].forEach(h => { const th = document.createElement('th'); th.textContent = h; thead.appendChild(th); });
    const tb = table.createTBody();
    for (const x of allX) {
      const r = tb.insertRow();
      r.insertCell().textContent = x;
      for (const s of series) {
        const p = s.points.find(q => q[0] === x);
        r.insertCell().textContent = p ? fmt(p[1]) : '';
      }
    }

<script>
/*
 * SOL 500 — co-op client. Talks to server.js: JSON POSTs for actions, one WebSocket for live updates.
 * Works on the home network (ws://) and through the Cloudflare share link (wss://).
 * Session { code, playerId, token } lives in sessionStorage, so each browser tab is its own player.

  'use strict';
  const KEY = 'sol500.lan';
  let session = null;
  let ws = null;        // the live socket, or null
  let handlers = null;  // { onRoom, onStatus, onPos, onFog, onEvent } while connected
  let retry = 0;
  let timer = null;
  let gen = 0;          // bumped by disconnect(): tells an in-flight recover() it is stale
  let hiddenAt = 0;

  async function info() {
    if (!/^https?:$/.test(location.protocol)) return null;

  async function post(path, body) {
    try {

      return await r.json();
    } catch (e) {
      return { error: 'network' };

  }

  function save(s) {
    session = { code: s.code, playerId: s.playerId, token: s.token };
    try { sessionStorage.setItem(KEY, JSON.stringify(session)); } catch (e) { /* private mode: keep in memory */ }
  }

  function restore() {
    try {
      const s = JSON.parse(sessionStorage.getItem(KEY) || 'null');
      if (s && s.code && s.playerId && s.token) session = s;
    } catch (e) { session = null; }
    return session;
  }

  function clear() {
    session = null;
    try { sessionStorage.removeItem(KEY); } catch (e) { /* ignore */ }
  }

  async function create(name) {
    const j = await post('/api/room/create', { name });
    if (j.code) save(j);
    return j;
  }

  async function join(code, name) {
    const j = await post('/api/room/join', { code: String(code || '').trim().toUpperCase(), name });
    if (j.code) save(j);
    return j;
  }

    if (!session) return;

    open();

  }

  // Newly seen fog goes over the socket. Returns false when it isn't open, so the caller keeps it and tries again.
  function sendReveal(map) {

    return true;
  }

  function dropForTest() { if (ws) ws.close(); }

  // bitsets (from M3) are dropped first so the mission stays far under the server's 64 KB limit.
  function recordSolo(mission, player) {
    const m = Object.assign({}, mission);
    if (m.expedition) m.expedition = Object.assign({}, m.expedition, { revealed: {} });
    return post('/api/history/solo', { mission: m, player: player || '' });
  }

  // A landmark's id is "L<i>,<j>" (its 256-tile cell), a structure's "S<i>,<j>" (its 64-tile cell). Each is only looked up
  // from a position inside its cell, as a find is from its chunk: you see a landmark's centre (22 tiles inside its cell)
  // and use a structure from its door (2 tiles inside) only from there, so an id sent from far away costs nothing. The
  // world reads them from its own cells, without building a chunk; they are frozen, like the cache.
  const LID = /^L(-?\d{1,7}),(-?\d{1,7})$/, SID = /^S(-?\d{1,7}),(-?\d{1,7})$/;
  // What turns an id from outside into the world's landmark or structure: how it is spelled (its first two numbers are its
  // cell), the grid of cells it lies on, the world's lookup (called through W each time, never held on to, so a test that
  // swaps it to count the lookups counts them all) and the error for none.
  const LANDMARK = { re: LID, grid: D.LANDMARKS, at: (seed, i, j) => W.landmarkAt(seed, i, j), none: () => ({ error: 'noLandmark' }) };
  const STRUCTURE = { re: SID, grid: D.STRUCTURES, at: (seed, i, j) => W.structureAt(seed, i, j), none: () => ({ error: 'noStructure' }) };
  // The one place it happens, for every action that takes such an id and for the two readers below: the landmark or the
  // structure, or the { error } of the first check to fail, with the world asked last. Not spelled so, or nothing there, is
  // K.none(); a position outside its cell is 'tooFar'.
  function poiAt(m, id, pos, K) {
    const g = idNums(K.re, id);
    if (!g) return K.none();
    if (!inCell(pos, g[0], g[1], K.grid.cell)) return { error: 'tooFar' };
    return K.at(W.seedOf(m.seed), g[0], g[1]) || K.none();
  }
  // The two readers say null to any refusal, whatever the reason.
  const found = o => (o.error ? null : o);
  function landmarkById(m, id, pos) { return okPos(pos) ? found(poiAt(m, id, pos, LANDMARK)) : null; }
  function structureById(m, id, pos) { return okPos(pos) ? found(poiAt(m, id, pos, STRUCTURE)) : null; }
  function loadsLeft(m, f, id) {
    const v = m.expedition.sites[id == null ? f.id : id];
    return Number.isFinite(v) ? v : D.FINDS[f.kind].loads[f.ring];
  }
  // What you can collect: a find, a landmark's site ("L<i>,<j>:<n>") or a formation's survey ("F<cx>,<cy>:0"), plus its id
  // and loads left, or { error }. Each is looked up only from inside what holds it: a find's or a formation's chunk (the
  // survey is at the formation's spot, 1.5 tiles or more inside it, no less than the reach), a landmark's cell (its sites
  // lie in its box, 3 tiles inside).
  const LSITE = /^L(-?\d{1,7}),(-?\d{1,7}):(\d{1,2})$/, FSITE = /^F(-?\d{1,7}),(-?\d{1,7}):0$/;
  // A landmark's site is spelled with its number after the landmark's id, and no landmark there is no find.
  const LANDMARK_SITE = Object.assign({}, LANDMARK, { re: LSITE, none: () => ({ error: 'noFind' }) });
  function siteAt(m, id, pos) {
    let g = idNums(ID, id), f = null;
    if (g) {
      if (!inCell(pos, g[0], g[1], W.CHUNK)) return { error: 'tooFar' };
      return findById(m, id) || { error: 'noFind' };
    }
    if ((g = idNums(LSITE, id))) {
      const l = poiAt(m, id, pos, LANDMARK_SITE);
      if (l.error) return l;
      f = l.sites[g[2]];
    } else if ((g = idNums(FSITE, id))) {
      if (!inCell(pos, g[0], g[1], W.CHUNK)) return { error: 'tooFar' };
      const k = chunkAt(m, g[0], g[1]).formations[0];
      f = k && k.sites[0];
    }
    return f ? Object.assign({ id, left: loadsLeft(m, f, id) }, f) : { error: 'noFind' };
  }

  // ---------- small helpers ----------
  const okPos = p => !!p && Number.isFinite(p.x) && Number.isFinite(p.y);
  const dist2 = (a, x, y) => (a.x - x) * (a.x - x) + (a.y - y) * (a.y - y);
  const nearPx = (pos, x, y, tiles) => dist2(pos, x, y) <= (tiles * T) * (tiles * T);
  const nearTile = (pos, tx, ty) => nearPx(pos, (tx + 0.5) * T, (ty + 0.5) * T, X.reach);
  // The base zone: the tiles within baseZone of the HQ either way (Chebyshev), so world pixels −128 up to (not including)
  // 192 on each axis, plus `slack` tiles for a position sent a moment ago.
  function inBaseZone(pos, slack) {
    if (!okPos(pos)) return false;
    const s = slack || 0, lo = -X.baseZone - s, hi = X.baseZone + 1 + s, tx = pos.x / T, ty = pos.y / T;
    return tx >= lo && tx < hi && ty >= lo && ty < hi;
  }
  const crewOf = (m, id) => m.crew.find(c => c.id === id) || null;
  const pack = (x, id) => (Array.isArray(x.carried[id]) ? x.carried[id] : []);
  const driving = (x, id) => !!id && !!x.rover && x.rover.driver === id;
  function capacity(m, crewId) { return driving(m.expedition, crewId) ? X.packRover : X.pack; }
  function suitOf(m, crewId) {
    const v = m.expedition.suits[crewId];
    return Number.isFinite(v) ? v : X.suit;
  }
  // Seconds of holding E for a find (or 'pickup', 'revive'), with the role's skill (spec §3.3), or for a structure (its
  // own seconds in D.STRUCTURES, the Engineer's where it has them; the hab pod has none, and 'pod' is a cargo pod's).
  function holdSeconds(kind, role) {
    const S = D.STRUCTURES.kinds[kind];
    if (S && S.hold) return role === 'engineer' && S.engineer ? S.engineer : S.hold;
    const base = kind === 'science' ? X.hold.survey : kind === 'pickup' ? X.hold.pickup : kind === 'revive' ? X.hold.revive : X.hold.load;
    const skill = D.SKILLS[role] || {};
    return base * (skill[kind] || 1);
  }

  // The crew member may act on the map: the mission is on, they are alive and active, and they are on their feet (not
  // collapsed waiting for a revive, nor sitting out the round after a solo collapse).
  function able(m, crewId) {
    if (!m || m.status !== 'active' || !m.expedition) return { error: 'badPhase' };
    const c = crewOf(m, crewId);
    if (!c) return { error: 'noCrew' };
    if (c.status !== 'active') return { error: 'notActive' };
    const x = m.expedition;
    if (x.collapsed[crewId]) return { error: 'collapsed' };
    if (x.benched.includes(crewId)) return { error: 'benched' };
    return { crew: c };
  }

  // What one load of a find gives. A cargo pod's loads are fixed by the mission code, not by who opens it.
  function itemFor(m, f, load, role) {
    const F = D.FINDS[f.kind];
    const item = { kind: f.kind, id: f.id, region: f.region };
    if (f.kind === 'ice' || f.kind === 'metal') return Object.assign(item, { res: F.res, amount: F.kg });
    if (f.kind === 'science') {
      const k = (f.region === CRATERS ? F.craters : 1) * (role === 'scientist' ? D.SKILLS.scientist.scienceBonus : 1);
      return Object.assign(item, { res: 'science', amount: Math.round(F.science[f.ring] * k), sub: f.sub });
    }
    return Object.assign(item, supply(W.hash(W.seedOf(m.seed), f.x, f.y, 700 + load)));
  }
  // A load of supplies (a cargo pod's, a supply cache's) from its hash: a spare kit (the rarest), food or an O₂ canister.
  function supply(h) {
    const pick = h % 5;
    if (pick === 0) return { res: 'spares', amount: 1 };
    if (pick <= 3) return { res: 'food', amount: D.FINDS.pod.food };
    return { res: 'o2', amount: X.canister.o2, canister: true };
  }
  function statsOf(x, crewId) {
    if (!x.stats[crewId] || typeof x.stats[crewId] !== 'object') x.stats[crewId] = { finds: {} };
    if (!x.stats[crewId].finds) x.stats[crewId].finds = {};
    return x.stats[crewId];
  }

  // ---------- actions ----------
  // Takes one load from a find, or a landmark's or a formation's site, next to you into your backpack.
  function collect(m, crewId, siteId, pos) {
    const a = able(m, crewId);
    if (a.error) return a;
    if (!okPos(pos)) return { error: 'badPos' };
    // A site is only in reach from inside what holds it. Checked before anything is built: an id from far away would cost a
    // build and push other rooms' chunks out of the shared cache.
    const f = siteAt(m, siteId, pos);
    if (f.error) return f;
    if (!nearTile(pos, f.x, f.y)) return { error: 'tooFar' };
    if (f.left <= 0) return { error: 'empty' };
    const x = m.expedition, mine = pack(x, crewId);
    if (mine.length >= capacity(m, crewId)) return { error: 'full' };
    const item = itemFor(m, f, D.FINDS[f.kind].loads[f.ring] - f.left, a.crew.role);
    x.carried[crewId] = mine.concat([item]);
    x.sites[siteId] = f.left - 1;
    const st = statsOf(x, crewId);
    st.finds[f.kind] = (st.finds[f.kind] || 0) + 1;
    return { ok: true, item, left: f.left - 1 };
  }

  // Everything in your backpack goes into the round's bank; it counts when the round advances.
  function deliver(m, crewId, pos) {
    const a = able(m, crewId);
    if (a.error) return a;
    if (!inBaseZone(pos, X.reach)) return { error: 'notAtBase' };
    const x = m.expedition, mine = pack(x, crewId);
    if (!mine.length) return { error: 'empty' };
    for (const it of mine) E.bankItem(x.banked, crewId, it, false);
    x.carried[crewId] = [];
    return { ok: true, items: mine };
  }

  // Breathes an O₂ canister from your backpack now: +45 s of suit. Only outside the base zone, and only when your suit has
  // room for all of it, so a canister is never wasted (carried home it is worth 30 kg of the base's O₂). `live` is the suit
  // level your own game has now: the one it last reported can be up to 2 s old.
  function useCanister(m, crewId, pos, live) {
    const a = able(m, crewId);
    if (a.error) return a;
    const x = m.expedition, mine = pack(x, crewId), i = mine.findIndex(it => it && it.canister);
    if (i < 0) return { error: 'noCanister' };
    if (!okPos(pos)) return { error: 'badPos' };
    if (inBaseZone(pos, 0)) return { error: 'atBase' };
    setSuit(m, crewId, live);
    if (suitOf(m, crewId) > X.suit - X.canister.suit) return { error: 'suitFull' };
    x.carried[crewId] = mine.slice(0, i).concat(mine.slice(i + 1));
    x.suits[crewId] = Math.min(X.suit, suitOf(m, crewId) + X.canister.suit);
    return { ok: true, suit: x.suits[crewId] };
  }

  // Picks up a dropped load (a collapsed crew member's), as much as your backpack takes.
  function pickUp(m, crewId, dropId, pos) {
    const a = able(m, crewId);
    if (a.error) return a;
    if (!okPos(pos)) return { error: 'badPos' };
    const x = m.expedition, d = x.drops.find(k => k.id === dropId);
    if (!d) return { error: 'noDrop' };
    if (!nearPx(pos, d.x, d.y, X.reach)) return { error: 'tooFar' };
    const mine = pack(x, crewId), room = capacity(m, crewId) - mine.length;
    if (room <= 0) return { error: 'full' };
    const take = d.items.slice(0, room);
    x.carried[crewId] = mine.concat(take);
    d.items = d.items.slice(room);
    if (!d.items.length) x.drops = x.drops.filter(k => k !== d);
    return { ok: true, items: take, left: d.items.length };
  }

  // Your suit ran out outside the base zone. In co-op you wait where you fell for a crewmate to revive you; if nobody does
  // before the round advances, it counts as a collapse then. In solo nobody can come, so the collapse counts now, your load
  // stays where you fell and you are back at the base until the next round. A driver's game also says how far the rover
  // went (`driven`), so the last seconds of driving count too.
  function collapse(m, crewId, pos, driven) {
    const a = able(m, crewId);
    if (a.error) return a;
    if (!okPos(pos)) return { error: 'badPos' };
    if (inBaseZone(pos, 0)) return { error: 'atBase' };
    const x = m.expedition, spot = { x: Math.round(pos.x), y: Math.round(pos.y) };
    x.suits[crewId] = 0;
    if (driving(x, crewId)) {
      setRoverDriven(m, crewId, driven);
      x.rover = { x: spot.x, y: spot.y };
    }
    if (m.coop) {
      x.collapsed[crewId] = spot;
      return { ok: true, waiting: true };
    }
    x.incidents.push({ crewId, kind: 'collapse' });
    const mine = pack(x, crewId);
    if (mine.length) {
      x.drops.push({ id: m.turn + ':' + crewId, x: spot.x, y: spot.y, items: mine });
      while (x.drops.length > X.maxDrops) x.drops.shift();
    }
    x.carried[crewId] = [];
    x.benched.push(crewId);
    return { ok: true, benched: true };
  }

  // Co-op: stand by a collapsed crewmate and hold E. They get up with 30 s of suit and nothing is recorded.
  function revive(m, crewId, targetId, pos) {
    const a = able(m, crewId);
    if (a.error) return a;
    if (!m.coop) return { error: 'solo' };
    if (!okPos(pos)) return { error: 'badPos' };
    const x = m.expedition, spot = Object.prototype.hasOwnProperty.call(x.collapsed, targetId) ? x.collapsed[targetId] : null;
    if (!spot) return { error: 'notCollapsed' };
    if (!nearPx(pos, spot.x, spot.y, X.reach)) return { error: 'tooFar' };
    delete x.collapsed[targetId];
    x.suits[targetId] = X.reviveSuit;
    return { ok: true };
  }

  // The rover's bay: the centre of its tile on the build grid (world pixels), or null if the base has no rover.
  function bay(m) {
    const t = m.layout.find(k => k.type === 'rover');
    return t ? { x: (t.x + W.BASE_RECT.x + 0.5) * T, y: (t.y + W.BASE_RECT.y + 0.5) * T } : null;
  }
  // Gets into the rover, at its bay or where it was parked. One driver at a time.
  function board(m, crewId, pos) {
    const a = able(m, crewId);
    if (a.error) return a;
    if (!okPos(pos)) return { error: 'badPos' };
    const x = m.expedition;
    if (E.activeCount(m, 'rover') <= 0) return { error: 'noRover' };
    if (x.rover && x.rover.driver) return x.rover.driver === crewId ? { ok: true } : { error: 'taken' };
    if (roverLeft(m) <= 0) return { error: 'flat' };
    const at = x.rover || bay(m);
    if (!at) return { error: 'noRover' };
    if (!nearPx(pos, at.x, at.y, X.reach + 0.5)) return { error: 'tooFar' };
    x.rover = { driver: crewId };
    return { ok: true };
  }
  // Gets out: the rover stays where you are, or goes back to its bay if you are at the outpost. The driver's game says how
  // far it went (`driven`), so the last seconds of driving count too.
  function park(m, crewId, pos, driven) {
    if (!m || m.status !== 'active' || !m.expedition) return { error: 'badPhase' };
    const x = m.expedition;
    if (!driving(x, crewId)) return { error: 'notDriving' };
    if (!okPos(pos)) return { error: 'badPos' };
    setRoverDriven(m, crewId, driven);
    const home = nearPx(pos, 0.5 * T, 0.5 * T, X.roverHome);
    x.rover = home ? null : { x: Math.round(pos.x), y: Math.round(pos.y) };
    return { ok: true, home };
  }

  // The rover's battery: it drives roverRange tiles a round and recharges overnight (spec ruling, M4a).
  function roverLeft(m) { return Math.max(0, X.roverRange - (Number(m.expedition.roverDriven) || 0)); }
  // How far the rover has been driven this round, as the driver's game reports it. It only ever goes up.
  function setRoverDriven(m, crewId, tiles) {
    const x = m && m.expedition;
    if (!x || !driving(x, crewId) || typeof tiles !== 'number' || !Number.isFinite(tiles)) return;
    x.roverDriven = Math.max(Number(x.roverDriven) || 0, Math.min(X.roverRange, tiles));
  }

  // The suit level a crew member's own game reports (it is drained there, frame by frame). Kept between 0 and full;
  // ignored while they are collapsed (their suit is empty until a crewmate revives them), and anything but a number is junk.
  function setSuit(m, crewId, seconds) {
    const x = m && m.expedition;
    if (!x || !crewOf(m, crewId) || x.collapsed[crewId] || typeof seconds !== 'number' || !Number.isFinite(seconds)) return;
    x.suits[crewId] = Math.max(0, Math.min(X.suit, seconds));
  }

  // Solo play: where your astronaut stands, saved every 2 s with the suit, so a reload puts you back there instead of giving
  // you a free walk home. Forgotten at the end of the round, when everyone is back at the base.
  function setWhere(m, crewId, pos) {
    const x = m && m.expedition;
    if (!x || !crewOf(m, crewId) || !okPos(pos)) return;
    x.where[crewId] = { x: Math.round(pos.x), y: Math.round(pos.y) };
  }
  function whereOf(m, crewId) {
    const x = m && m.expedition, w = x && x.where && Object.prototype.hasOwnProperty.call(x.where, crewId) ? x.where[crewId] : null;
    return okPos(w) ? { x: w.x, y: w.y } : null;
  }

  // ---------- points of interest (spec §3.6, §3.7, M4c) ----------
  // The first crew member to see a landmark's centre discovers it: every screen shows its card (in co-op the server sends
  // a `discover` event) and they bank a one-time reward, 80–150 science by the landmark (the Scientist half again). Seeing
  // is the game's call, from its fog; the rules check the centre was within SIGHT tiles, the widest view anyone has (the
  // rover's, on a star dune's crest) plus the slack. Weather and walking only shrink a view, so no real sighting is refused.
  const SIGHT = D.DANGERS.view.rover + D.DANGERS.view.crest + X.reach;
  function discover(m, crewId, landmarkId, pos) {
    const a = able(m, crewId);
    if (a.error) return a;
    if (!okPos(pos)) return { error: 'badPos' };
    const l = poiAt(m, landmarkId, pos, LANDMARK), x = m.expedition;
    if (l.error) return l;
    if (x.landmarks[l.id]) return { error: 'known' };
    if (!nearPx(pos, (l.x + 0.5) * T, (l.y + 0.5) * T, SIGHT)) return { error: 'tooFar' };
    const [lo, hi] = D.LANDMARKS.science, base = lo + W.hash(W.seedOf(m.seed), l.i, l.j, 1300) % (hi - lo + 1);
    const science = Math.round(base * (a.crew.role === 'scientist' ? D.SKILLS.scientist.scienceBonus : 1));
    x.landmarks[l.id] = { by: crewId, round: m.turn };
    E.bankItem(x.banked, crewId, { kind: 'landmark', res: 'science', amount: science, region: l.region }, false);
    const st = statsOf(x, crewId);
    st.landmarks = (st.landmarks || 0) + 1;
    return { ok: true, landmark: l.id, science };
  }

  // Kestrel structures (spec §3.7): hold E at the door to open a supply cache, to salvage a wreck or a solar array, or to
  // repair a weather station or a comms mast, once each (x.structures[id]). Their loads go into your backpack and what
  // does not fit waits at the door as a drop, picked up like any other (C2). A repaired weather station reveals the fog
  // round it, banks its science and forecasts the weather a round ahead for a few rounds (C1); a repaired mast marks what
  // is near it on the minimap (mastMarks, C4). The game times the hold (holdSeconds). A hab pod has no hold: see refill.
  const DONE = { cache: 'used', wreck: 'used', array: 'used', weather: 'repaired', mast: 'repaired' };
  // What a structure holds, fixed by the mission code like a cargo pod's loads: a cache's 1–2 supplies, a wreck's 2–3
  // metal loads and spare kit, an array's materials (a load of them weighs what a metal find's does).
  function contents(m, s) {
    const K = D.STRUCTURES.kinds[s.kind], seed = W.seedOf(m.seed), item = o => Object.assign({ kind: s.kind, id: s.id, region: s.region }, o);
    const span = ([lo, hi], salt) => lo + W.hash(seed, s.i, s.j, salt) % (hi - lo + 1);
    const loads = (n, o) => Array.from({ length: n }, (_, k) => item(typeof o === 'function' ? o(k) : o));
    const metal = { res: 'materials', amount: D.FINDS.metal.kg };
    if (s.kind === 'cache') return loads(span(K.loads, 1310), k => supply(W.hash(seed, s.i, s.j, 1320 + k)));
    if (s.kind === 'wreck') return loads(span(K.metal, 1311), metal).concat(loads(K.spares, { res: 'spares', amount: 1 }));
    if (s.kind === 'array') return loads(K.materials, metal);
    return [];
  }
  // Reveals every tile whose middle is within r tiles of (cx, cy) (tile units) in x.revealed, stored as the game's fog is.
  // Returns what changed ({ "<cx>,<cy>": base64 }) for the co-op server to share.
  function revealAround(m, cx, cy, r) {
    const diff = {}, C = W.CHUNK;
    for (let ky = Math.floor((cy - r) / C); ky <= Math.floor((cy + r) / C); ky++) {
      for (let kx = Math.floor((cx - r) / C); kx <= Math.floor((cx + r) / C); kx++) {
        const bits = Fog.empty();
        for (let ly = 0; ly < C; ly++) for (let lx = 0; lx < C; lx++) {
          const dx = kx * C + lx + 0.5 - cx, dy = ky * C + ly + 0.5 - cy;
          if (dx * dx + dy * dy <= r * r) Fog.set(bits, lx, ly);
        }
        if (Fog.count(bits)) diff[kx + ',' + ky] = Fog.encode(bits);
      }
    }
    return Fog.mergeMap(m.expedition.revealed, diff);
  }
  function interact(m, crewId, structId, pos) {
    const a = able(m, crewId);
    if (a.error) return a;
    if (!okPos(pos)) return { error: 'badPos' };
    const s = poiAt(m, structId, pos, STRUCTURE), x = m.expedition;
    if (s.error) return s;
    if (!DONE[s.kind]) return { error: 'badKind' };
    if (x.structures[s.id]) return { error: 'done' };
    if (!nearTile(pos, s.x, s.y)) return { error: 'tooFar' };
    const loads = contents(m, s), mine = pack(x, crewId), room = Math.max(0, capacity(m, crewId) - mine.length);
    const items = loads.slice(0, room), rest = loads.slice(room);
    x.carried[crewId] = mine.concat(items);
    if (rest.length) {
      x.drops.push({ id: s.id, x: (s.x + 0.5) * T, y: (s.y + 0.5) * T, items: rest });
      while (x.drops.length > X.maxDrops) x.drops.shift();
    }
    x.structures[s.id] = DONE[s.kind];
    let fog = {};
    if (s.kind === 'weather') {
      const K = D.STRUCTURES.kinds.weather, b = s.box;
      fog = revealAround(m, (b[0] + b[2] + 1) / 2, (b[1] + b[3] + 1) / 2, K.reveal);
      E.bankItem(x.banked, crewId, { kind: 'weather', res: 'science', amount: K.science, region: s.region }, false);
      x.forecastUntil = m.turn + K.forecast; // this round and the next 3 (C1)
    }
    const st = statsOf(x, crewId);
    st.structures = (st.structures || 0) + 1;
    return { ok: true, done: x.structures[s.id], items, left: rest.length, fog };
  }

  // The world's decor props (src/worldgen.js, M4c: whole tiles, the kinds above plus `rock`) on the tiles of image chunk

  function propsNear(world, ix, iy) {

  function paintChunk(world, ix, iy, canvas, scale) {

      const h = W.hash(world.seed, p.x, p.y, 912);

  // ---------- the painter: image chunks and mini images, with their caches ----------
  function createPainter(world, opts) {
    const o = opts || {};
    const makeCanvas = o.canvas || ((w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; });
    const now = o.now || (() => performance.now());

    const minis = new Map();  // "cx,cy" → { c, stamp, used }
    const miniWant = new Set();

    // The cap never pushes out a chunk the current view needs: a very wide window just keeps more.

      view = [a, b, c, d];

    // Until a chunk is repainted, flat() covers it.
    function setScale(s) {

      scale = s;
      images.clear();
      queue = view ? wanted() : [];
    }

    function work(deadline, atLeast) {

    function drawGround(ctx, x0, y0, x1, y1) {

      for (let iy = b; iy <= d; iy++) for (let ix = a; ix <= c; ix++) {

        if (e) {
          e.used = ++tick;

    function flat(ctx, ix, iy) {

        const cx = Math.floor(tx / CH), cy = Math.floor(ty / CH), data = world.peek(cx, cy);

    function renderMini(c, data, fogBits) {

        const rgb = tileRGB(data.tiles[ly * CH + lx], W.regionOf(data, lx, ly));
        px[o4] = rgb[0]; px[o4 + 1] = rgb[1]; px[o4 + 2] = rgb[2]; px[o4 + 3] = 255;

      const data = build ? world.dataFor(cx, cy) : world.peek(cx, cy);

  // ---------- fog over the view ----------

  const FOG = '#120a0c';
  function drawFog(ctx, world, x0, y0, x1, y1, px, py, rad) {

      for (let tx = tx0; tx <= tx1 + 1; tx++) {
        let hidden = false;

  // ---------- the points of interest (M4c) ----------
  // What the surface draws over the ground for the points of interest in `chunks` (the data chunks round the view), each
  // once: a landmark is listed by every chunk its box touches, a structure by every chunk its apron touches. An item is
  // { art, id, opts, x, y, w, h, depth }: the SolArt drawing (kestrel, formation, prop, or 'puff', the vent's puff), the
  // box it fills in tiles, and the world-pixel y it is sorted by among the sprites, or null for a decal flat on the
  // ground, drawn under every sprite. o: { at: [tx, ty] the tile you stand on, done(id): that structure is used or repaired,
  // tube: the lava tube you are inside (tubeAt), or none }.
  const inBox = (b, x, y) => x >= b[0] && x <= b[2] && y >= b[1] && y <= b[3];
  const feet = b => (b[3] + 1) * T - 6; // the bottom of a box's last row, where a module's feet are sorted too
  // The lava tube you are inside: the one whose box holds the tile you stand on, when that tile (`under`) is its floor or
  // its skylight. Its open ring and its walls are outside (the walls can't be stood on).
  function tubeAt(chunks, at, under) {
    if (under !== TL.TUBE_FLOOR && under !== TL.SKYLIGHT) return null;
    for (const c of chunks) for (const l of c.landmarks) if (l.kind === 'tube' && inBox(l.box, at[0], at[1])) return l;

      // while you stand inside its box, sorted by its top edge so whoever is in there is drawn over it; its roof otherwise.
      for (const s of c.structures) {

        const opts = s.kind === 'pod' ? { inside } : { done: !!o.done(s.id) };
        out.push({ art: 'kestrel', id: s.kind, opts, x: b[0], y: b[3] + 1 - w, w, h: w, depth: inside ? b[1] * T : feet(b) });
      }

      for (const f of c.formations) {
        const b = f.box, n = b[2] - b[0] + 1;

      }
      // The methane vent is a low mound on its survey's tile, its puff rising from it. A lava tube's roof covers its walls and
      // floor (its box but the open ring round it), with the skylight's pit on it, while you are outside; inside, both hide.
      for (const l of c.landmarks) {

          out.push({ art: 'prop', id: 'skylight', opts: null, x: l.skylight[0] - 0.5, y: l.skylight[1] - 0.5, w: 2, h: 2, depth: feet(r) + 1 });

  }
  // A lava tube's roof (scenery's item: its box in tiles): a long ridge of basalt, lit along its top, its south face in shade.

    ctx.fillStyle = 'rgba(0,0,0,0.28)'; roundRect(ctx, X - 2, Y + 10, w + 4, h, 18); ctx.fill(); // its shadow on the ground
    ctx.fillStyle = '#4e3c39'; roundRect(ctx, X, Y, w, h, 16); ctx.fill();
    ctx.fillStyle = '#35282a'; roundRect(ctx, X, Y + h - 24, w, 24, 10); ctx.fill(); // the south face

  }

  // The two crack lines on an ice tile whose top-left corner is (X, Y) in world pixels, in the current stroke style:

  function drawIceCracks(g, X, Y) {

  // a: { x, y, dir, phase, moving, you, down, rover, working, color, bar }. Name tags are queued in `tags`

      roundRect(ctx, -16, -6, 26, 12, 5); ctx.fill();
      ctx.fillStyle = color; ctx.fillRect(-10, -6, 3, 12);
      ctx.fillStyle = '#f3eee7'; ctx.beginPath(); ctx.arc(14, 0, 8, 0, Math.PI * 2); ctx.fill();
      const pulse = 0.5 + 0.5 * Math.sin(time * 5);
      ctx.fillStyle = `rgba(244,110,95,${0.6 + pulse * 0.4})`;
      ctx.fillRect(-2, -26, 4, 14); ctx.fillRect(-7, -21, 14, 4);
      ctx.restore();
      tag(x, y - 34, name, '#f46e5f', a.you);
      return;
    }
    const bob = a.moving ? Math.abs(Math.sin(a.phase)) * 2 : Math.sin(time * 2 + x) * 0.6;
    const swing = a.moving ? Math.sin(a.phase) * 4 : 0;
    // legs
    ctx.fillStyle = '#d6cec3';
    roundRect(ctx, x - 7, y - 11 + (swing > 0 ? 0 : 1), 6, 11 - (swing > 0 ? 0 : 1) + Math.max(0, swing * 0.3), 2); ctx.fill();
    roundRect(ctx, x + 1, y - 11 + (swing < 0 ? 0 : 1), 6, 11 - (swing < 0 ? 0 : 1) + Math.max(0, -swing * 0.3), 2); ctx.fill();
    ctx.fillStyle = '#6d6266';
    ctx.fillRect(x - 7, y - 2, 6, 2); ctx.fillRect(x + 1, y - 2, 6, 2);
    const by = y - 12 - bob;
    // backpack behind (visible from the sides and back)
    if (a.dir !== 'down') {
      ctx.fillStyle = '#9da3a9';
      const bx = a.dir === 'left' ? x + 4 : a.dir === 'right' ? x - 14 : x - 9;
      roundRect(ctx, bx, by - 18, a.dir === 'up' ? 18 : 10, 16, 3); ctx.fill();
    }
    // arms
    ctx.fillStyle = '#e1d9ce';
    roundRect(ctx, x - 13, by - 17 + swing * 0.5, 5, 12, 2.5); ctx.fill();
    roundRect(ctx, x + 8, by - 17 - swing * 0.5, 5, 12, 2.5); ctx.fill();
    // torso
    ctx.fillStyle = '#ece5db';
    roundRect(ctx, x - 9, by - 19, 18, 19, 5); ctx.fill();
    ctx.fillStyle = color;
    ctx.fillRect(x - 9, by - 9, 18, 3);
    if (a.dir === 'down') { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x + 4, by - 14, 2.2, 0, Math.PI * 2); ctx.fill(); }
    // helmet
    const hy = by - 27;
    ctx.fillStyle = '#f4efe8';
    ctx.strokeStyle = '#b9afa4';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x, hy, 10.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = color;
    roundRect(ctx, x - 3.5, hy - 12, 7, 3, 1.5); ctx.fill();
    if (a.dir !== 'up') {
      const ox = a.dir === 'left' ? -3 : a.dir === 'right' ? 3 : 0;
      const grad = ctx.createLinearGradient(x, hy - 6, x, hy + 6);
      grad.addColorStop(0, '#0e1a2b');
      grad.addColorStop(0.65, '#1f3c62');
      grad.addColorStop(1, color);
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.ellipse(x + ox, hy + 1, a.dir === 'down' ? 7.5 : 6, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(x + ox - 1, hy, 4.5, Math.PI * 1.1, Math.PI * 1.45); ctx.stroke();
    }
    if (a.working) {
      const wob = Math.sin(time * 6) * 1.5;
      ctx.fillStyle = 'rgba(20,14,16,0.85)';
      ctx.beginPath(); ctx.arc(x + 15, hy - 14 + wob, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(x + 15, hy - 14 + wob, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    tag(x, hy - 17, name, color, a.you);
  }

  // ---------- finds (spec §3.1) ----------
  // A find on its tile, (cx, cy) = the tile's centre in world pixels; `time` makes the science flag wave.
  const FIND_GLOW = { ice: '159,211,234', metal: '217,180,106', pod: '236,229,219', science: '111,168,255' };
  function drawFind(ctx, f, cx, cy, time) {
    ctx.save();
    // A soft glow that breathes, so a find stands out from the rocks around it.
    ctx.fillStyle = 'rgba(' + FIND_GLOW[f.kind] + ',' + (0.14 + 0.08 * Math.sin(time * 2.5 + f.x)).toFixed(3) + ')';
    ctx.beginPath(); ctx.ellipse(cx, cy + 12, 28, 11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.ellipse(cx, cy + 14, 20, 6, 0, 0, Math.PI * 2); ctx.fill();
    if (f.kind === 'ice') { // pale blue crystals on a frosty patch
      ctx.fillStyle = 'rgba(225,243,250,0.35)';
      ctx.beginPath(); ctx.ellipse(cx, cy + 10, 24, 9, 0, 0, Math.PI * 2); ctx.fill();
      for (const [dx, h, w] of [[-10, 18, 8], [2, 26, 10], [12, 15, 7]]) {
        ctx.fillStyle = '#9fd3ea';
        ctx.beginPath(); ctx.moveTo(cx + dx - w / 2, cy + 12); ctx.lineTo(cx + dx, cy + 12 - h); ctx.lineTo(cx + dx + w / 2, cy + 12); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.beginPath(); ctx.moveTo(cx + dx - 1, cy + 10); ctx.lineTo(cx + dx, cy + 14 - h); ctx.lineTo(cx + dx + 1.5, cy + 10); ctx.closePath(); ctx.fill();
      }
    } else if (f.kind === 'metal') { // a dark rock with bright metal grains
      ctx.fillStyle = '#3b3433';
      ctx.beginPath(); ctx.ellipse(cx - 3, cy + 4, 18, 13, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#4d4544';
      ctx.beginPath(); ctx.ellipse(cx + 8, cy, 11, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#d9b46a';
      for (const [dx, dy] of [[-9, 0], [-2, 7], [6, -3], [11, 3], [-12, 8]]) ctx.fillRect(cx + dx, cy + dy, 3, 2);
      ctx.fillStyle = '#c9d2da';
      for (const [dx, dy] of [[-5, -4], [3, 2], [9, -6]]) ctx.fillRect(cx + dx, cy + dy, 2, 2);
    } else if (f.kind === 'pod') { // a cargo pod on its side, with its torn parachute
      ctx.strokeStyle = '#e9874a';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx + 10, cy + 2); ctx.quadraticCurveTo(cx + 26, cy - 14, cx + 20, cy + 12); ctx.stroke();
      ctx.fillStyle = '#ece5db';
      roundRect(ctx, cx - 18, cy - 6, 30, 18, 8); ctx.fill();
      ctx.fillStyle = '#b8aea2';
      roundRect(ctx, cx - 18, cy + 6, 30, 6, 3); ctx.fill();
      ctx.fillStyle = '#e9874a';
      ctx.fillRect(cx - 6, cy - 6, 5, 18);
    } else { // a science site: an outcrop with a survey flag
      ctx.fillStyle = f.sub === 'meteorite' ? '#2c2a2e' : '#7a5442';
      ctx.beginPath(); ctx.ellipse(cx - 4, cy + 6, 15, 9, 0, 0, Math.PI * 2); ctx.fill();
      if (f.sub === 'layered' || f.sub === 'delta') {
        ctx.strokeStyle = f.sub === 'delta' ? 'rgba(130,190,220,0.7)' : 'rgba(230,190,140,0.75)';
        ctx.lineWidth = 2;
        for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(cx - 16, cy + 2 + k * 4); ctx.lineTo(cx + 8, cy + 3 + k * 4); ctx.stroke(); }
      } else if (f.sub === 'vent') {
        ctx.fillStyle = 'rgba(235,225,215,0.35)';
        const w = Math.sin(time * 2) * 2;
        ctx.beginPath(); ctx.ellipse(cx - 4 + w, cy - 6, 5, 7, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.strokeStyle = '#d6cec3';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx + 12, cy + 12); ctx.lineTo(cx + 12, cy - 22); ctx.stroke();
      ctx.fillStyle = '#6fa8ff';
      const wave = Math.sin(time * 3) * 2;
      ctx.beginPath(); ctx.moveTo(cx + 12, cy - 22); ctx.lineTo(cx + 26, cy - 18 + wave); ctx.lineTo(cx + 12, cy - 13); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  // A load someone dropped when their suit ran out: a backpack with a red tag. (x, y) in world pixels.
  function drawDrop(ctx, x, y) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(x, y + 8, 14, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#9da3a9';
    roundRect(ctx, x - 10, y - 12, 20, 20, 4); ctx.fill();
    ctx.fillStyle = '#7d848b';
    roundRect(ctx, x - 7, y - 4, 14, 8, 2); ctx.fill();
    ctx.fillStyle = '#f46e5f';
    ctx.fillRect(x + 6, y - 16, 5, 8);
    ctx.restore();
  }

  // How far a hold of E has got: a ring that fills clockwise. (x, y) is its centre in world pixels.
  function drawRing(ctx, x, y, frac) {
    ctx.save();
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(20,14,16,0.75)';
    ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#8cbcec';
    ctx.beginPath(); ctx.arc(x, y, 16, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0, Math.min(1, frac))); ctx.stroke();
    ctx.restore();
  }

  // A dust devil (spec §3.4): a spinning funnel of dust over its shadow. (d.x, d.y) is where it touches the ground, in world
  // pixels; d.spin varies each devil's phase; `alpha` fades it in and out (and past the edge of your view).
  function drawDevil(ctx, d, time, alpha) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(d.x, d.y + 3, 24, 8, 0, 0, Math.PI * 2); ctx.fill();
    const spin = time * 7 + d.spin;
    for (let k = 0; k < 8; k++) {
      const h = k / 7, y = d.y - 4 - h * 78, w = 7 + h * h * 26;
      const sway = Math.sin(spin * 0.35 + k * 0.7) * (2 + h * 7);
      ctx.fillStyle = 'rgba(201,142,98,' + (0.42 - h * 0.26).toFixed(3) + ')';
      ctx.beginPath(); ctx.ellipse(d.x + sway, y, w, 3 + h * 5, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(232,190,150,0.75)'; // grit thrown round its foot
    for (let k = 0; k < 6; k++) {
      const a = spin + k * 1.05, r = 14 + (k % 3) * 5;
      ctx.fillRect(d.x + Math.cos(a) * r, d.y - 6 + Math.sin(a) * r * 0.35, 2, 2);
    }
    ctx.restore();
  }

  // A teammate's suit level: a small bar above their name tag, from green through amber to red.
  function drawSuitBar(ctx, x, y, frac) {
    const f = Math.max(0, Math.min(1, frac));
    ctx.save();
    ctx.fillStyle = 'rgba(20,14,16,0.8)';
    roundRect(ctx, x - 15, y, 30, 5, 2.5); ctx.fill();
    ctx.fillStyle = f > 0.4 ? '#4fd0c4' : f > 0.15 ? '#e9a13b' : '#f46e5f';
    roundRect(ctx, x - 15, y, 30 * f, 5, 2.5); ctx.fill();
    ctx.restore();
  }

  // Name tags are laid out after all sprites so they never pile on top of each other. A teammate's suit bar sits on top
  // of their tag (5 px and 2 px clear), so it counts as part of the tag and moves up with it when the tag is pushed up.
  function drawTags(ctx, tags) {
    const placed = [];
    ctx.font = '600 10px "Be Vietnam Pro", system-ui, sans-serif';
    const list = tags.slice().sort((a, b) => (b.you - a.you) || (b.y - a.y));
    for (const tg of list) {
      const w = ctx.measureText(tg.text).width + 16, up = tg.bar == null ? 0 : 7;
      let y = tg.y;
      for (let i = 0; i < 6; i++) { // a tag spans y - 14 - up to y + 1; two keep 1 px apart
        const hit = placed.some(r => Math.abs(r.x - tg.x) < (r.w + w) / 2 + 2 && y - 14 - up < r.y + 2 && r.y - 14 - r.up < y + 2);
        if (!hit) break;
        y -= 16;
      }
      placed.push({ x: tg.x, y, w, up });
      if (tg.bar != null) drawSuitBar(ctx, tg.x, y - 21, tg.bar);
      drawTag(ctx, tg.x, y, tg.text, tg.color, tg.you, w);
    }
    tags.length = 0;
  }

  function drawTag(ctx, x, y, text, color, you, w) {
    ctx.save();
    ctx.fillStyle = you ? 'rgba(140,188,236,0.92)' : 'rgba(20,14,16,0.78)';
    roundRect(ctx, x - w / 2, y - 14, w, 15, 7); ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x - w / 2 + 7, y - 6.5, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = you ? '#0c1a29' : '#f4e9df';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x - w / 2 + 12, y - 6.2);
    ctx.restore();
  }

  return {
    IMG, PX, REGION_COLORS, tileRGB, decorFor, createPainter, drawFog, drawDark, scenery, tubeAt,
    sprites: { drawAvatar, drawTags, roundRect, badge, drawRock, drawLander, drawIceCracks, drawFind, drawDrop, drawRing, drawSuitBar, drawDevil, drawRoof },
  };
});

</script>
<script>
/*
 * SOL 500 — the minimap (160×160 tiles, one pixel per tile, centred on you) and the full-screen map of everything
 * the crew has explored, with pan and zoom. Both draw the painter's one-pixel-per-tile "mini" images of explored
 * chunks, so they never need the full ground painting. Also formats the debug overlay (?debug=chunks or F3).
 *
 * API: SolMap.create({ t, onOpen, onClose }) → map
 *        map.attach(world, painter)          a new mission's world
 *        map.minimap · map.el                elements for the surface overlay
 *        map.drawMini(state, now)            state: { px, py, crew: [{ x, y, color, you }], marks: [{ x, y, color, square, diamond, text, ring }] }
 *                                            (world pixels; marks are finds, cave mouths, dropped loads, the parked rover and poiMarks)
 *        map.open(state?) · map.close() · map.isOpen() · map.key(keyEvent) → used?
 *        map.frame(state, deadline)          every animation frame (does nothing while closed)
 *        map.relabel()                       after a language change
 *      SolMap.debugText(stats) → string · SolMap.poiMarks(seed, expedition, masts) → the points of interest's marks
 */
(function (root) {
  'use strict';
  const W = root.SolWorldgen, P = root.SolPaint;
  const T = 64, CH = W.CHUNK, MINI = 160;
  const ZOOMS = [1, 2, 3, 4, 6, 8]; // screen pixels per tile on the full map
  const PAN = { ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0], ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1] };

  function create(opts) {
    const t = opts.t;
    let world = null, painter = null, last = null, lastMini = -1e9;
    let open = false, zi = 2, cx = 0, cy = 0, drag = null;
    const dpr = () => Math.min(2, root.devicePixelRatio || 1);
    const node = (tag, cls, text) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    };

    // Finds and the like, then the HQ, then every crew member as a dot in their role colour (you with a white ring).
    function markers(g, st, at) {
      for (const k of st.marks || []) {
        const [x, y] = at(k.x, k.y);
        g.fillStyle = k.color;
        if (k.text) { // a comms mast's "?", edged in dark so it reads on any ground
          g.font = '700 10px system-ui, sans-serif';
          g.textAlign = 'center';
          g.textBaseline = 'middle';
          g.strokeStyle = '#120a0c';
          g.lineWidth = 2.5;
          g.strokeText(k.text, x, y);
          g.fillText(k.text, x, y);
          continue;
        }
        if (k.square) g.fillRect(x - 2.5, y - 2.5, 5, 5);
        else if (k.diamond) { g.beginPath(); g.moveTo(x, y - 4); g.lineTo(x + 4, y); g.lineTo(x, y + 4); g.lineTo(x - 4, y); g.closePath(); g.fill(); }
        else { g.beginPath(); g.arc(x, y, k.ring ? 2.5 : 2, 0, Math.PI * 2); g.fill(); }
        if (k.ring) { g.strokeStyle = k.ring; g.lineWidth = 1; g.stroke(); } // a cave's mouth: dark, with a light rim; a landmark's dark edge
      }
      const [bx, by] = at(T / 2, T / 2); // the HQ is tile (0, 0)
      g.fillStyle = '#f4e9df';
      g.strokeStyle = '#120a0c';
      g.lineWidth = 1;
      g.fillRect(bx - 3.5, by - 3.5, 7, 7);
      g.strokeRect(bx - 3.5, by - 3.5, 7, 7);
      for (const c of st.crew) {
        const [x, y] = at(c.x, c.y);
        g.fillStyle = c.color;
        g.beginPath(); g.arc(x, y, c.you ? 3.5 : 2.5, 0, Math.PI * 2); g.fill();
        if (c.you) { g.strokeStyle = '#ffffff'; g.lineWidth = 1.5; g.stroke(); }
      }
    }

    // ---------- minimap ----------
    const minimap = node('button', 'sf-mini');
    minimap.type = 'button';
    const mc = node('canvas');
    minimap.appendChild(mc);
    minimap.addEventListener('click', () => openMap());

    function drawMini(st, now) {
      last = st;
      if (!world || open || now - lastMini < 150) return;
      lastMini = now;
      // Explored chunks at the edge have no live data (a teammate's fog, a resumed save): build the image the last redraw
      // queued for them, about one every 150 ms, so the minimap never waits for the full map to open.
      painter.workMinis(now + 1);
      const size = minimap.clientWidth || MINI, k = dpr();
      if (mc.width !== Math.round(size * k)) { mc.width = Math.round(size * k); mc.height = Math.round(size * k); }
      const g = mc.getContext('2d');
      const z = size / MINI; // CSS pixels per tile: 1, or less on small screens
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.imageSmoothingEnabled = false;
      g.fillStyle = '#120a0c';
      g.fillRect(0, 0, mc.width, mc.height);
      const ox = Math.floor(st.px / T) - MINI / 2, oy = Math.floor(st.py / T) - MINI / 2;
      for (let ky = Math.floor(oy / CH); ky <= Math.floor((oy + MINI - 1) / CH); ky++) {
        for (let kx = Math.floor(ox / CH); kx <= Math.floor((ox + MINI - 1) / CH); kx++) {
          const c = painter.mini(kx, ky);
          if (c) blit(g, c, kx * CH - ox, ky * CH - oy, k * z);
        }
      }
      g.setTransform(k, 0, 0, k, 0, 0);
      markers(g, st, (x, y) => [(x / T - ox) * z, (y / T - oy) * z]);
    }

    // Draws a chunk's mini image snapped to whole device pixels (s = device pixels per tile), so neighbouring
    // chunks meet exactly, with no seam.
    function blit(g, c, tx, ty, s) {
      const x0 = Math.round(tx * s), y0 = Math.round(ty * s), x1 = Math.round((tx + CH) * s), y1 = Math.round((ty + CH) * s);
      g.drawImage(c, x0, y0, x1 - x0, y1 - y0);
    }

    // ---------- full map ----------
    const el = node('div', 'sf-map');
    el.hidden = true;
    el.setAttribute('role', 'dialog');
    const fc = node('canvas');
    const head = node('div', 'sf-map-head');
    const title = node('b');
    const legend = node('div', 'sf-map-legend');
    const button = (label, onClick) => { const b = node('button', null, label); b.type = 'button'; b.addEventListener('click', onClick); return b; };
    const zoomOut = button('−', () => zoom(-1)), zoomIn = button('+', () => zoom(1)), shut = button('×', () => closeMap());
    head.append(title, legend, zoomOut, zoomIn, shut);
    const hint = node('p', 'sf-map-hint');
    el.append(fc, head, hint);

    function relabel() {
      title.textContent = t('sf.mapTitle');
      hint.textContent = t('sf.mapHint');
      el.setAttribute('aria-label', t('sf.mapTitle'));
      minimap.setAttribute('aria-label', t('sf.minimap'));
      zoomIn.setAttribute('aria-label', t('sf.zoomIn'));
      zoomOut.setAttribute('aria-label', t('sf.zoomOut'));
      shut.setAttribute('aria-label', t('common.close'));
      legend.textContent = '';
      W.REGIONS.forEach((id, i) => {
        const item = node('span');
        const swatch = node('i');
        swatch.style.background = P.REGION_COLORS[i];
        item.append(swatch, document.createTextNode(t('region.' + id)));
        legend.appendChild(item);
      });
    }

    function openMap(st) {
      if (!world) return;
      const s = st || last;
      if (s) { cx = s.px / T; cy = s.py / T; }
      open = true;
      el.hidden = false;
      if (opts.onOpen) opts.onOpen();
      shut.focus({ preventScroll: true });
    }
    function closeMap() {
      if (!open) return;
      open = false;
      el.hidden = true;
      drag = null;
      if (opts.onClose) opts.onClose();
    }
    function zoom(d) { zi = Math.max(0, Math.min(ZOOMS.length - 1, zi + d)); }
    // Keys while the map is open; returns true when the key was used. A held M repeats keydown: only the press closes the map.
    function key(e) {
      if (e.code === 'Escape' || (e.code === 'KeyM' && !e.repeat)) { closeMap(); return true; }
      if (e.key === '+' || e.key === '=') { zoom(1); return true; }
      if (e.key === '-' || e.key === '_') { zoom(-1); return true; }
      const d = PAN[e.code];
      if (!d) return false;
      const step = 48 / ZOOMS[zi];
      cx += d[0] * step;
      cy += d[1] * step;
      return true;
    }
    fc.addEventListener('pointerdown', e => { drag = { id: e.pointerId, x: e.clientX, y: e.clientY }; fc.setPointerCapture(e.pointerId); });
    fc.addEventListener('pointermove', e => {
      if (!drag || drag.id !== e.pointerId) return;
      const z = ZOOMS[zi];
      cx -= (e.clientX - drag.x) / z;
      cy -= (e.clientY - drag.y) / z;
      drag.x = e.clientX;
      drag.y = e.clientY;
    });
    const endDrag = () => { drag = null; };
    fc.addEventListener('pointerup', endDrag);
    fc.addEventListener('pointercancel', endDrag);
    fc.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY < 0 ? 1 : -1); }, { passive: false });

    function frame(st, deadline) {
      last = st;
      if (!open || !world) return;
      painter.workMinis(deadline);
      const k = dpr(), w = el.clientWidth, h = el.clientHeight;
      if (fc.width !== Math.round(w * k) || fc.height !== Math.round(h * k)) { fc.width = Math.round(w * k); fc.height = Math.round(h * k); }
      const g = fc.getContext('2d');
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.imageSmoothingEnabled = false;
      g.fillStyle = '#120a0c';
      g.fillRect(0, 0, fc.width, fc.height);
      const z = ZOOMS[zi], ox = cx - w / 2 / z, oy = cy - h / 2 / z;
      for (const fk of world.fogKeys()) {
        const comma = fk.indexOf(',');
        const kx = Number(fk.slice(0, comma)), ky = Number(fk.slice(comma + 1));
        const sx = (kx * CH - ox) * z, sy = (ky * CH - oy) * z;
        if (sx > w || sy > h || sx + CH * z < 0 || sy + CH * z < 0) continue;
        const c = painter.mini(kx, ky);
        if (c) blit(g, c, kx * CH - ox, ky * CH - oy, k * z);
      }
      g.setTransform(k, 0, 0, k, 0, 0);
      markers(g, st, (x, y) => [(x / T - ox) * z, (y / T - oy) * z]);
    }

    return {
      minimap, el, drawMini, frame, key, relabel,
      attach(w, p) { world = w; painter = p; closeMap(); },
      open: openMap, close: closeMap, isOpen: () => open,
    };
  }

  // The points of interest both maps mark (spec §2.6, §3.7), in world pixels: the landmarks the crew has discovered
  // (x.landmarks, a gold diamond at its centre), the structures used or repaired (x.structures, a pale teal square on its
  // footprint's teal), and the comms masts' "?" (`masts`: the rules' X.mastMarks(m), [{ id, x, y, kind }] in tiles) on
  // what is not marked already. x is the mission's expedition, seed the world's.
  const cellOf = id => id.slice(1).split(',').map(Number); // "L<i>,<j>" or "S<i>,<j>"
  function poiMarks(seed, x, masts) {
    const out = [], shown = new Set();
    for (const id of Object.keys(x.landmarks || {})) {
      const l = W.landmarkAt(seed, ...cellOf(id));
      if (l) { shown.add(id); out.push({ x: (l.x + 0.5) * T, y: (l.y + 0.5) * T, color: '#f0c35a', diamond: true, ring: '#120a0c' }); }
    }
    for (const id of Object.keys(x.structures || {})) {
      const s = W.structureAt(seed, ...cellOf(id)), b = s && s.box;
      if (s) { shown.add(id); out.push({ x: (b[0] + b[2] + 1) / 2 * T, y: (b[1] + b[3] + 1) / 2 * T, color: '#a9f4e4', square: true }); }
    }
    for (const k of masts || []) if (!shown.has(k.id)) out.push({ x: (k.x + 0.5) * T, y: (k.y + 0.5) * T, color: '#a9f4e4', text: '?' });
    return out;
  }

  function debugText(s) {
    return [
      'fps ' + s.fps,
      'data ' + s.world.data + '/' + s.world.cap + '  queue ' + s.world.queue + '  built ' + s.world.built,
      'images ' + s.paint.images + '/' + s.paint.cap + '  queue ' + s.paint.queue + '  paint ' + s.paint.paintMedian.toFixed(2) + ' ms',
      'minis ' + s.paint.minis + ' (+' + s.paint.miniQueue + ')  fog chunks ' + s.world.fog,
      'tile ' + s.tile.join(',') + '  chunk ' + s.chunk.join(',') + '  ' + s.region,
    ].join('\n');

  root.SolMap = { create, debugText, poiMarks };
