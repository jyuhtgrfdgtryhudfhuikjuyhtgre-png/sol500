<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOL 500 Mars Outpost</title>
<meta name="description" content="Run a Mars outpost for 500 sols: balance life support, radiation shielding, power and food. Real NASA numbers, English and Vietnamese, LAN co-op for up to 5 players.">
<meta name="theme-color" content="#1b1417">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23b4532f'/%3E%3Ccircle cx='24' cy='24' r='5' fill='%237a3623'/%3E%3Ccircle cx='40' cy='38' r='7' fill='%237a3623'/%3E%3C/svg%3E">


<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>window.SOL_APP = false;</script>
<style>
/* SOL 500 — Martian dusk mission console.
   Layout: a sticky telemetry strip on top, three working columns below (events + outpost map | crew | forecast + systems);
   one column on phones. Single committed dark theme: the Mars night sky, with the blue of a Martian sunset as the accent. */
:root {
  color-scheme: dark;
  --bg: #1b1417;
  --panel: #241b1e;
  --raised: #2f2428;
  --sunk: #140e10;
  --line: #3e2f33;
  --line-2: #5a474b;
  --fg: #f4e9df;
  --fg-2: #cdbbad;
  --fg-3: #9a877f;
  --dust: #d9aa7a;
  --rust: #b4532f;
  --accent: #8cbcec;
  --accent-2: #b7d6f5;
  --accent-ink: #0c1a29;
  --accent-soft: rgba(140, 188, 236, 0.14);
  --ok: #7fd1a0;
  --warn: #f2b84f;
  --crit: #f46e5f;
  --ok-soft: rgba(127, 209, 160, 0.13);
  --warn-soft: rgba(242, 184, 79, 0.13);
  --crit-soft: rgba(244, 110, 95, 0.15);
  --c-engineer: #e9a13b;
  --c-biologist: #8fcf7a;
  --c-scientist: #6fa8ff;
  --c-medic: #4fd0c4;
  --c-commander: #d69cf0;
  --font-display: 'League Spartan', 'Be Vietnam Pro', system-ui, sans-serif;
  --font-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-data: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --fs-xs: 0.75rem;
  --fs-sm: 0.8125rem;
  --fs-md: 0.9375rem;
  --fs-lg: 1.125rem;
  --fs-xl: 1.5rem;
  --fs-2xl: 2.125rem;
  --r-sm: 6px;
  --r-md: 10px;
  --gutter: 16px;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 var(--fs-md)/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
img, svg { max-width: 100%; }
a { color: var(--accent); }
a:hover { color: var(--accent-2); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.ok { color: var(--ok); }
.warn { color: var(--warn); }
.crit { color: var(--crit); }

#app { padding-inline: var(--gutter); padding-block: 0 48px; max-width: 1520px; margin: 0 auto; }

/* ---------- type ---------- */
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
h2 { font-size: var(--fs-xl); }
h3 { font-size: var(--fs-lg); }
p { margin: 0; }
.eyebrow {
  font-family: var(--font-display);
  font-size: var(--fs-xs);
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--fg-2);
}

/* ---------- buttons & controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; min-height: 42px;
  background: var(--raised); border: 1px solid var(--line-2); border-radius: 8px;
  font-weight: 600; cursor: pointer; text-decoration: none; color: var(--fg);
  transition: background 0.15s, border-color 0.15s, transform 0.08s;
}
.btn:hover:not(:disabled) { background: #3a2e33; border-color: #6d575c; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--fg-2); }
.btn-ghost:hover:not(:disabled) { background: var(--raised); color: var(--fg); border-color: var(--line); }
.btn-sm { min-height: 32px; padding: 5px 10px; font-size: var(--fs-sm); }
.btn-lg { min-height: 52px; padding: 12px 22px; font-size: var(--fs-lg); }
.btn-block { width: 100%; }
.btn svg { flex: none; }

.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; }
.seg button {
  flex: 1 1 auto; border: 1px solid transparent; background: transparent; border-radius: 7px;
  padding: 6px 12px; min-height: 34px; cursor: pointer; color: var(--fg-2); font-weight: 600; font-size: var(--fs-sm);
}
.seg button:hover:not(:disabled) { color: var(--fg); background: var(--raised); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.seg button:disabled { opacity: 0.4; cursor: not-allowed; }

.field { display: grid; gap: 6px; }
.field label, .field .label { font-size: var(--fs-sm); color: var(--fg-2); font-weight: 600; }
.input {
  width: 100%; min-height: 42px; padding: 8px 12px; background: var(--sunk); border: 1px solid var(--line-2);
  border-radius: 8px; color: var(--fg);
}
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }

.stepper { display: inline-grid; grid-template-columns: 34px 3ch 34px; align-items: center; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.stepper button { height: 34px; border: 0; background: var(--raised); cursor: pointer; font-size: 18px; line-height: 1; }
.stepper button:hover:not(:disabled) { background: #3a2e33; }
.stepper button:disabled { opacity: 0.35; cursor: not-allowed; }
.stepper output { text-align: center; font-family: var(--font-data); font-variant-numeric: tabular-nums; }

.switch { position: relative; width: 40px; height: 22px; border-radius: 22px; background: var(--sunk); border: 1px solid var(--line-2); cursor: pointer; flex: none; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg-3); transition: transform 0.15s, background 0.15s; }
.switch[aria-checked="true"] { background: var(--accent-soft); border-color: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(18px); background: var(--accent); }
.switch:disabled { opacity: 0.4; cursor: not-allowed; }

.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px;
  font-size: var(--fs-xs); font-weight: 600; background: var(--raised); color: var(--fg-2); border: 1px solid var(--line);
  white-space: nowrap;
}
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.crit { background: var(--crit-soft); color: var(--crit); border-color: transparent; }
.chip.info { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
/* The weather station's forecast of next round's weather: dashed, as a prediction, in the weather's colours. */
.chip.fc { border-style: dashed; }
.chip.fc.warn { border-color: var(--warn); }
.chip.fc.crit { border-color: var(--crit); }
/* This round's weather with the forecast stacked under it, two slim chips in the bar's 44 px: the top bar stays one row at
   1280 px in any weather, where side by side a storm and its forecast wrapped it to two. */
.wxs { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
.wxs:has(.fc) .chip { padding-block: 1px; line-height: 1.2; }

.bar { height: 6px; border-radius: 6px; background: var(--sunk); overflow: hidden; position: relative; }
.bar > span { display: block; height: 100%; border-radius: 6px; background: var(--fg-2); }
.bar.ok > span { background: var(--ok); }
.bar.warn > span { background: var(--warn); }
.bar.crit > span { background: var(--crit); }
.bar.accent > span { background: var(--accent); }
.bar .tick { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--fg); opacity: 0.7; }

/* ---------- panels ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px 0; flex-wrap: wrap; }
.panel-b { padding: 12px 14px 14px; display: grid; gap: 12px; }
.divider { height: 1px; background: var(--line); margin: 2px 0; }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; flex-wrap: wrap; }
.brand { display: inline-flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--fg); background: none; border: 0; cursor: pointer; padding: 0; }
.brand b { font-family: var(--font-display); font-weight: 800; letter-spacing: 0.08em; font-size: 1.15rem; }
.brand span { font-size: var(--fs-sm); color: var(--fg-2); }
.topbar-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.lang-seg button { min-width: 44px; }

/* ---------- title screen ---------- */
.title-hero { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); min-height: 420px; display: grid; }
.title-hero > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.title-hero .hero-copy { position: relative; padding: clamp(24px, 5vw, 56px); display: grid; gap: 14px; align-content: start; max-width: 720px; }
.wordmark { display: grid; line-height: 0.85; }
.wordmark .sol { font-family: var(--font-display); font-weight: 600; font-size: clamp(1rem, 2.4vw, 1.4rem); letter-spacing: 0.6em; color: var(--dust); }
.wordmark .five { font-family: var(--font-display); font-weight: 800; font-size: clamp(5rem, 16vw, 11rem); letter-spacing: -0.02em; color: var(--fg); text-shadow: 0 6px 40px rgba(0,0,0,0.45); }
.hero-sub { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-xl); letter-spacing: 0.04em; }
.hero-tag { font-size: var(--fs-lg); color: var(--fg-2); max-width: 46ch; }
.title-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 16px; margin-top: 16px; }
.setup { display: grid; gap: 16px; }
.setup-row { display: grid; gap: 8px; }
.setup-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.code-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.hint { font-size: var(--fs-sm); color: var(--fg-3); }
.phases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.phase { display: grid; gap: 6px; align-content: start; }
.phase .idx { font-family: var(--font-data); color: var(--accent); font-size: var(--fs-sm); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
.fact { padding: 14px; border-left: 2px solid var(--line-2); }
.fact b { display: block; font-family: var(--font-data); font-size: var(--fs-xl); color: var(--dust); font-weight: 600; }
.title-foot { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; align-items: center; justify-content: space-between; }

/* ---------- manifest ---------- */
.man-head { display: grid; gap: 10px; padding-block: 6px 16px; }
.massbar { position: relative; height: 26px; border-radius: 8px; background: var(--sunk); border: 1px solid var(--line); overflow: hidden; display: flex; }
.massbar .seg-fill { height: 100%; border-right: 2px solid var(--sunk); }
.massbar .budget-mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--fg); }
.massbar.over { border-color: var(--crit); box-shadow: 0 0 0 2px var(--crit-soft); }
.mass-read { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.mass-read .big { font-family: var(--font-data); font-size: var(--fs-2xl); font-weight: 600; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--fs-sm); color: var(--fg-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.man-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.man-groups { display: grid; gap: 16px; }
.items { display: grid; }
.item { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .ico { width: 52px; height: 52px; border-radius: 8px; background: var(--sunk); display: grid; place-items: center; }
.item .name { font-weight: 700; }
.item .desc { font-size: var(--fs-sm); color: var(--fg-2); }
.item .fact-line { font-size: var(--fs-xs); color: var(--fg-3); margin-top: 2px; }
.item .qty { display: grid; justify-items: end; gap: 4px; }
.item .sub { font-size: var(--fs-xs); color: var(--fg-3); }
.review { position: sticky; top: 12px; }
.review-row { display: grid; gap: 4px; }
.review-row .top { display: flex; justify-content: space-between; gap: 8px; font-size: var(--fs-sm); }
.warnlist { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.warnlist li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: var(--fs-sm); align-items: start; }
.crew-edit { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.crew-edit .card { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: start; padding: 12px; background: var(--sunk); border-radius: 8px; border: 1px solid var(--line); }
.crew-edit .skill { font-size: var(--fs-xs); color: var(--fg-2); grid-column: 1 / -1; }
.mobile-launch { display: none; }

/* ---------- operations ---------- */
.hud { position: sticky; top: 0; z-index: 20; background: rgba(27, 20, 23, 0.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); margin-inline: calc(var(--gutter) * -1); padding: 10px var(--gutter); display: grid; gap: 10px; }
.hud-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: space-between; }
.solclock { display: flex; align-items: baseline; gap: 10px; }
.solclock b { font-family: var(--font-data); font-size: var(--fs-xl); font-weight: 600; }
/* The round track is what gives way when the top bar is full (dust season's long season chip, a storm forecast), down to
   3 px cells, before the bar wraps to two rows. */
.track { display: grid; grid-template-columns: repeat(20, minmax(3px, 1fr)); gap: 3px; min-width: 120px; flex: 1 1 120px; max-width: 520px; }
.track span { height: 10px; border-radius: 3px; background: var(--sunk); border: 1px solid var(--line); }
.track span.done { background: var(--fg-3); border-color: transparent; }
.track span.regional { background: #b07a4a; }
.track span.global { background: var(--rust); }
.track span.now { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.meters { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 8px; }
.meter { display: grid; gap: 2px; padding: 6px 8px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.meter .k { display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter .v { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: var(--fs-md); font-weight: 600; white-space: nowrap; }
.meter .d { font-family: var(--font-data); font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter.crit { border-color: var(--crit); background: var(--crit-soft); }
.meter.warn { border-color: rgba(242, 184, 79, 0.5); }

.ops { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) minmax(0, 0.95fr); gap: 14px; margin-top: 14px; align-items: start; }
.col { display: grid; gap: 14px; min-width: 0; }

.events { display: grid; gap: 10px; }
.event { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); display: grid; gap: 8px; }
.event.emergency { border-color: var(--crit); background: linear-gradient(0deg, var(--crit-soft), var(--crit-soft)), var(--panel); }
.event.decision { border-color: rgba(140, 188, 236, 0.5); }
.event .tag { display: inline-flex; align-items: center; gap: 6px; }
.event h3 { font-size: var(--fs-md); }
.event p { font-size: var(--fs-sm); color: var(--fg-2); }
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.option { text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--raised); cursor: pointer; display: grid; gap: 2px; }
.option b { font-size: var(--fs-sm); }
.option span { font-size: var(--fs-xs); color: var(--fg-2); }
.option:hover:not(:disabled) { border-color: var(--accent); }
.option[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.option:disabled { opacity: 0.45; cursor: not-allowed; }
.infos { display: flex; flex-wrap: wrap; gap: 6px; }
.info-ev { display: grid; gap: 2px; padding: 8px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font-size: var(--fs-sm); flex: 1 1 220px; }
.info-ev b { font-size: var(--fs-sm); }
.info-ev span { color: var(--fg-2); font-size: var(--fs-xs); }

.map-wrap { position: relative; border-radius: 8px; overflow: hidden; background: var(--sunk); }
.map-wrap svg { display: block; width: 100%; height: auto; }
.map-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: var(--fs-xs); color: var(--fg-3); }
.tile-hit { cursor: pointer; }
.tile-hit:hover rect.hl { stroke-width: 3; }

.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.bld { display: grid; grid-template-columns: 36px 1fr; gap: 8px; align-items: center; text-align: left; padding: 8px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--raised); cursor: pointer; }
.bld .t { font-size: var(--fs-sm); font-weight: 600; line-height: 1.2; }
.bld .c { font-size: var(--fs-xs); color: var(--fg-3); font-family: var(--font-data); }
.bld[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.bld:disabled { opacity: 0.42; cursor: not-allowed; }
.bld:hover:not(:disabled) { border-color: var(--accent); }
.queue { display: grid; gap: 6px; }
.qrow { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; font-size: var(--fs-sm); }
.qrow .bar { margin-top: 4px; }

.crew { display: grid; gap: 10px; }
.crew-card { padding: 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); display: grid; gap: 10px; }
.crew-card.mine { border-color: var(--accent); }
.crew-card.down { border-color: var(--crit); background: linear-gradient(0deg, var(--crit-soft), var(--crit-soft)), var(--panel); }
.crew-card.dead { opacity: 0.55; }
.crew-head { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.crew-head .nm { font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.crew-head .rl { font-size: var(--fs-xs); color: var(--fg-2); }
.vitals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.vital { display: grid; gap: 3px; }
.vital .top { display: flex; justify-content: space-between; font-size: var(--fs-xs); color: var(--fg-2); }
.vital .top b { font-family: var(--font-data); color: var(--fg); font-weight: 600; }
.jobs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
.job { display: flex; align-items: center; gap: 6px; padding: 6px 8px; min-height: 34px; border-radius: 7px; border: 1px solid var(--line); background: var(--sunk); cursor: pointer; font-size: var(--fs-xs); font-weight: 600; color: var(--fg-2); position: relative; }
.job:hover:not(:disabled) { border-color: var(--line-2); color: var(--fg); }
.job[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); }
.job:disabled { opacity: 0.35; cursor: not-allowed; }
.job .star { position: absolute; top: 2px; right: 4px; color: var(--dust); font-size: 10px; }
.crew-next { display: flex; justify-content: space-between; gap: 8px; font-size: var(--fs-xs); color: var(--fg-3); flex-wrap: wrap; }

.fc-rows { display: grid; gap: 6px; }
.fc-row { display: grid; grid-template-columns: 22px 1fr auto auto; gap: 8px; align-items: center; font-size: var(--fs-sm); }
.fc-row .dv { font-family: var(--font-data); font-variant-numeric: tabular-nums; text-align: right; min-width: 7ch; }
.fc-row .rw { font-family: var(--font-data); font-size: var(--fs-xs); color: var(--fg-3); text-align: right; min-width: 8ch; }
.notes { display: grid; gap: 4px; font-size: var(--fs-sm); color: var(--fg-2); }

.powerbar { display: grid; gap: 6px; }
.pb { display: flex; height: 14px; border-radius: 5px; overflow: hidden; background: var(--sunk); }
.pb span { height: 100%; }
.pb-row { display: grid; grid-template-columns: 56px 1fr 7ch; gap: 8px; align-items: center; font-size: var(--fs-xs); color: var(--fg-2); }
.pb-row .num { text-align: right; color: var(--fg); }
.mods { display: grid; gap: 4px; }
.mod { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto auto auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-size: var(--fs-sm); }
.mod:first-child { border-top: 0; }
.mod .st { display: flex; gap: 4px; flex-wrap: wrap; }
.mod .kw { font-family: var(--font-data); font-size: var(--fs-xs); color: var(--fg-3); white-space: nowrap; }
.mod .scrapnote { grid-column: 2 / -1; justify-self: start; }
.iconbtn { width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--fg-3); cursor: pointer; }
.iconbtn:hover:not(:disabled) { color: var(--fg); border-color: var(--line-2); background: var(--raised); }
.iconbtn.on { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
.iconbtn:disabled { opacity: 0.35; cursor: not-allowed; }
.brand-mini { width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: 8px; border: 1px solid var(--line-2); color: var(--dust); }

.orders { display: grid; gap: 10px; }
.order { display: grid; gap: 6px; }
.order .label { font-size: var(--fs-sm); color: var(--fg-2); font-weight: 600; }

.earth { display: grid; gap: 10px; }
.drops { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.drop { display: grid; gap: 2px; padding: 8px; text-align: left; border-radius: 8px; border: 1px solid var(--line-2); background: var(--raised); cursor: pointer; }
.drop b { font-size: var(--fs-sm); }
.drop span { font-size: var(--fs-xs); color: var(--fg-3); font-family: var(--font-data); }
.drop[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.drop:disabled { opacity: 0.4; cursor: not-allowed; }
.advice { padding: 10px 12px; border-radius: 8px; background: var(--sunk); border: 1px dashed var(--line-2); display: grid; gap: 6px; font-size: var(--fs-sm); }
.advice .head { font-family: var(--font-data); font-size: var(--fs-xs); color: var(--accent); }
.advice ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

.advance { display: grid; gap: 8px; position: sticky; bottom: 12px; z-index: 5; }
.advance .btn { box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45); }

/* ---------- modal ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(10, 6, 8, 0.72); z-index: 100; display: grid; place-items: center; padding: 16px; }
.modal { width: min(680px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
.modal-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px 0; }
.modal-b { padding: 14px 18px 18px; display: grid; gap: 14px; }
.modal-f { display: flex; gap: 8px; justify-content: flex-end; padding: 0 18px 18px; flex-wrap: wrap; }
.replist { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.replist li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; font-size: var(--fs-sm); }
.notes-list { display: grid; gap: 16px; }
.note h3 { font-size: var(--fs-md); margin-bottom: 4px; }
.note p { color: var(--fg-2); font-size: var(--fs-sm); }
.note .src { margin-top: 6px; font-size: var(--fs-xs); display: grid; gap: 2px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.badge { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--sunk); }
.badge.locked { opacity: 0.45; }
.badge.new { border-color: var(--dust); box-shadow: 0 0 0 2px rgba(217, 170, 122, 0.2); }
.badge b { font-size: var(--fs-sm); display: block; }
.badge span { font-size: var(--fs-xs); color: var(--fg-2); }

/* ---------- debrief ---------- */
.deb-hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: center; padding: clamp(18px, 4vw, 36px); border-radius: 14px; border: 1px solid var(--line); background: radial-gradient(120% 140% at 100% 0%, rgba(140, 188, 236, 0.16), transparent 55%), var(--panel); margin-top: 8px; }
.deb-hero.lost { background: radial-gradient(120% 140% at 100% 0%, rgba(244, 110, 95, 0.16), transparent 55%), var(--panel); }
.deb-hero h1 { font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1; }
.deb-hero p { color: var(--fg-2); font-size: var(--fs-lg); margin-top: 8px; max-width: 60ch; }
.grade { width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--dust); font-family: var(--font-display); font-weight: 800; font-size: 4rem; color: var(--dust); position: relative; }
.grade small { position: absolute; bottom: -22px; font-size: var(--fs-sm); font-family: var(--font-data); color: var(--fg-2); font-weight: 400; }
.deb-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; align-items: start; }
.deb-crew { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.deb-crew .c { display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: center; font-size: var(--fs-sm); }
.score-table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
.score-table td { padding: 6px 0; border-bottom: 1px solid var(--line); }
.score-table td:last-child { text-align: right; font-family: var(--font-data); }
.score-table tr.total td { font-weight: 700; border-bottom: 0; font-size: var(--fs-md); }
.charts { display: grid; gap: 14px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .tip { position: absolute; pointer-events: none; background: var(--raised); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 8px; font-size: var(--fs-xs); white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,0.35); transform: translate(-50%, calc(-100% - 10px)); }
.chart .tip b { font-family: var(--font-data); }
.chart-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: var(--fs-xs); color: var(--fg-2); margin-bottom: 6px; }
.chart-legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: 3px; }
.lessons { display: grid; gap: 12px; }
.lesson { padding: 14px; border-radius: 10px; background: var(--sunk); border: 1px solid var(--line); display: grid; gap: 6px; }
.lesson p { color: var(--fg-2); font-size: var(--fs-sm); }
.lesson a { font-size: var(--fs-xs); }
.log { width: 100%; border-collapse: collapse; font-size: var(--fs-xs); }
.log th, .log td { text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.log th { color: var(--fg-3); font-weight: 600; }
.log td:first-child { font-family: var(--font-data); white-space: nowrap; }
.tablewrap { overflow-x: auto; }
.deb-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

/* ---------- lobby ---------- */
.lobby { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; margin-top: 8px; }
.roomcode { font-family: var(--font-data); font-size: 2.6rem; letter-spacing: 0.2em; color: var(--dust); }
.slots { display: grid; gap: 8px; }
.slot { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--sunk); }
.slot.mine { border-color: var(--accent); }
.players { display: flex; gap: 6px; flex-wrap: wrap; }
.addr { font-family: var(--font-data); font-size: var(--fs-md); padding: 8px 10px; border-radius: 8px; background: var(--sunk); border: 1px solid var(--line); user-select: all; overflow-wrap: anywhere; }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 120; background: var(--raised); border: 1px solid var(--line-2); padding: 10px 16px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.4); font-size: var(--fs-sm); }

/* ---------- motion ---------- */
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(-120px); } }
@keyframes rise { from { transform: translateY(6px); opacity: 0.4; } to { transform: none; opacity: 1; } }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
.dust-drift { animation: drift 18s linear infinite alternate; }
.screen-in { animation: rise 0.35s ease-out; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- responsive ---------- */
@media (max-width: 1240px) {
  .meters { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .ops { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
  .ops .col-3 { grid-column: 1 / -1; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
}
@media (max-width: 900px) {
  .title-grid, .man-grid, .deb-grid, .lobby { grid-template-columns: minmax(0, 1fr); }
  .ops { grid-template-columns: minmax(0, 1fr); }
  .ops .col-3 { grid-template-columns: minmax(0, 1fr); }
  .review { position: static; }
  .phases, .facts { grid-template-columns: minmax(0, 1fr); }
  .meters { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .mobile-launch { display: flex; position: sticky; bottom: 0; margin-inline: calc(var(--gutter) * -1); padding: 10px var(--gutter); background: rgba(27, 20, 23, 0.96); border-top: 1px solid var(--line); gap: 10px; align-items: center; justify-content: space-between; z-index: 10; }
  .deb-hero { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  :root { --gutter: 16px; }
  .jobs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .drops { grid-template-columns: minmax(0, 1fr); }
  .vitals { grid-template-columns: minmax(0, 1fr); }
  .item { grid-template-columns: 44px minmax(0, 1fr); }
  .item .ico { width: 44px; height: 44px; }
  .item .qty { grid-column: 1 / -1; grid-template-columns: auto auto; justify-content: space-between; align-items: center; }
  .hud-top .track { order: 3; flex-basis: 100%; max-width: none; }
}

/* title crew lineup */
.lineup { display: grid; gap: 10px; }
.who { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; align-items: start; }
.who b { font-size: var(--fs-sm); margin-right: 8px; }
.who .role-tag { font-size: var(--fs-xs); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.who p { font-size: var(--fs-xs); color: var(--fg-2); margin-top: 2px; }
.portrait.down { filter: saturate(0.4); }
.portrait.dead { filter: grayscale(1); opacity: 0.6; }

/* ---------- surface (walkable outpost) ---------- */
.ops-tabs { margin-top: 12px; display: inline-flex; }
.ops-tabs button { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding-inline: 16px; }
.sf-layout { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 14px; margin-top: 12px; align-items: start; }
.sf-stage { min-width: 0; position: relative; }
.region-card { position: absolute; left: 12px; top: 150px; z-index: 2; width: min(340px, calc(100% - 24px)); background: rgba(28, 20, 23, 0.96); border: 1px solid var(--line-2); border-left: 3px solid var(--accent); border-radius: 10px; padding: 10px 12px 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); display: grid; gap: 6px; }
.region-card-h { display: flex; justify-content: space-between; align-items: center; }
.region-card h3 { margin: 0; font-family: var(--font-display); font-size: var(--fs-md); }
.region-card p { margin: 0; font-size: var(--fs-sm); color: var(--fg-2); line-height: 1.45; }
.region-card .src { font-size: var(--fs-xs); }
.region-card a { color: var(--accent); }
/* Wide screens: the card sits under the HUD's column, whose note (what a structure gave, a refill) can run to three lines
   as the card opens; a longer column is drawn over the card (.sf-eva's z-index) while its note lasts. */
@media (min-width: 641px) { .region-card { top: 196px; } }
/* A Kestrel Survey story log: the programme's teal (its structures on the maps) and a log's monospace. */
.region-card.log { border-left-color: #4a978e; }
.region-card.log .eyebrow { color: #7cc7bd; }
.region-card.log p { font-family: var(--font-data); font-size: var(--fs-xs); line-height: 1.5; }
/* A landmark's discovery: the gold of its diamond on the maps; the reward and the finder under the name. */
.region-card.disc { border-left-color: #f0c35a; }
.region-card.disc .eyebrow, .region-card .meta { color: #f0c35a; }
.region-card .meta { font-family: var(--font-data); font-size: var(--fs-xs); }

.sf-root { position: relative; height: min(74vh, 780px); min-height: 440px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #3a1d14; touch-action: none; user-select: none; -webkit-user-select: none; }
.sf-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; cursor: crosshair; }
.sf-canvas:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.sf-overlay { position: absolute; inset: 0; pointer-events: none; }
.sf-menu, .sf-joy, .sf-btn { pointer-events: auto; }
.sf-hint { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(20, 14, 16, 0.82); border: 1px solid var(--line-2); padding: 6px 14px; border-radius: 999px; font-size: var(--fs-xs); color: var(--fg-2); white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }
.sf-prompt { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); background: rgba(20, 14, 16, 0.9); border: 1px solid var(--accent); color: var(--fg); padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: var(--fs-sm); white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }
.sf-prompt kbd { font-family: var(--font-data); background: var(--accent); color: var(--accent-ink); border-radius: 5px; padding: 1px 7px; margin-right: 6px; }
.sf-menu { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(580px, calc(100% - 24px)); max-height: calc(100% - 28px); overflow: auto; background: rgba(28, 20, 23, 0.97); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); z-index: 3; } /* over the HUD column (.sf-eva, 3, earlier in the page); the full map (3, later) still covers it */
.sf-mhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px 0 14px; font-family: var(--font-display); font-size: var(--fs-md); }
.sf-x { background: none; border: 0; color: var(--fg-2); font-size: 24px; line-height: 1; cursor: pointer; width: 34px; height: 34px; border-radius: 8px; }
.sf-x:hover { background: var(--raised); color: var(--fg); }
.sf-mbody { padding: 8px 12px 12px; display: grid; gap: 8px; }
.sf-mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; }
.sf-mbtn { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: center; text-align: left; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--raised); cursor: pointer; color: var(--fg); min-height: 46px; position: relative; }
.sf-mbtn[data-n]::after { content: attr(data-n); position: absolute; top: 4px; right: 6px; font: 600 10px var(--font-data); color: var(--fg-3); }
.sf-mbtn b { font-size: var(--fs-sm); display: block; line-height: 1.25; }
.sf-mbtn small { display: block; font-size: var(--fs-xs); color: var(--fg-3); line-height: 1.3; }
.sf-mbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.sf-mbtn.primary small, .sf-mbtn.primary[data-n]::after { color: var(--accent-ink); }
.sf-mbtn.on { border-color: var(--accent); background: var(--accent-soft); }
.sf-mbtn:disabled { opacity: 0.42; cursor: not-allowed; }
.sf-mbtn:hover:not(:disabled) { border-color: var(--accent); }
.sf-ico { display: inline-grid; place-items: center; min-width: 22px; }
.sf-note { font-size: var(--fs-sm); color: var(--fg-2); }
.sf-note.warn { color: var(--warn); }
.sf-note.crit { color: var(--crit); }
.sf-note.ok { color: var(--ok); }
.sf-note.faint { color: var(--fg-3); }
.sf-stamina { position: absolute; left: 14px; top: 14px; width: 120px; height: 7px; border-radius: 7px; background: rgba(20, 14, 16, 0.8); border: 1px solid rgba(255, 255, 255, 0.15); overflow: hidden; }
.sf-stamina span { display: block; height: 100%; background: var(--ok); }
.sf-hint { max-width: calc(100% - 380px); white-space: normal; text-align: center; border-radius: 12px; }
.sf-region { position: absolute; left: 14px; top: 28px; background: rgba(20, 14, 16, 0.82); border: 1px solid var(--line-2); padding: 3px 10px; border-radius: 999px; font-family: inherit; font-size: var(--fs-xs); color: var(--fg); font-weight: 600; cursor: pointer; pointer-events: auto; }
.sf-region::after { content: 'i'; display: inline-grid; place-items: center; width: 14px; height: 14px; margin-left: 6px; border: 1px solid currentColor; border-radius: 50%; font: italic 700 10px/1 var(--font-display); opacity: 0.7; vertical-align: 1px; }
.sf-region:hover, .sf-region:focus-visible { border-color: var(--accent); }
.sf-region:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* Exploring: the suit, the rover's battery, the backpack and notes, under the region name. */
.sf-eva { position: absolute; left: 14px; top: 58px; z-index: 3; display: grid; gap: 6px; width: 210px; pointer-events: none; }
.sf-eva > * { pointer-events: auto; }
.sf-suit { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; background: rgba(20, 14, 16, 0.82); border: 1px solid var(--line-2); border-radius: 10px; padding: 4px 10px; font-size: var(--fs-xs); color: var(--fg); }
.sf-suit .k { color: var(--fg-2); font-weight: 600; }
.sf-suit .bar { height: 7px; border-radius: 7px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
.sf-suit .bar i { display: block; height: 100%; background: #4fd0c4; }
.sf-suit.warn .bar i { background: var(--warn); }
.sf-suit.crit .bar i { background: var(--crit); }
.sf-suit.crit b { color: var(--crit); }
.sf-suit.batt .bar i { background: var(--accent); }
.sf-suit b { font-variant-numeric: tabular-nums; }
.sf-pack { display: flex; gap: 4px; flex-wrap: wrap; }
.sf-pack .slot { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; border: 1px dashed var(--line-2); background: rgba(20, 14, 16, 0.6); color: var(--fg); }
.sf-pack .slot.full { border-style: solid; background: rgba(20, 14, 16, 0.86); }
.sf-can { justify-self: start; font: inherit; font-size: var(--fs-xs); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--accent); background: rgba(20, 14, 16, 0.86); color: var(--fg); cursor: pointer; }
.sf-can:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sf-evanote { margin: 0; font-size: var(--fs-xs); background: rgba(20, 14, 16, 0.82); border: 1px solid var(--line-2); border-radius: 10px; padding: 4px 10px; color: var(--fg); }
.sf-evanote.ok { border-color: var(--ok); }
.sf-evanote.warn { border-color: var(--warn); }
.sf-evanote.crit { border-color: var(--crit); color: var(--crit); }
/* The solar flare's banner: what to do and the seconds left, top centre in the hint's place (the hint hides while it shows). */
.sf-alert { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; justify-content: center; gap: 10px; width: max-content; max-width: calc(100% - 380px); background: rgba(20, 14, 16, 0.96); border: 2px solid var(--line-2); border-radius: 12px; padding: 6px 14px; font-size: var(--fs-sm); font-weight: 600; color: var(--fg); text-align: center; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4); }
.sf-alert b { font: 700 var(--fs-md) var(--font-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sf-alert b:empty { display: none; }
.sf-alert.crit { border-color: var(--crit); }
.sf-alert.crit b { color: var(--crit); }
.sf-alert.ok { border-color: var(--ok); }
.sf-alert.ok b { color: var(--ok); }
.sf-mini { position: absolute; right: 12px; top: 12px; width: 160px; height: 160px; padding: 0; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; background: #120a0c; pointer-events: auto; cursor: zoom-in; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4); }
.sf-mini canvas { width: 100%; height: 100%; display: block; }
.sf-mini:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* The FPS readout (Display settings, Show FPS), under the minimap: 12 px + the 160 px minimap + 8 px clear. */

.sf-map-head { position: absolute; left: 12px; right: 12px; top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: rgba(20, 14, 16, 0.88); border: 1px solid var(--line-2); border-radius: 10px; padding: 6px 8px 6px 12px; }
.sf-map-head b { font-family: var(--font-display); margin-right: auto; }
.sf-map-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: var(--fs-xs); color: var(--fg-2); }
.sf-map-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; border: 1px solid rgba(255, 255, 255, 0.2); }
.sf-map-head button { min-width: 34px; min-height: 34px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--raised); color: var(--fg); font-weight: 700; cursor: pointer; }
.sf-map-head button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.sf-debug { position: absolute; left: 12px; bottom: 12px; margin: 0; background: rgba(0, 0, 0, 0.72); color: #b8f7a8; font: 11px/1.4 var(--font-data); padding: 6px 8px; border-radius: 6px; white-space: pre; }

  .sf-mini { width: 112px; height: 112px; }

  .sf-eva { width: min(210px, calc(100% - 146px)); } /* 146 = 14 px left + 112 px minimap + 12 px right + 8 px clear */
  .sf-hint, .sf-alert { max-width: calc(100% - 270px); }
}
.sf-joy, .sf-btn { display: none; }
@media (pointer: coarse) {
  .sf-joy { display: block; position: absolute; left: 18px; bottom: 18px; width: 118px; height: 118px; border-radius: 50%; background: rgba(20, 14, 16, 0.45); border: 2px solid rgba(255, 255, 255, 0.18); touch-action: none; }

  .sf-menu { bottom: 146px; max-height: calc(100% - 160px); }

}
@media (max-width: 640px) {

  .sf-hint, .sf-alert { top: 150px; left: 12px; right: 12px; transform: none; width: auto; max-width: none; }

.pilot-card:hover, .pilot-card:focus-visible { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.seat-list { display: flex; flex-wrap: wrap; gap: 8px; }

.jobrow.me { background: var(--accent-soft); }

@media (max-width: 1100px) {
  .sf-layout { grid-template-columns: minmax(0, 1fr); }
  .sf-root { height: min(66vh, 640px); min-height: 380px; }

<script>
/*
 * SOL 500 — pure simulation engine (no DOM). Works as a browser global (SolEngine) and a Node module.
 *
 * Mission state (plain JSON):
 *   { seed, eventsOn, coop, turn, sol, status: 'active'|'success'|'lost', endCause,
 *     loadout, terrain: { ice: [[x,y]], rock: [[x,y]] }, layout: [{ type, x, y }], projects: [...],
 *     modules: { type: { count, broken } }, crops: [age...],
 *     resources: { o2, water, food, spares, materials }, wallWater, cleanliness, morale,
 *     crew: [{ id, role, name, health, dose, status: 'active'|'down'|'dead', downTurns, revives, grounded, harm }],
 *     science, totals, depot: { drops, incoming: [{ kind, eta }] }, schedule, events, pending, history, log
 *   v3: pilot (solo: the crew member you walk as; null in co-op), expedition (exploring state, see newExpedition) }
 *   Exploring: what the crew delivers is banked in expedition.banked and added when the round advances (applyExpedition);
 *   the rules for collecting and carrying finds live in src/expedition.js.
 *
 * Plan (the player's decisions for one turn):
 *   { jobs: { crewId: job }, modulesOn: { type: bool }, rations: 'full'|'reduced', habMode: 'normal'|'austerity',
 *     choices: { eventType: option }, drainWall: kg, builds: [{ type, x, y }], scrap: [type], request: kind|null }

  'use strict';

  // ---------- helpers ----------

  const clone = o => (typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
  const key = (x, y) => x + ',' + y;
  const cheb = (x, y) => Math.max(Math.abs(x - D.GRID.hq[0]), Math.abs(y - D.GRID.hq[1]));
  const manhattan = (x, y) => Math.abs(x - D.GRID.hq[0]) + Math.abs(y - D.GRID.hq[1]);

  function hashString(str) {
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < str.length; i++) {

      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);

  // Independent random streams per (seed, purpose, turn) keep the event schedule and the map

  function rng(...parts) {

    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);

  function pickWeighted(r, weights) {
    const keys = Object.keys(weights);

      if (x <= 0) return k;

  function newMissionCode(random) {

    const words = ['ARES', 'JEZERO', 'GALE', 'THARSIS', 'HELLAS', 'ELYSIUM', 'UTOPIA', 'ACIDALIA'];
    return words[Math.floor(r() * words.length)] + '-' + String(Math.floor(r() * 9000) + 1000);

  // ---------- seasons ----------
  function seasonAt(sol) {

  function referenceKit(difficulty, crewSize) {

  function validateLoadout(loadout, difficulty, crewSize) {

  // ---------- event schedule ----------
  function buildSchedule(seed, eventsOn, level) {
    const diff = D.DIFFICULTY[difficultyOf(level)];
    const turns = [];

      turns.push({ weather: 'clear', spe: false, devil: false, flavor: null, conjunction: t === D.CONJUNCTION_TURN });
    }

    const r = rng(seed, 'schedule');
    if (r() < diff.globalStorm) {
      const [lo, hi] = D.GLOBAL_STORM_TURNS;

      for (let k = 0; k < D.GLOBAL_STORM_LENGTH && start + k < D.TURNS; k++) turns[start + k].weather = 'global';
    }
    turns[3 + Math.floor(r() * 15)].spe = true; // at least one solar particle event
    for (let t = 1; t < D.TURNS; t++) {
      const season = seasonAt(t * D.TURN_SOLS);
      const pStorm = season.dustSeason ? D.REGIONAL_STORM_CHANCE.season : D.REGIONAL_STORM_CHANCE.calm;
      if (r() < pStorm && turns[t].weather === 'clear') turns[t].weather = 'regional';
      if (r() < D.EXTRA_SPE_CHANCE) turns[t].spe = true;
      if (r() < D.DUST_DEVIL_CHANCE && turns[t].weather === 'clear') turns[t].devil = true;
      if (r() < diff.flavor && t >= 2) turns[t].flavor = pickWeighted(r, D.FLAVOR_WEIGHTS);
    }
    return turns;
  }

  // ---------- map ----------
  function allTiles() {
    const out = [];
    for (let y = 0; y < D.GRID.h; y++) for (let x = 0; x < D.GRID.w; x++) out.push([x, y]);
    return out;
  }

  function buildTerrain(seed) {
    const r = rng(seed, 'terrain');
    const ice = shuffle(r, allTiles().filter(([x, y]) => cheb(x, y) >= 3)).slice(0, D.GRID.ice);
    const iceKeys = new Set(ice.map(([x, y]) => key(x, y)));
    const rock = shuffle(r, allTiles().filter(([x, y]) => cheb(x, y) >= 2 && !iceKeys.has(key(x, y)))).slice(0, D.GRID.rock);
    return { ice, rock };
  }

  function tileSets(s, pending) {
    const occupied = new Set();
    for (const t of s.layout) occupied.add(key(t.x, t.y));
    for (const p of s.projects) if (p.x != null) occupied.add(key(p.x, p.y));
    for (const b of pending || []) if (b.x != null) occupied.add(key(b.x, b.y));
    return {
      occupied,
      ice: new Set(s.terrain.ice.map(([x, y]) => key(x, y))),
      rock: new Set(s.terrain.rock.map(([x, y]) => key(x, y))),
    };
  }

  function tileAllows(type, x, y, sets) {
    const k = key(x, y);
    if (sets.occupied.has(k) || sets.rock.has(k)) return false;
    if (type === 'icedrill') return sets.ice.has(k);
    if (sets.ice.has(k)) return false;
    if (type === 'reactor') return cheb(x, y) >= 2;
    return true;
  }

  function touchesBase(s, x, y, pending) {
    const { occupied } = tileSets(s, pending);
    return [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => occupied.has(key(x + dx, y + dy)));
  }

  function buildSpots(s, type, pending) {
    if (!D.PLACED.includes(type)) return [];
    const sets = tileSets(s, pending);
    return allTiles().filter(([x, y]) => tileAllows(type, x, y, sets) &&
      [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => sets.occupied.has(key(x + dx, y + dy))));
  }

  function autoPlace(s, type) {

    if (!cands.length) return null;
    const adj = ([x, y]) => ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => sets.occupied.has(key(x + dx, y + dy))) ? 0 : 1);
    cands.sort((a, b) => adj(a) - adj(b) || manhattan(a[0], a[1]) - manhattan(b[0], b[1]) || a[1] - b[1] || a[0] - b[0]);

  //   banked { water, materials, spares, food, o2, science, morale, lines } (added at the next advance)
  //   incidents [{ crewId, kind }] · stats { crewId: { finds: { kind: loads } } }
  //   suits { crewId: seconds left } (missing = full) · collapsed { crewId: { x, y } } (co-op, waiting for a revive)

  }
  function newExpedition() {
    return {
      v: 2, revealed: {}, sites: {}, structures: {}, landmarks: {}, regions: [], beacons: [], kits: 0, refills: {},
      carried: {}, drops: [], banked: freshBank(), goals: [], incidents: [], stats: {},

      flare: null, clock: 0, where: {}, forecastUntil: -1,

  }

  // Missing or malformed fields (an old save, a hand-edited one) are replaced with fresh ones, so the rules never
  // meet the wrong type. Returns the repaired expedition (a new one if it wasn't an object at all).
  function repairExpedition(x) {
    const fresh = newExpedition();
    if (!x || typeof x !== 'object' || Array.isArray(x)) return fresh;
    const isMap = v => !!v && typeof v === 'object' && !Array.isArray(v);
    for (const k of Object.keys(fresh)) {
      const want = fresh[k], have = x[k];
      let ok;
      if (Array.isArray(want)) ok = Array.isArray(have);
      else if (want === null) ok = have === null || isMap(have);
      else if (typeof want === 'object') ok = isMap(have);
      else ok = typeof have === typeof want && Number.isFinite(have);
      if (!ok) x[k] = want;
    }
    for (const k of BANK_RES) if (!Number.isFinite(x.banked[k])) x.banked[k] = 0;

  // Adds one item to a bank. Report lines are summed per crew member, find kind, resource and region; `late` marks

  function bankItem(bank, crewId, item, late) {

    else bank.lines.push({ crewId, kind: item.kind, res: item.res, region: item.region, amount, loads: 1, late: !!late });

  function buildState(loadout, seed, eventsOn, level, size) {

      sol: 0,
      status: 'active',

      loadout: L,

      expedition: newExpedition(),
    };

    for (const type of order) for (let i = 0; i < L[type]; i++) autoPlace(s, type);

  }

  function createMission(opts) {
    const o = opts || {};
    const v = validateLoadout(o.loadout, o.difficulty, o.crewSize);
    if (!v.ok) throw new Error('Invalid loadout: ' + v.errors.join(', '));
    const s = buildState(o.loadout, o.seed || newMissionCode(), o.events !== false, o.difficulty, o.crewSize);
    if (o.coop) s.coop = true;
    if (o.names) for (const c of s.crew) if (o.names[c.id]) c.name = String(o.names[c.id]).slice(0, 24);
    if (o.pilot != null) {
      if (!s.crew.some(c => c.id === o.pilot)) throw new Error('Invalid pilot: ' + o.pilot);
      s.pilot = o.pilot;
    }
    beginTurn(s);
    s.history.push(snapshot(s, null));
    return s;
  }

  // Missions saved before v3 get the exploring state and a pilot when they load: the astronaut that player was
  // walking as if they are still alive, otherwise the first active (then the first living) crew member.
  function upgradeMission(m, opts) {
    if (!m || typeof m !== 'object') return m;
    m.expedition = repairExpedition(m.expedition);
    // A pilot who isn't in the crew (a hand-edited save) is chosen again, the same way as for an old save.
    if (m.pilot != null && !(m.crew || []).some(c => c.id === m.pilot)) m.pilot = undefined;
    if (m.pilot === undefined) {

      const alive = c => c.status !== 'dead';
      const pick = !m.coop && (m.crew.find(c => c.id === controlId && alive(c)) || m.crew.find(isActive) || m.crew.find(alive));
      m.pilot = pick ? pick.id : null;
