<script>
/*
 * SOL 500 — exploring on the surface (spec §3): finds, dropped loads and the parked rover on the ground; holding E to
 * collect, survey, pick up or revive; the suit, the rover's battery and delivering at the base; the dangers (spec §3.4:
 * the solar flare's countdown and the cover from it, dust devils, how far you see in a dust storm); and the HUD for all
 * of it. The rules live in src/expedition.js and src/dangers.js. This layer decides when to ask for them, through the
 * ui.js hook `exp` (solo play runs them on the spot, co-op sends them to the server), and draws what the mission says.
 * Browser-only (SolEva).
 *
 * The round's clock moves the dust devils and times the flare. In solo play it is this layer's own time, which stops
 * while the surface is hidden (like the suit) and is saved with the mission; in co-op it is the server's (data.clock).
 *
 * API: SolEva.create(env) → eva
 *        env: { t(key, params), hooks(), crewName(id), home(), drawRover(ctx, x, y), player(), now() → seconds,
 *               push(dx, dy) (a dust devil throws your astronaut that far, world px) }
 *        hooks() is ui.js's: exp(type, payload, pos) runs the rules (above), suit(report) keeps the solo save, and
 *        card({ type, id, kind, ... }) shows a point of interest's card (a Kestrel structure's story log, a hab pod's as you
 *        walk in, a landmark's discovery { by, science }, a formation's fact when you survey it)
 *      eva.el · eva.alert                           the HUD node and the flare's banner, for the surface overlay
 *      eva.sync(data) → { round, fresh }            round: a new round began; fresh: first look at this mission/seat
 *                                                   (data.clock, co-op only: { t: round seconds, at: env.now() then })
 *      eva.reset()                                  a new mission or room: forget the last one's suit, battery, collapse and hold
 *      eva.canMove(player, nx, ny) → may your astronaut step to (nx, ny)? (world px)
 *      eva.step(dt, player, world, moved, focus)    every frame: suit, battery, delivering, holds, dangers, the HUD
 *      eva.focusAt(x, y, player, world) → a focus on a find (or a landmark's or a formation's site, as one), a dropped load, a
 *        collapsed crewmate, the parked rover or the door
 *        of a Kestrel structure not used yet (kind 'kestrel')
 *      eva.holdable(focus) · eva.label(focus) · eva.start(focus) · eva.stop()       E / the action button
 *      eva.hasRoom() → does your backpack take another load?
 *      eva.act(type, player, payload) → Promise of the rules' answer (board, park) · eva.canister(player) (the button, or Q)
 *      eva.drawZone(ctx, x0, y0, x1, y1, world) the base zone, and every cover in view during a flare warning
 *      eva.sprites(x0, y0, x1, y1, world, time) → [{ y, draw(ctx) }] · eva.drawOver(ctx)
 *      eva.flareFx(player) → { warn: 0–1, flash: 0–1 }: the red edge of a flare countdown, the flash when it hits
 *      eva.view(player) → tiles you see from where you stand (Z.viewAt) · eva.clock() → the round's clock (s) · eva.alerting()
 *      eva.suitBar(teammate) → 0–1, or null: the suit bar on a teammate's name tag (drawn by SolPaint's drawTags)
 *      eva.marks(world, px, py) → minimap markers · eva.report() → { suit (null while collapsed), driven } for positions
 *      eva.roverAtBay(player) · eva.driving() · eva.collapsed(crewId) · eva.state() (play-testing)
 */
(function (root) {
  'use strict';
  const D = root.SolData, W = root.SolWorldgen, X = root.SolExpedition, Z = root.SolDangers, P = root.SolPaint, SW = root.SolWorld, A = root.SolArt;
  const { drawFind, drawDrop, drawRing, drawDevil, roundRect } = P.sprites;
  const XD = D.EXPEDITION, ZD = D.DANGERS;
  const T = 64, ICY = W.REGIONS.indexOf('icy');
  const REACH = 0.9 * T;                        // how close the spot you look at must be to a find
  const COLORS = { ice: '#9fd3ea', metal: '#d9b46a', pod: '#ece5db', science: '#6fa8ff' };
  const RES_ICON = { water: 'water', materials: 'materials', food: 'food', o2: 'o2', spares: 'spares', science: 'science' };
  // No message when these are refused: they are retried, or harmless (a discovery is asked for when a landmark comes into
  // view, a refill as you walk into a hab pod; 'known' only means a crewmate saw it first).
  const QUIET = ['deliver', 'collapse', 'park', 'flareStart', 'flareEnd', 'discover', 'refill'];
  const CAN_BELOW = XD.suit - XD.canister.suit;  // a canister is breathed only when all of its 45 s fit in the suit
  const VERDICT = 8;                             // seconds the flare's verdict stays on the banner
  const INSIDE = { cave: 'eva.inCave', tube: 'eva.inTube', pod: 'eva.inPod' }; // the note while you are in cover out there
  // What holding E does at a Kestrel structure's door (the hab pod has no hold: you walk in).
  const VERB = { cache: 'eva.open', wreck: 'eva.salvage', array: 'eva.salvage', weather: 'eva.repair', mast: 'eva.repair' };
  // A chunk's finds or caves less those under a point of interest's footprint (its `hidden`), as X.findsIn / X.cavesIn
  // give them: never drawn, marked, smelled or offered.
  const visible = (c, k) => (c.hidden[k].length ? c[k].filter(o => !c.hidden[k].includes(o.n)) : c[k]);
  // What can be collected in a chunk, with its id: its finds ("<cx>,<cy>:<n>") and the sites lying in it of the landmarks and
  // formations it lists ("L<i>,<j>:<n>", "F<cx>,<cy>:0"). A landmark is listed by every chunk its box touches, so each chunk
  // takes only the sites in it, and a site comes once.
  function sitesIn(c, cx, cy) {
    const out = visible(c, 'finds').map(f => [cx + ',' + cy + ':' + f.n, f]);
    for (const k of c.landmarks.concat(c.formations)) {
      for (const f of k.sites) if (SW.chunkOf(f.x) === cx && SW.chunkOf(f.y) === cy) out.push([k.id + ':' + f.n, f]);
    }
    return out;
  }

  function create(env) {
    const t = (k, p) => env.t(k, p);
    const wall = () => (env.now ? env.now() : 0);
    let data = null, me = null, turn = null, wasDown = false;
    let suit = XD.suit, driven = 0, hold = null, keyHeld = false;
    let now = 0, deliverAt = -1e9, collapseAt = -1e9, reportAt = -1e9, marksAt = -1e9, marksCache = [], refillAt = -1e9, inPod = null;
    let soloClock = 0, coopClock = null, hitAt = -1e9, flareAskAt = -1e9, flareEndAt = -1e9, warned = false;
    let note = null;                               // { text, cls, until }
    let peek = null;                               // the chunks the surface holds (SolWorld's peek), from the last frame
    let asked = {};                                // landmark id → when its discovery was answered (Infinity while asked)

    const mission = () => (data && data.mission) || null;
    const exp = () => mission().expedition;
    const crew = () => (mission() && me ? mission().crew.find(c => c.id === me) || null : null);
    const pack = () => (me && Array.isArray(exp().carried[me]) ? exp().carried[me] : []);
    const collapsed = id => !!(mission() && mission().expedition && mission().expedition.collapsed[id]);
    const benched = () => !!(me && exp().benched.includes(me));
    const live = () => { const m = mission(), c = crew(); return !!m && !!m.expedition && m.status === 'active' && !!c && c.status === 'active'; };
    const hasRoom = () => live() && pack().length < X.capacity(mission(), me);
    const at = p => ({ x: Math.round(p.x), y: Math.round(p.y) });
    const near2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);
    const secs = s => (Math.round(s * 10) / 10).toString();
    const clock = () => (coopClock ? coopClock.t + (wall() - coopClock.at) : soloClock);
    function say(text, cls, s) { note = { text, cls: cls || '', until: now + (s || 3) }; }
    // A point of interest's card over the surface (ui.js shows each once a mission): { type: 'log' | ..., id, kind }.
    const card = c => { const h = env.hooks(); if (h && h.card) h.card(c); };

    // ---------- the HUD ----------
    const node = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
    const el = node('div', 'sf-eva');
    const meter = () => { const row = node('div', 'sf-suit'), k = node('span', 'k'), bar = node('span', 'bar'), fill = node('i'), v = node('b'); bar.appendChild(fill); row.append(k, bar, v); return { row, k, fill, v }; };
    const suitM = meter(), battM = meter();
    battM.row.classList.add('batt');
    const packEl = node('div', 'sf-pack');
    const canBtn = node('button', 'sf-can');
    canBtn.type = 'button';
    canBtn.addEventListener('click', () => canister(env.player && env.player()));
    const noteEl = node('p', 'sf-evanote');
    noteEl.setAttribute('role', 'status');
    el.append(suitM.row, battM.row, packEl, canBtn, noteEl);
    // The flare's banner: what to do is announced when it changes; the seconds tick on their own, unannounced.
    const alert = node('div', 'sf-alert');
    alert.hidden = true;
    const alertMsg = node('span', 'msg'), alertSecs = node('b');
    alertMsg.setAttribute('role', 'status');
    alertSecs.setAttribute('aria-hidden', 'true');
    alert.append(alertMsg, alertSecs);
    const shown = {};
    const text = (n, k, v) => { if (shown[k] !== v) { shown[k] = v; n.textContent = v; } };
    const prop = (k, v, set) => { if (shown[k] !== v) { shown[k] = v; set(v); } };

    // Are you under cover from the flare? The banner and the red edge ask with the slack the verdict gives (Z.slackOf: the
    // co-op server's, none in solo play), so they agree with it. Like the in-cave note, it reads the chunks the surface
    // holds, so asking every frame never builds one.
    const covered = p => !!(p && Z.shelterAt(mission(), p, Z.slackOf(mission()), peek));
    // A landmark is discovered the first time anyone sees its centre (spec §3.6): here, when that tile comes into your view
    // as the fog's does (within viewOf(p) tiles of the tile under you; the rules allow 15.5). It is asked once while the
    // answer is out, and again 3 s after a refusal while it is still in view and undiscovered. Its card opens on the ok; in
    // co-op the server's event opens it on every tab as well (ui.js shows it once).
    function sight(p) {
      const x = exp(), tx = Math.floor(p.x / T), ty = Math.floor(p.y / T), r = viewOf(p);
      for (let cy = SW.chunkOf(ty) - 1; cy <= SW.chunkOf(ty) + 1; cy++) for (let cx = SW.chunkOf(tx) - 1; cx <= SW.chunkOf(tx) + 1; cx++) {
        const c = peek && peek(cx, cy);
        if (c) for (const l of c.landmarks) {
          if (x.landmarks[l.id] || now - (asked[l.id] == null ? -1e9 : asked[l.id]) < 3) continue;
          if ((l.x - tx) * (l.x - tx) + (l.y - ty) * (l.y - ty) > r * r) continue;
          asked[l.id] = Infinity;
          const by = me;
          act('discover', p, { landmark: l.id }).then(res => {
            asked[l.id] = now;
            if (res.ok) card({ type: 'landmark', id: l.id, kind: l.kind, by, science: res.science });
          });
        }
      }
    }
    // The hab pod you stand in (the painter's "inside": the tile under you is in its 5×5 box), from the chunks the surface
    // holds: the chunk of that tile lists it.
    function podAt(p) {
      const tx = Math.floor(p.x / T), ty = Math.floor(p.y / T), c = peek && peek(SW.chunkOf(tx), SW.chunkOf(ty));
      if (c) for (const s of c.structures) if (s.kind === 'pod' && tx >= s.box[0] && tx <= s.box[2] && ty >= s.box[1] && ty <= s.box[3]) return s;
      return null;
    }
    // Tiles you see from where you stand (Z.viewAt): the weather's view, a lava tube's headlamp, a star dune's crest. The
    // tile under you comes from the chunks the surface holds; before the first frame, or off them, it is open ground.
    function viewOf(p) {
      const tx = p ? Math.floor(p.x / T) : 0, ty = p ? Math.floor(p.y / T) : 0, cx = SW.chunkOf(tx), cy = SW.chunkOf(ty);
      const c = p && peek ? peek(cx, cy) : null;
      return Z.viewAt(mission(), !!(p && p.inRover), c ? W.tileOf(c, tx - cx * W.CHUNK, ty - cy * W.CHUNK) : null);
    }
    // The flare as your astronaut sees it: null, or { cls, msg, left (seconds, or null) } for the banner.
    function flareView(p) {
      const m = mission(), f = m && m.expedition && m.expedition.flare;
      if (!f || !me) return null;
      const rt = clock();
      if (!f.over) {
        if (rt < f.warn) return null;
        if (rt >= f.end) return { cls: 'crit', msg: t('eva.flare.now'), left: null };
        const safe = covered(p);
        // − 1e-6: float noise (263.182 − 203.182 is 60.00000000000003) must not round a whole second up to 61.
        return { cls: safe ? 'ok' : 'crit', msg: t(safe ? 'eva.flare.covered' : 'eva.flare.run'), left: Math.ceil(f.end - rt - 1e-6) };
      }
      if (rt >= f.end + VERDICT) return null;
      const hit = f.hit.includes(me);
      return { cls: hit ? 'crit' : 'ok', msg: t(hit ? 'eva.flare.hit' : 'eva.flare.missed', { d: ZD.flare.dose }), left: null };
    }

    function statusNote(p) {
      if (!me || !mission()) return null;
      if (collapsed(me)) return { text: t('eva.collapsedCoop'), cls: 'crit' };
      if (benched()) return { text: t('eva.benched'), cls: 'warn' };
      if (p && p.inRover && driven >= XD.roverRange) return { text: t('eva.flat'), cls: 'warn' };
      const atBase = !!p && X.inBaseZone(p);
      if (live() && pack().length >= X.capacity(mission(), me) && !atBase) return { text: t('eva.full'), cls: '' };
      if (live() && suit <= XD.suit * 0.2 && !atBase) return { text: t('eva.low'), cls: 'crit' };
      const cover = live() && p && !atBase ? INSIDE[Z.shelterAt(mission(), p, 0, peek)] : null;
      if (cover) return { text: t(cover), cls: 'ok' };
      return null;
    }
    // The canister button shows only when breathing one now is worth it: outside, on your feet, and with room for all 45 s.
    const canBreathe = p => live() && !collapsed(me) && !benched() && pack().some(i => i.canister) && suit <= CAN_BELOW && !(p && X.inBaseZone(p));

    function renderHud(p) {
      const hide = !me || !mission() || !mission().expedition || mission().status !== 'active';
      prop('hide', hide, v => { el.hidden = v; });
      const fv = hide ? null : flareView(p);
      prop('ah', !fv, v => { alert.hidden = v; });
      if (fv) {
        prop('ac', 'sf-alert ' + fv.cls, v => { alert.className = v; });
        text(alertMsg, 'am', fv.msg);
        text(alertSecs, 'as', fv.left == null ? '' : t('eva.secs', { s: fv.left }));
      }
      if (hide) return;
      const atBase = !!p && X.inBaseZone(p);
      text(suitM.k, 'sk', t('eva.suit'));
      const seconds = t('eva.secs', { s: Math.ceil(suit) }); // one unit, paused or not
      text(suitM.v, 'sv', atBase && !benched() ? t('eva.paused', { v: seconds }) : seconds);
      prop('sw', (100 * suit / XD.suit).toFixed(1) + '%', v => { suitM.fill.style.width = v; });
      const f = suit / XD.suit;
      prop('sc', 'sf-suit' + (f <= 0.2 ? ' crit' : f <= 0.4 ? ' warn' : ''), v => { suitM.row.className = v; });
      const inRover = !!(p && p.inRover);
      prop('bh', !inRover, v => { battM.row.hidden = v; });
      if (inRover) {
        const left = Math.max(0, XD.roverRange - driven);
        text(battM.k, 'bk', t('eva.battery'));
        text(battM.v, 'bv', Math.floor(left) + ' ' + t('eva.tiles'));
        prop('bw', (100 * left / XD.roverRange).toFixed(1) + '%', v => { battM.fill.style.width = v; });
      }
      const items = live() || collapsed(me) ? pack() : [], cap = X.capacity(mission(), me);
      prop('pk', items.map(i => i.res + (i.canister ? '*' : '')).join(',') + '|' + cap + '|' + (shown.lang || ''), () => {
        packEl.textContent = '';
        packEl.setAttribute('aria-label', t('eva.pack', { n: items.length, m: cap }));
        for (let i = 0; i < cap; i++) {
          const it = items[i], slot = node('span', 'slot' + (it ? ' full' : ''));
          if (it) { slot.innerHTML = A.icon(RES_ICON[it.res] || 'materials', 14); slot.title = t('haul.' + it.res, { n: it.amount }); }
          packEl.appendChild(slot);
        }
      });
      prop('ch', !canBreathe(p), v => { canBtn.hidden = v; });
      text(canBtn, 'ct', t('eva.useCanister', { s: XD.canister.suit }));

      text(noteEl, 'nt', n ? n.text : '');
      prop('nc', 'sf-evanote' + (n && n.cls ? ' ' + n.cls : ''), v => { noteEl.className = v; });
      prop('nh', !n, v => { noteEl.hidden = v; });
    }

    // ---------- asking the rules (through ui.js) ----------
    function act(type, p, payload) {
      const h = env.hooks();
      if (!h || !h.exp) return Promise.resolve({ error: 'net' });
      return Promise.resolve(h.exp(type, payload || {}, p ? at(p) : null)).then(r => {
        const res = r || { error: 'net' };
        if (res.error && !QUIET.includes(type)) say(t('eva.err.' + res.error, { s: CAN_BELOW }), 'warn');
        return res;
      }, () => { if (!QUIET.includes(type)) say(t('eva.err.net'), 'warn'); return { error: 'net' }; });
    }

    // Breathes an O₂ canister from your backpack (the button, or Q): +45 s of suit now. The rules get your live suit level,
    // not the one last reported, so the 45 s are added to what you really have.
    function canister(p) {
      if (!live() || !pack().some(i => i.canister)) return;
      act('canister', p, { suit: Math.round(suit * 10) / 10 }).then(r => {
        if (!r.ok) return;
        suit = Number.isFinite(r.suit) ? r.suit : Math.min(XD.suit, suit + XD.canister.suit);
        say(t('eva.breathed', { s: XD.canister.suit }), 'ok');
      });
    }

    // What is waiting outside this round (Z.outside), said once a round when you first look at it.
    function brief(m) {
      const params = { storm: { n: Z.viewTiles(m, false) } };
      const list = Z.outside(m).map(k => t('eva.brief.' + k, params[k]));
      if (list.length) say(t('eva.brief', { list: list.join(', ') }), 'warn', 8);
    }

    // ---------- each new look at the mission ----------
    function sync(d) {
      data = d;
      coopClock = d.clock && Number.isFinite(d.clock.t) && Number.isFinite(d.clock.at) ? d.clock : null;
      const m = d.mission;
      if (!m || !m.expedition) return { round: false, fresh: false };
      const id = d.controlId || null;
      let round = false, fresh = false;
      if (m.turn !== turn || id !== me) {
        const first = turn == null;
        round = !first && m.turn !== turn && id === me;
        fresh = !round;
        turn = m.turn;
        me = id;
        suit = me ? X.suitOf(m, me) : XD.suit;
        driven = Number(m.expedition.roverDriven) || 0;
        hold = null;
        collapseAt = hitAt = flareAskAt = flareEndAt = -1e9;
        wasDown = !!(me && m.expedition.collapsed[me]);
        if (round) soloClock = 0;
        else if (first) soloClock = Z.clockOf(m); // a reload picks the round's clock up where it was saved
        warned = !!(m.expedition.flare && clock() >= m.expedition.flare.warn); // a warning already under way is not said again
        if (first || round) brief(m);
      }
      const down = !!(me && m.expedition.collapsed[me]);
      if (wasDown && !down && me) { suit = X.suitOf(m, me); say(t('eva.revived', { s: XD.reviveSuit }), 'ok', 4); }
      wasDown = down;
      if (down || benched()) suit = 0;
      driven = Math.max(driven, Number(m.expedition.roverDriven) || 0); // it only ever goes up within a round
      shown.lang = d.lang;
      return { round, fresh };
    }

    // A new mission or room (SolSurface.reset): nothing of the last one's exploring carries over, so the next sync is a
    // fresh look even with the same astronaut in the same round.
    function reset() {
      data = me = turn = hold = note = coopClock = peek = null;
      wasDown = keyHeld = warned = false;
      suit = XD.suit;
      driven = soloClock = 0;
      deliverAt = collapseAt = reportAt = marksAt = hitAt = flareAskAt = flareEndAt = refillAt = -1e9;
      inPod = null;
      asked = {};
      marksCache = [];
    }

    // ---------- every frame ----------
    function canMove(p, nx, ny) {
      if (!me || !mission() || !mission().expedition) return true;
      if (collapsed(me)) return false;
      const atBase = X.inBaseZone(p);
      if (benched() && atBase && !X.inBaseZone({ x: nx, y: ny })) return false; // solo: back out next round
      if (!atBase && suit <= 0) return false;
      if (p.inRover && driven >= XD.roverRange) return false;
      return true;
    }

    function step(dt, p, world, moved, focus) {
      now += dt;
      peek = world.peek;
      const m = mission();
      if (m && m.expedition && m.status === 'active' && !coopClock) soloClock += dt;
      if (live()) {
        const x = m.expedition, atBase = X.inBaseZone(p), out = !atBase && !collapsed(me) && !benched();
        if (p.inRover && moved > 0) driven = Math.min(XD.roverRange, driven + moved / T);
        if (out) {
          let k = p.inRover && !hold ? XD.drain.rover : 1;   // you step out of the rover to work
          if (p.sprinting) k *= XD.drain.sprint;
          if (world.region(Math.floor(p.x / T), Math.floor(p.y / T)) === ICY) k *= XD.drain.icy;
          suit = Math.max(0, suit - dt * k);
          // A dust devil that catches you on foot throws you aside and takes suit time (spec §3.4); the rover is immune. A hit
          // that empties the suit throws nobody: you collapse where it caught you, which is where the server anchors it.
          const d = !p.inRover && now - hitAt > ZD.devils.calm ? Z.devilHit(m, p, clock()) : null;
          if (d) {
            hitAt = now;
            hold = null;
            suit = Math.max(0, suit - ZD.devils.suit);
            let dx = p.x - d.x, dy = p.y - d.y;
            const len = Math.sqrt(dx * dx + dy * dy);
            if (len < 1) { dx = d.dx; dy = d.dy; } else { dx /= len; dy /= len; }
            if (env.push && suit > 0) env.push(dx * ZD.devils.push * T, dy * ZD.devils.push * T);
            say(t('eva.devil', { s: ZD.devils.suit }), 'warn', 4);
          }
          if (suit <= 0 && now - collapseAt > 3) {
            collapseAt = now;
            hold = null;
            act('collapse', p, { driven: Math.round(driven * 10) / 10 }).then(r => {
              if (r.benched) { env.home(); say(t('eva.collapsedSolo'), 'crit', 8); }
            });
          }
        }
        // Solo play times its own solar flare: the first step outside starts the warning, and its end checks your cover.
        // In co-op the server does both.
        if (!m.coop) {
          if (out && Z.flareDue(m) && !x.flare && now - flareAskAt > 1) { flareAskAt = now; act('flareStart', p, { t: clock() }); }
          if (x.flare && !x.flare.over && clock() >= x.flare.end && now - flareEndAt > 1) { flareEndAt = now; act('flareEnd', p, { t: clock() }); }
        }
        if (x.flare && !x.flare.over && !warned && clock() >= x.flare.warn) {
          warned = true;
          say(t('eva.flare.warned', { s: ZD.flare.countdown }), 'crit', 6);
        }
        // An abandoned hab pod (spec §3.7): walking in fills your suit, once per pod a round (x.refills, C3), and its story log
        // opens (ui.js shows each once a mission).
        const pod = out ? podAt(p) : null;
        if (pod && pod.id !== inPod) card({ type: 'log', id: pod.id, kind: 'pod' });
        inPod = pod ? pod.id : null;
        if (pod && !(x.refills[me] || []).includes(pod.id) && now - refillAt > 2) {
          refillAt = now;
          act('refill', p, { pod: pod.id }).then(r => {
            if (!r.ok) return;
            suit = r.suit;
            say(t('eva.refilled', { s: Math.round(r.suit) }), 'ok', 4);
          });
        }
        if (out) sight(p);
        if (atBase && pack().length && !collapsed(me) && now - deliverAt > 1.5) { // the rules refuse anything while you are down
          deliverAt = now;
          const n = pack().length;
          act('deliver', p).then(r => { if (r.ok) say(t(n === 1 ? 'eva.delivered1' : 'eva.delivered', { n }), 'ok', 4); });
        }
        if (hold) {
          if (p.moving || !focus || focus.key !== hold.f.key) hold = null;
          else if ((hold.t += dt) >= hold.dur) finish(p);
        }
        if (now - reportAt > 2) {
          reportAt = now;
          const h = env.hooks();
          // Solo saves keep the suit, the rover's distance, the round's clock and where you stand (co-op ignores them).
          if (h && h.suit) h.suit({ suit, driven: p.inRover ? driven : null, clock: clock(), at: at(p) });
        }
      }
      renderHud(p);
    }

    function finish(p) {
      const f = hold.f;
      hold = null;
      const ask = f.kind === 'find' ? act('collect', p, { find: f.id })
        : f.kind === 'drop' ? act('pickup', p, { drop: f.id })
          : f.kind === 'kestrel' ? act('interact', p, { structure: f.id })
            : act('revive', p, { target: f.id });
      ask.then(r => {
        if (!r.ok) return;
        if (f.kind === 'kestrel') return used(f.struct, r);
        if (f.kind === 'find') {
          say(r.item ? t('haul.' + r.item.res, { n: r.item.amount }) : t('eva.collected'), 'ok', 2);
          // A formation's survey: its real fact and source, once per formation (spec §3.7).
          if (f.id[0] === 'F') card({ type: 'formation', id: f.id.split(':')[0], kind: f.find.sub });
        } else if (f.kind === 'drop') say(t('eva.pickedUp'), 'ok', 2);
        else say(t('eva.revivedThem', { name: env.crewName(f.id) }), 'ok', 3);
        if (f.kind === 'find' && keyHeld && live()) hold = { f, t: 0, dur: hold0(f) }; // keep going while E is held
      });
    }

    // A Kestrel structure opened, salvaged or repaired (X.interact): its loads are in your backpack and what did not fit waits
    // at its door as a drop (C2); a weather station's fog is in the mission's (solo) or comes as any fog does (co-op), and a
    // mast's marks are read by the maps. Its story log opens: a structure is used once, so this is the first time.
    function used(s, r) {
      const said = (r.items || []).map(i => t('haul.' + i.res, { n: i.amount }));
      if (r.left) said.push(t('eva.atDoor', { n: r.left }));
      if (s.kind === 'weather') said.push(t('eva.repairedWeather', { n: D.STRUCTURES.kinds.weather.science }));
      if (s.kind === 'mast') said.push(t('eva.repairedMast'));
      say(said.join(' · '), 'ok', 5);
      card({ type: 'log', id: s.id, kind: s.kind });
    }

    // ---------- what you can work on ----------
    function hold0(f) {
      const role = crew() && crew().role;
      return X.holdSeconds(f.kind === 'find' ? f.find.kind : f.kind === 'drop' ? 'pickup' : f.kind === 'kestrel' ? f.struct.kind : 'revive', role);
    }
    const holdable = f => !!f && (f.kind === 'find' || f.kind === 'drop' || f.kind === 'revive' || f.kind === 'kestrel');

    function focusAt(lx, ly, p, world) {
      if (!live() || collapsed(me) || benched()) return null;
      const m = mission(), x = exp();
      let best = null, bestD = REACH * REACH;
      const consider = (px, py, f) => {
        const d = Math.min(near2(px, py, lx, ly), near2(px, py, p.x, p.y - 8));
        if (d < bestD) { bestD = d; best = f; }
      };
      const ccx = SW.chunkOf(Math.floor(p.x / T)), ccy = SW.chunkOf(Math.floor(p.y / T));
      for (let cy = ccy - 1; cy <= ccy + 1; cy++) for (let cx = ccx - 1; cx <= ccx + 1; cx++) {
        const c = world.peek(cx, cy);
        if (!c) continue;
        for (const [id, f] of sitesIn(c, cx, cy)) {
          if (X.loadsLeft(m, f, id) <= 0) continue;
          consider((f.x + 0.5) * T, (f.y + 0.5) * T, { kind: 'find', key: 'f:' + id, id, find: f, wx: f.x, wy: f.y, x: (f.x + 0.5) * T, y: (f.y + 0.5) * T });
        }
        // A Kestrel structure is used from its door, once (x.structures). Up to 4 chunks list one: the same door again changes nothing.
        for (const s of c.structures) {
          if (!VERB[s.kind] || x.structures[s.id]) continue;
          consider((s.x + 0.5) * T, (s.y + 0.5) * T, { kind: 'kestrel', key: 's:' + s.id, id: s.id, struct: s, x: (s.x + 0.5) * T, y: (s.y + 0.5) * T });
        }
      }
      for (const d of x.drops) consider(d.x, d.y, { kind: 'drop', key: 'd:' + d.id, id: d.id, x: d.x, y: d.y });
      if (m.coop) for (const id of Object.keys(x.collapsed)) {
        if (id === me) continue;
        const s = x.collapsed[id];
        consider(s.x, s.y, { kind: 'revive', key: 'v:' + id, id, x: s.x, y: s.y - 10 });
      }
      if (x.rover && !x.rover.driver && !p.inRover) consider(x.rover.x, x.rover.y, { kind: 'rover', key: 'rover-parked', parked: true, x: x.rover.x, y: x.rover.y });
      return best;
    }

    function label(f) {
      const role = crew() && crew().role;
      if (f.kind === 'find') {
        const what = t('find.' + f.find.kind) + (f.find.sub ? ' · ' + t('sci.' + f.find.sub) : '');
        return t(f.find.kind === 'science' ? 'eva.survey' : 'eva.collect', { what, s: secs(X.holdSeconds(f.find.kind, role)) });
      }
      if (f.kind === 'drop') return t('eva.pickup', { s: secs(X.holdSeconds('pickup', role)) });
      if (f.kind === 'kestrel') return t(VERB[f.struct.kind], { what: t('ks.' + f.struct.kind + '.name'), s: secs(X.holdSeconds(f.struct.kind, role)) });
      if (f.kind === 'revive') return t('eva.revive', { name: env.crewName(f.id), s: secs(X.holdSeconds('revive', role)) });
      if (f.kind === 'rover') return t('sf.boardRover');
      return '';
    }

    function start(f) {
      if (!holdable(f) || !live()) return false;
      keyHeld = true;
      if (!hold || hold.f.key !== f.key) hold = { f, t: 0, dur: hold0(f) };
      return true;
    }
    function stop() { keyHeld = false; hold = null; }

    // ---------- drawing ----------
    const warning = () => { const f = mission() && mission().expedition && mission().expedition.flare; return !!f && !f.over && clock() >= f.warn; };
    // The base zone: where the suit pauses and loads are delivered (5 × 5 tiles around the HQ). While a flare's warning
    // runs, it and every cover in view (Z.coversIn, from the chunks the surface holds) pulse amber.
    function drawZone(ctx, x0, y0, x1, y1, world) {
      if (!mission() || !mission().expedition) return;
      const m = mission(), r = (XD.baseZone + 0.5) * T, warn = warning(), pulse = 0.5 + 0.5 * Math.sin(now * 6);
      ctx.save();
      ctx.strokeStyle = warn ? 'rgba(242,184,79,' + (0.55 + 0.4 * pulse).toFixed(3) + ')' : 'rgba(140,188,236,0.35)';
      ctx.lineWidth = warn ? 3 : 2;
      ctx.setLineDash([10, 8]);
      roundRect(ctx, T / 2 - r, T / 2 - r, 2 * r, 2 * r, 18);
      ctx.stroke();
      ctx.setLineDash([]);
      if (warn && world) {
        ctx.strokeStyle = 'rgba(242,184,79,' + (0.5 + 0.45 * pulse).toFixed(3) + ')';
        ctx.lineWidth = 3;
        for (const k of Z.coversIn(m, x0 / T - 1, y0 / T - 1, x1 / T + 1, y1 / T + 1, world.peek)) {
          ctx.beginPath(); ctx.ellipse(k.x * T, k.y * T + 6, 26 + 5 * pulse, 12 + 2 * pulse, 0, 0, Math.PI * 2); ctx.stroke();
        }
      }
      ctx.restore();
    }

    function sprites(x0, y0, x1, y1, world, time) {
      const out = [];
      if (!mission() || !mission().expedition) return out;
      const m = mission(), x = exp();
      const tx0 = Math.floor(x0 / T) - 1, ty0 = Math.floor(y0 / T) - 1, tx1 = Math.floor(x1 / T) + 1, ty1 = Math.floor(y1 / T) + 1;
      for (let cy = SW.chunkOf(ty0); cy <= SW.chunkOf(ty1); cy++) for (let cx = SW.chunkOf(tx0); cx <= SW.chunkOf(tx1); cx++) {
        const c = world.peek(cx, cy);
        if (!c) continue;
        for (const [id, f] of sitesIn(c, cx, cy)) {
          if (f.x < tx0 || f.x > tx1 || f.y < ty0 || f.y > ty1) continue;
          if (X.loadsLeft(m, f, id) <= 0) continue;
          const fx = (f.x + 0.5) * T, fy = (f.y + 0.5) * T;
          out.push({ y: fy + 12, draw: ctx => drawFind(ctx, f, fx, fy, time) });
        }
      }
      const inView = (px, py) => px > x0 - T && px < x1 + T && py > y0 - T && py < y1 + 2 * T;
      for (const d of x.drops) if (inView(d.x, d.y)) out.push({ y: d.y + 8, draw: ctx => drawDrop(ctx, d.x, d.y) });
      if (x.rover && !x.rover.driver && inView(x.rover.x, x.rover.y)) {
        const r = x.rover;
        out.push({ y: r.y + 10, draw: ctx => env.drawRover(ctx, r.x, r.y) });
      }
      // Dust devils: every screen draws the same ones from the round's clock. Past the edge of your view they fade out, so in
      // a dust storm one can be on you before you see it.
      const pl = env.player && env.player(), view = viewOf(pl);
      for (const d of Z.devils(m, x0 - T, y0 - T, x1 + T, y1 + 2 * T, clock())) {
        const dist = pl ? Math.sqrt(near2(d.x, d.y, pl.x, pl.y)) / T : 0;
        const a = d.a * Math.max(0, Math.min(1, (view + 1 - dist) / 2));
        if (a > 0.02) out.push({ y: d.y, draw: ctx => drawDevil(ctx, d, time, a) });
      }
      return out;
    }

    // Over the fog: the hold ring.
    function drawOver(ctx) {
      if (hold) drawRing(ctx, hold.f.x, hold.f.y - 40, hold.t / hold.dur);
    }
    // The flare on the whole screen: a red edge that grows through the countdown while you are in the open, then a flash.
    function flareFx(p) {
      const m = mission(), f = m && m.expedition && m.expedition.flare;
      if (!f || !me) return { warn: 0, flash: 0 };
      const rt = clock(), counting = !f.over && rt >= f.warn && rt < f.end;
      const warn = counting && !covered(p) ? Math.max(0, Math.min(1, (rt - f.warn) / ZD.flare.countdown)) : 0;
      const flash = rt >= f.end && rt < f.end + 1.5 ? 1 - (rt - f.end) / 1.5 : 0;
      return { warn, flash };
    }
    // A teammate's suit level (co-op positions carry it), 0–1, for the bar on their name tag; none at the base or when full.
    const suitBar = r => (r.suit == null || r.suit >= XD.suit || X.inBaseZone(r) ? null : r.suit / XD.suit);

    // Minimap and map markers: finds you have seen (the biologist senses ice and methane vents further), cave mouths you
    // have seen, dropped loads, the parked rover. Rebuilt at most every 150 ms.
    function marks(world, px, py) {
      if (!mission() || !mission().expedition || !world) return [];
      if (now - marksAt < 0.15) return marksCache;
      marksAt = now;
      const m = mission(), x = exp(), out = [];
      const sniff = ((D.SKILLS[crew() && crew().role] || {}).sight) || 0;
      const tx = Math.floor(px / T), ty = Math.floor(py / T);
      for (let cy = SW.chunkOf(ty - 80); cy <= SW.chunkOf(ty + 79); cy++) for (let cx = SW.chunkOf(tx - 80); cx <= SW.chunkOf(tx + 79); cx++) {
        const c = world.peek(cx, cy);
        if (!c) continue;
        for (const [id, f] of sitesIn(c, cx, cy)) {
          if (X.loadsLeft(m, f, id) <= 0) continue;
          const smelt = sniff && (f.kind === 'ice' || f.sub === 'vent') && near2(f.x, f.y, tx, ty) <= sniff * sniff;
          if (smelt || world.seen(f.x, f.y)) out.push({ x: (f.x + 0.5) * T, y: (f.y + 0.5) * T, color: COLORS[f.kind] });
        }
        for (const k of visible(c, 'caves')) if (world.seen(k.x, k.y)) out.push({ x: (k.x + 0.5) * T, y: (k.y + 0.5) * T, color: '#1a0d0a', ring: '#e8c9a8' });
      }
      for (const d of x.drops) out.push({ x: d.x, y: d.y, color: '#f46e5f' });
      if (x.rover && !x.rover.driver) out.push({ x: x.rover.x, y: x.rover.y, color: '#e9e2d8', square: true });
      marksCache = out;
      return out;
    }

    return {
      el, alert, sync, reset, canMove, step, focusAt, holdable, hasRoom, label, start, stop, act, canister, drawZone, sprites, drawOver,
      flareFx, suitBar, marks, clock,
      view: viewOf,
      alerting: () => !alert.hidden,
      // While you are down your suit is not sent: a position in flight could undo a revive the server has just made.
      report: () => ({ suit: collapsed(me) ? null : Math.round(suit * 10) / 10, driven: Math.round(driven * 10) / 10 }),
      roverAtBay: p => !!mission() && !!mission().expedition && !exp().rover && !(p && p.inRover),
      driving: () => !!(me && mission() && mission().expedition && exp().rover && exp().rover.driver === me),
      collapsed,
      state: () => ({ suit, driven, hold: hold && hold.f.key, collapsed: collapsed(me), benched: !!me && !!mission() && benched(), pack: me && mission() ? pack().length : 0, clock: clock() }),
      qaSuit: s => { suit = Math.max(0, Math.min(XD.suit, Number(s) || 0)); }, // play-testing: jump the suit level
      qaClock: s => { soloClock = Math.max(0, Number(s) || 0); },              // play-testing: jump the solo round clock
    };
  }

  root.SolEva = { create };
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
/*
 * SOL 500 — the walkable surface: your astronaut walks around the outpost and out into the endless world, builds on
 * tiles, inspects and switches machines, drives the rover, and meets the rest of the crew, who walk to their jobs.
 * Canvas 2D + a small DOM overlay. It never changes the mission itself: every action goes through ui.js hooks,
 * so the surface and the mission console always show the same plan.
 * The world model is src/surface-world.js, the painting src/surface-paint.js, the minimap and map src/surface-map.js.
 *
 * API: SolSurface.mount(hooks) → element (persistent; re-attach it on every render)
 *      SolSurface.update({ mission, plan, forecast, controlId, canControl(id), crewName(id), t, lang, fog, clock, lastPos, gfx })
 *        clock: co-op only, the server's round clock { t: seconds, at: performance.now() / 1000 when it arrived }
 *        lastPos: { x, y } where your astronaut last stood this round (the solo save, or the co-op server), for a reload
 *        gfx: the Display settings { quality: 'best' | 'fast', fpsCap: 0 (Max) | 30 | 60, showFps }; a missing or unknown value is
 *          the default (Best, Max, no readout), and a new quality takes effect at once
 *      SolSurface.setRemote([{ crewId, x, y, dir, moving, rover }])
 *      SolSurface.mergeFog({ "<cx>,<cy>": base64 }) · SolSurface.reset() (call when a new mission starts)
 * Hooks: queueBuild, cancelBuild, toggleModule, toggleScrap, setJob, openConsole, canAdvance, advance,
 *        sendPos(pos), reveal({ key: base64 }), enterRegion(regionId), reopenRegion(regionId),
 *        exp(type, payload, pos) → Promise of { ok } or { error } (exploring, see src/surface-eva.js),
 *        suit({ suit, driven, clock, at }) (every 2 s: what a solo save keeps)
 * Exploring on the map (finds, the suit, the backpack, the rover's battery, the dangers) is src/surface-eva.js.
 */
(function (root) {
  'use strict';
  const D = root.SolData, E = root.SolEngine, A = root.SolArt, W = root.SolWorldgen, SW = root.SolWorld, P = root.SolPaint, SM = root.SolMap, EV = root.SolEva;
  const { drawAvatar, drawTags, roundRect, badge, drawRock, drawLander, drawIceCracks } = P.sprites;
  const T = 64;
  const BASE = W.BASE_RECT;
  const LANDER = [-6, -4];
  const SPEED = 150, SPRINT_X = 1.75, ROVER_X = 2.6, NPC_SPEED = 115;
  const PUSH_TIME = 0.25; // seconds a dust devil's throw takes (a slide that stops at walls)
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const DEBUG = /[?&]debug=chunks\b/.test((root.location && root.location.search) || '');
  const tkey = (x, y) => x + ',' + y;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  let S = null;

  // ---------- helpers ----------
  function seeded(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
    return function () {
      h = (h + 0x6D2B79F5) | 0;
      let t = Math.imul(h ^ (h >>> 15), 1 | h);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
    // The 9×5 build grid sits with its top-left at world tile (−4, −2), so the HQ is at (0, 0).
  const gridToWorld = (gx, gy) => [gx + BASE.x, gy + BASE.y];
  const worldToGrid = (wx, wy) => [wx - BASE.x, wy - BASE.y];
  const inGrid = (gx, gy) => gx >= 0 && gy >= 0 && gx < D.GRID.w && gy < D.GRID.h;
  const center = (wx, wy) => [wx * T + T / 2, wy * T + T / 2];

  function image(svg) {
    const img = new Image();
    const xml = svg.includes('xmlns=') ? svg : svg.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
    return img;
  }
  function moduleImage(type, clean) {
    const b = type === 'solar' ? Math.round((clean == null ? 1 : clean) * 10) / 10 : 1;
    const k = type + '|' + b;
    if (!S.images[k]) S.images[k] = image(A.module(type, 128, { clean: b }));
    return S.images[k];
  }
  function ready(img) { return img && img.complete && img.naturalWidth > 0; }

  // The points of interest in the live data chunks under the view, grown by 4 tiles for the sprites that stand up into it
  // (src/surface-paint.js scenery). A structure is done once the rules mark it used or repaired (m.expedition.structures).
  // S.tube is the lava tube you are inside, whose roof hides while the dark closes in round your headlamp.
  function pointsOfInterest(x0, y0, x1, y1, m) {
    const C = W.CHUNK * T, chunks = [], marked = (m.expedition && m.expedition.structures) || {};
    for (let cy = Math.floor((y0 - 4 * T) / C); cy <= Math.floor((y1 + 4 * T) / C); cy++) {
      for (let cx = Math.floor((x0 - 4 * T) / C); cx <= Math.floor((x1 + 4 * T) / C); cx++) { const c = S.world.peek(cx, cy); if (c) chunks.push(c); }
    }
    const at = [Math.floor(S.player.x / T), Math.floor(S.player.y / T)];
    S.tube = P.tubeAt(chunks, at, S.world.tile(at[0], at[1]));
    S.pois = P.scenery(chunks, { at, done: id => !!marked[id], tube: S.tube });
    return S.pois;
  }
  // One point of interest's SolArt drawing, made into an image once per look and size (the vent's puff: a 3 s loop in 24
  // steps); a lava tube's roof is drawn on the canvas.
  function drawArt(ctx, it) {
    if (it.art === 'roof') return P.sprites.drawRoof(ctx, it);
    const o = it.opts || {}, step = it.art === 'puff' ? Math.floor(S.time / 3 * 24) % 24 : 0;
    const k = it.art + '|' + it.id + '|' + (o.done ? 1 : 0) + (o.inside ? 1 : 0) + '|' + step + '|' + it.w;
    if (!S.images[k]) S.images[k] = image(it.art === 'puff' ? A.ventPuff(step / 24, it.w * 128) : A[it.art](it.id, it.w * 128, it.opts));
    if (ready(S.images[k])) ctx.drawImage(S.images[k], it.x * T, it.y * T, it.w * T, it.h * T);
  }

  // ---------- world model ----------
  // A mission (by its code) gets its own world, painter and fog; reset() forces a fresh one for a new mission.
  function world() {
    const m = S.data && S.data.mission;
    if (!m) return null;
    if (S.world && S.worldSeed === m.seed) return S.world;
    S.world = SW.create(m.seed);
    S.painter = P.createPainter(S.world, { scale: groundScale() });
    S.map.attach(S.world, S.painter);
    S.worldSeed = m.seed;
    S.world.reveal(0, 0, W.FLAT_RADIUS); // the crew knows their own base
    S.player = null;
    S.npcs = {};
    S.region = null;
    S.seenAt = [NaN, NaN, 0];
    S.camSnap = true;
    refreshWorld(m);
    return S.world;
  }

  function reset() {
    if (!S) return;
    S.world = null;
    S.worldSeed = null;
    S.remote = {}; // the last room's players: this room's (if any) come with its next positions
    S.eva.reset(); // and the exploring layer: the old mission's suit, battery and collapse stay with it
  }

  // The base's own blockers (the HQ, the reactor, the lander, rocks on the build grid) and the grid lookups.
  function refreshWorld(m) {
    const blocked = [LANDER];
    for (const [gx, gy] of m.terrain.rock) blocked.push(gridToWorld(gx, gy));
    // Crews walk between the machines; only the HQ and the reactor (radiation) are solid.
    for (const tile of m.layout) if (tile.type === 'hab' || tile.type === 'reactor') blocked.push(gridToWorld(tile.x, tile.y));
    S.world.setOverlay(blocked);
    S.base = {
      ice: new Set(m.terrain.ice.map(([x, y]) => tkey(x, y))),
      gridRock: new Set(m.terrain.rock.map(([x, y]) => tkey(x, y))),
    };
  }

  const isBlocked = (wx, wy) => S.world.isBlocked(wx, wy);

  function hitsWall(x, y) {
    const pts = [[x - 10, y - 6], [x + 10, y - 6], [x - 10, y + 4], [x + 10, y + 4]];
    return pts.some(([px, py]) => isBlocked(Math.floor(px / T), Math.floor(py / T)));
  }

  // Breadth-first search over world tiles inside a 64×64-tile box around the walker; returns tile-centre waypoints.
  function findPath(fromX, fromY, goalWx, goalWy, allowGoalBlocked) {
    const steps = S.world.findPath(Math.floor(fromX / T), Math.floor(fromY / T), goalWx, goalWy, allowGoalBlocked);
    return steps && steps.map(([x, y]) => center(x, y));
  }

  function spotNear(gx, gy, rnd) {
    const [wx, wy] = gx == null ? [0, 0] : gridToWorld(gx, gy);
    const options = [[0, 1], [1, 0], [-1, 0], [0, -1], [1, 1], [-1, 1]].map(([dx, dy]) => [wx + dx, wy + dy]).filter(([x, y]) => !isBlocked(x, y));
    if (!options.length) return null;
    const [x, y] = options[Math.floor(rnd() * options.length)];
    const [cx, cy] = center(x, y);
    return [cx + (rnd() - 0.5) * 20, cy + (rnd() - 0.5) * 14];
  }

  function spawnPoint() {
    const [hx, hy] = gridToWorld(D.GRID.hq[0], D.GRID.hq[1]);
    for (const [dx, dy] of [[0, 1], [1, 1], [-1, 1], [0, 2], [1, 0], [-1, 0], [2, 1], [-2, 1], [0, -1]]) {
      if (!isBlocked(hx + dx, hy + dy)) return center(hx + dx, hy + dy);
    }
    return center(hx, hy + 2);
  }

  // Your astronaut appears beside the HQ when a mission (or a fresh world) starts.
  function ensurePlayer() {
    if (S.player) return;
    const [x, y] = spawnPoint();
    S.player = { x, y, dir: 'down', phase: 0, moving: false, stamina: 100, path: null, inRover: false, crewId: S.data.controlId };
  }

  // ---------- setup ----------
  function mount(hooks) {
    if (S) { S.hooks = hooks; return S.el; }
    const el = document.createElement('div');
    el.className = 'sf-root';
    const canvas = document.createElement('canvas');
    canvas.className = 'sf-canvas';
    canvas.tabIndex = 0;
    canvas.setAttribute('role', 'application');
    const overlay = document.createElement('div');
    overlay.className = 'sf-overlay';
    el.append(canvas, overlay);
    S = {
      el, canvas, ctx: canvas.getContext('2d'), overlay, hooks,
      keys: new Set(), joy: { x: 0, y: 0, id: null }, sprintHeld: false,
      player: null, npcs: {}, remote: {}, images: {}, particles: [], tags: [],
      world: null, painter: null, map: null, base: null, worldSeed: null, data: null, focus: null, menuOpen: null,
      view: { w: 0, h: 0, zoom: 1, dpr: 1, camX: 0, camY: 0 }, time: 0, last: 0, fps: 60, camSnap: true,
      gfx: { quality: 'best', fpsCap: 0, showFps: false }, nextDraw: 0, fpsAt: -Infinity,
      lastSent: 0, lastSentKey: '', hintUntil: 14, touch: false,
      region: null, seenAt: [NaN, NaN, 0], fogSent: 0, debug: DEBUG, debugAt: 0, lang: null, qa: { ghost: false, speed: 1 },
    };
    S.touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    S.map = SM.create({ t: (k, p) => t(k, p), onOpen: () => S.keys.clear(), onClose: () => S.canvas.focus({ preventScroll: true }) });
    S.eva = EV.create({
      t: (k, p) => t(k, p), hooks: () => S.hooks, crewName: id => S.data.crewName(id), player: () => S.player, home: goHome,
      drawRover: (ctx, x, y) => { const img = moduleImage('rover', 1); if (ready(img)) ctx.drawImage(img, x - 34, y - 52, 68, 68); },
      now: () => performance.now() / 1000,
      push: (dx, dy) => { if (S.player) S.player.push = { x: dx, y: dy, left: PUSH_TIME }; },
    });
    buildOverlay();
    bindInput();
    if (window.ResizeObserver) new ResizeObserver(resize).observe(el);
    requestAnimationFrame(loop);
    // When the browser is idle, paint more of the ground than the frame budget allows.
    if (window.requestIdleCallback) {
      const idle = d => {
        if (S.painter && S.el.isConnected && !document.hidden) S.painter.work(performance.now() + Math.max(0, d.timeRemaining() - 1), 0);
        window.requestIdleCallback(idle, { timeout: 500 });
      };
      window.requestIdleCallback(idle, { timeout: 500 });
    }
    return el;
  }

  // The Display settings' graphics level: Best draws at the screen's own pixel ratio (up to 4) and paints the ground chunks at 2×
  // (and has more dust, see draw); Fast draws one canvas pixel to a CSS pixel and paints the ground at 1×.
  const groundScale = () => (S.gfx.quality === 'best' ? 2 : 1);
  function resize() {
    const r = S.el.getBoundingClientRect();
    const dpr = S.gfx.quality === 'fast' ? 1 : Math.min(4, window.devicePixelRatio || 1);
    S.view.w = r.width;
    S.view.h = r.height;
    S.view.dpr = dpr;
    S.view.zoom = clamp(r.width / (T * 10.5), 0.62, 1.55);
    S.canvas.width = Math.max(1, Math.round(r.width * dpr));
    S.canvas.height = Math.max(1, Math.round(r.height * dpr));
  }

  function t(k, p) { return S.data ? S.data.t(k, p) : k; }

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function buildOverlay() {
    const o = S.overlay;
    S.hint = el('div', 'sf-hint');
    S.prompt = el('div', 'sf-prompt');
    S.prompt.hidden = true;
    S.menu = el('div', 'sf-menu');
    S.menu.hidden = true;
    S.menu.setAttribute('role', 'dialog');
    S.stamina = el('div', 'sf-stamina');
    S.staminaFill = el('span');
    S.stamina.appendChild(S.staminaFill);
    // touch controls
    S.pad = el('div', 'sf-joy');
    S.knob = el('span', 'sf-knob');
    S.pad.appendChild(S.knob);
    S.btnAct = el('button', 'sf-btn sf-act', 'E');
    S.btnAct.type = 'button';
    S.btnRun = el('button', 'sf-btn sf-run', '»');
    S.btnRun.type = 'button';
    // The name of the region you are in; selecting it shows that region's card (and its real NASA fact) again.
    S.regionChip = el('button', 'sf-region');
    S.regionChip.type = 'button';
    S.regionChip.setAttribute('data-k', 'region-chip'); // a re-render restores the focus by data-k
    S.regionChip.hidden = true;
    S.regionChip.addEventListener('click', () => { if (S.region != null && S.hooks.reopenRegion) S.hooks.reopenRegion(W.REGIONS[S.region]); });
    S.debugBox = el('pre', 'sf-debug');
    S.debugBox.hidden = !S.debug;
    // The Display settings' FPS readout, under the minimap: a visual extra, so it is hidden from assistive technology.
    S.fpsEl = el('div', 'sf-fps');
    S.fpsEl.hidden = true;
    S.fpsEl.setAttribute('aria-hidden', 'true');
    o.append(S.hint, S.stamina, S.regionChip, S.eva.el, S.eva.alert, S.map.minimap, S.fpsEl, S.prompt, S.menu, S.pad, S.btnAct, S.btnRun, S.debugBox, S.map.el);
    // The action button is held for finds, like E: it acts when pressed and lets go of a hold when released.
    S.btnAct.addEventListener('pointerdown', e => { e.preventDefault(); S.actId = e.pointerId; interact(); });
    S.btnAct.addEventListener('click', e => { if (e.detail === 0) interact(); }); // Enter or Space on the focused button
    const actOff = e => { if (e.pointerId !== S.actId) return; S.actId = null; S.eva.stop(); };
    // The stick and the sprint button follow their finger on the window, filtered by its pointer id: a re-render moves this
    // node into a new stage, which releases the pad's pointer capture, and the finger can then slide off or lift anywhere.
    // The pad has no move/up/cancel handlers of its own, so nothing is handled twice.
    const runOn = e => { e.preventDefault(); S.runId = e.pointerId; S.sprintHeld = true; S.btnRun.classList.add('on'); };
    const runOff = e => { if (e.pointerId !== S.runId) return; S.runId = null; S.sprintHeld = false; S.btnRun.classList.remove('on'); };
    S.btnRun.addEventListener('pointerdown', runOn);
    S.btnRun.addEventListener('pointerleave', runOff);
    S.pad.addEventListener('pointerdown', e => {
      S.joy.id = e.pointerId;
      S.pad.setPointerCapture(e.pointerId);
      joyMove(e);
    });
    const joyEnd = e => { if (S.joy.id !== e.pointerId) return; S.joy = { x: 0, y: 0, id: null }; S.knob.style.transform = ''; };
    window.addEventListener('pointermove', e => { if (S.joy.id === e.pointerId) joyMove(e); });
    window.addEventListener('pointerup', e => { joyEnd(e); runOff(e); actOff(e); });
    window.addEventListener('pointercancel', e => { joyEnd(e); runOff(e); actOff(e); });
  }

  function joyMove(e) {
    const r = S.pad.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const max = r.width / 2 - 14;
    const len = Math.hypot(dx, dy);
    if (len > max) { dx = dx / len * max; dy = dy / len * max; }
    S.joy.x = dx / max;
    S.joy.y = dy / max;
    S.knob.style.transform = `translate(${dx}px, ${dy}px)`;
    if (S.player) S.player.path = null;
  }

  function typing(e) {
    const tg = e.target;
    return tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT' || tg.isContentEditable);
  }

  function bindInput() {
    const MOVE = { KeyW: 1, KeyA: 1, KeyS: 1, KeyD: 1, ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1 };
    window.addEventListener('keydown', e => {
      if (!S.el.isConnected || typing(e) || document.querySelector('.modal-back')) return;
      // F3 first, even with the map open: the debug overlay toggles (once, however long it is held) and the browser's find bar never opens.
      if (e.code === 'F3') { if (!e.repeat) { S.debug = !S.debug; S.debugBox.hidden = !S.debug; } e.preventDefault(); return; }
      if (S.map.isOpen()) { if (S.map.key(e)) e.preventDefault(); return; }
      if (e.code === 'KeyM' && !e.repeat) { openMap(); e.preventDefault(); return; }
      if (MOVE[e.code]) { S.keys.add(e.code); if (S.player) S.player.path = null; e.preventDefault(); }
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') S.keys.add('Shift');
      if (e.code === 'KeyE' && !e.repeat) { interact(); e.preventDefault(); }
      if (e.code === 'KeyQ' && !e.repeat) { S.eva.canister(S.player); e.preventDefault(); }
      if (e.code === 'Escape' && S.menuOpen) { closeMenu(); e.preventDefault(); }
      if (e.code === 'KeyC' && !e.repeat && S.hooks.openConsole) S.hooks.openConsole();
      if (S.menuOpen && /^Digit[1-9]$/.test(e.code)) {
        const btns = [...S.menu.querySelectorAll('button[data-n]:not(:disabled)')];
        const b = btns[Number(e.code.slice(5)) - 1];
        if (b) { b.click(); e.preventDefault(); }
      }
    });
    window.addEventListener('keyup', e => {
      S.keys.delete(e.code);
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') S.keys.delete('Shift');
      if (e.code === 'KeyE') S.eva.stop();
    });
    window.addEventListener('blur', () => { S.keys.clear(); S.eva.stop(); });
    S.canvas.addEventListener('pointerdown', e => {
      if (!S.player || !S.world || S.map.isOpen()) return;
      S.canvas.focus({ preventScroll: true });
      const r = S.canvas.getBoundingClientRect();
      const wx = (e.clientX - r.left) / S.view.zoom + S.view.camX;
      const wy = (e.clientY - r.top) / S.view.zoom + S.view.camY;
      const tx = Math.floor(wx / T), ty = Math.floor(wy / T);
      // Tap a crew member to talk to them
      const crewHit = avatars().find(a => !a.you && Math.hypot(a.x - wx, a.y - 18 - wy) < 26);
      const goalBlocked = isBlocked(tx, ty);
      const path = findPath(S.player.x, S.player.y, tx, ty, goalBlocked);
      S.lastTap = { tx, ty, goalBlocked, found: !!path };
      if (path) {
        if (goalBlocked) path.pop();
        else if (path.length) path[path.length - 1] = [wx, wy];
        else path.push([wx, wy]);
        const auto = crewHit ? { kind: 'crew', id: crewHit.id } : { tile: [tx, ty] };
        if (path.length) { S.player.path = path; S.player.autoFocus = auto; }
        else { S.player.path = null; S.pendingAuto = auto; }
        // Face the thing we are walking to, so the focus lands on it when we arrive.
        const last = path.length ? path[path.length - 1] : [S.player.x, S.player.y];
        S.player.faceTo = [tx * T + T / 2, ty * T + T / 2, last];
      }
      S.hintUntil = 0;
    });
  }

  function openMap() {
    if (!S.world || !S.player) return;
    S.map.open(mapState());
  }

  // A takeover (your astronaut died) or a claim (co-op): you are now this crewmate, standing where they stood (their walk at the
  // base, or where their player had them), not where the astronaut before you was. Their NPC goes with them.
  function moveToCrewmate(id) {
    const p = S.player, from = S.npcs[id] || S.remote[id];
    const [x, y] = from ? [from.x, from.y] : spawnPoint();
    Object.assign(p, { x, y, dir: (from && from.dir) || 'down', path: null, push: null, inRover: false, autoFocus: null, faceTo: null });
    delete S.npcs[id];
    S.pendingAuto = null;
    S.camSnap = true;
  }

  // A new round, or a solo collapse: your astronaut is back by the HQ, out of the rover (whoever drove it brought it home).
  function goHome() {
    const p = S.player;
    if (!p) return;
    const [x, y] = spawnPoint();
    Object.assign(p, { x, y, dir: 'down', path: null, push: null, inRover: false, autoFocus: null, faceTo: null });
    S.pendingAuto = null;
    S.camSnap = true;
    if (S.menuOpen) closeMenu();
  }

  // ---------- data from ui.js ----------
  // The Display settings. A missing or unknown value is the default (Best, Max, no readout). A new quality is applied at once: the
  // canvas is resized and the ground is painted again at the new scale, with no reload.
  function applyGfx(g) {
    const gfx = g || {}, quality = gfx.quality === 'fast' ? 'fast' : 'best', changed = quality !== S.gfx.quality;
    S.gfx = { quality, fpsCap: gfx.fpsCap === 30 || gfx.fpsCap === 60 ? gfx.fpsCap : 0, showFps: !!gfx.showFps };
    S.fpsEl.hidden = !S.gfx.showFps;
    if (!changed) return;
    resize();
    if (S.painter) S.painter.setScale(groundScale());
    S.nextDraw = 0; // the next callback draws, even under a limit: the resize cleared the canvas
  }

  function update(data) {
    S.data = data;
    applyGfx(data.gfx);
    if (!data.mission) return;
    world();
    refreshWorld(data.mission);
    if (data.fog) S.world.mergeFog(data.fog);
    ensurePlayer();
    if (data.controlId && S.player.crewId !== data.controlId) moveToCrewmate(data.controlId);
    S.player.crewId = data.controlId;
    const look = S.eva.sync(data);
    const down = S.eva.collapsed(data.controlId) ? data.mission.expedition.collapsed[data.controlId] : null; // co-op: waiting for a revive
    const back = data.lastPos && Number.isFinite(data.lastPos.x) && Number.isFinite(data.lastPos.y) ? data.lastPos : null;
    const place = spot => {
      Object.assign(S.player, { x: spot.x, y: spot.y, path: null, push: null, autoFocus: null, faceTo: null });
      S.pendingAuto = null;
      S.camSnap = true;
    };
    if (look.round) goHome();
    else if (look.fresh && down) place(down); // a reload (or a new seat) while down: you lie where you fell, where teammates can revive you
    else if (look.fresh) {
      // A reload (or a new seat) mid-round: back where you stood (the solo save, or where the server last saw you), not a free
      // walk home. After a solo collapse you are already home, where you sit out the round.
      if (back && !S.eva.state().benched) place(back);
      if (S.eva.driving()) S.player.inRover = true; // back in the seat you left (a reload while driving)
    }
    if (down) S.player.inRover = false; // a collapse parks the rover where you fell (X.collapse): you are never left in it
    S.canvas.setAttribute('aria-label', t('sf.aria'));
    S.hint.textContent = t(S.touch ? 'sf.hintTouch' : 'sf.hintKeys');
    S.btnAct.setAttribute('aria-label', t('sf.interact'));
    S.btnRun.setAttribute('aria-label', t('sf.sprint'));
    if (data.lang !== S.lang) {
      S.lang = data.lang;
      S.map.relabel();
      if (S.region != null) showRegionName();
    }
    if (S.menuOpen) renderMenu();
  }

  function setRemote(list) {
    const now = performance.now();
    const next = {};
    for (const p of list || []) {
      if (!p.crewId || (S.data && p.crewId === S.data.controlId)) continue;
      const prev = S.remote[p.crewId];
      next[p.crewId] = {
        x: prev ? prev.x : p.x, y: prev ? prev.y : p.y, tx: p.x, ty: p.y, dir: p.dir || 'down', moving: !!p.moving, rover: !!p.rover,
        phase: prev ? prev.phase : 0, at: now, suit: Number.isFinite(p.suit) ? p.suit : null, load: p.load || 0,
      };
    }
    S.remote = next;
  }

  // Fog a teammate revealed (co-op). ui.js keeps it too, so a rebuilt world gets it back through update().
  function mergeFog(map) { if (S && S.world) S.world.mergeFog(map); }

  // ---------- simulation ----------
  function loop(ts) {
    requestAnimationFrame(loop);
    if (!S.el.isConnected || document.hidden || !S.data || !S.data.mission) { S.last = ts; return; }
    // The FPS limit (Display settings): at most that many frames a second on average. The callbacks in between are skipped and leave
    // S.last alone, so the next frame's dt covers their time. A frame is due when the one before it was due plus one period, not when
    // that one was drawn (60 on a 144 Hz screen would average 48), and it may come 1 ms early (a 60 on a 60 Hz screen draws every
    // frame although the timestamps jitter).
    if (S.gfx.fpsCap) {
      if (ts + 1 < S.nextDraw) return;
      S.nextDraw = Math.max(S.nextDraw + 1000 / S.gfx.fpsCap, ts);
    }
    const t0 = performance.now();
    const raw = ts - (S.last || ts);
    if (raw > 0) S.fps += (1000 / raw - S.fps) * 0.05;
    const dt = Math.min(0.05, raw / 1000);
    S.last = ts;
    S.time += dt;
    world();
    ensurePlayer();
    const moved = stepPlayer(dt);
    stepNpcs(dt);
    stepRemote(dt);
    stepFocus();
    S.eva.step(dt, S.player, S.world, moved, S.focus);
    stream(t0);
    explore(ts);
    draw(dt);
    const st = mapState();
    S.map.drawMini(st, ts);
    S.map.frame(st, performance.now() + 6);
    if (S.debug && ts - S.debugAt > 250) { S.debugAt = ts; drawDebugText(); }
    if (S.gfx.showFps && ts - S.fpsAt >= 250) { S.fpsAt = ts; S.fpsEl.textContent = t('display.fps', { n: Math.round(S.fps) }); } // four times a second at most
    maybeSend(ts);
  }

  // Chunk streaming: keep the data near you (at most one new chunk a frame, the ones ahead of you first)
  // and paint ground until about 4 ms of this frame are used (always at least one chunk, so nothing stalls).
  function stream(t0) {
    const p = S.player;
    const tx = Math.floor(p.x / T), ty = Math.floor(p.y / T);
    const [dx, dy] = p.moving ? DIRS[p.dir] : [0, 0];
    S.world.retain(tx, ty, tx + dx * 2 * W.CHUNK, ty + dy * 2 * W.CHUNK);
    S.world.work();
    const v = S.view, viewW = v.w / v.zoom, viewH = v.h / v.zoom;
    S.painter.retainView(v.camX, v.camY, v.camX + viewW, v.camY + viewH);
    S.painter.work(t0 + 4, 1);
  }

  function showRegionName() {
    const name = t('region.' + W.REGIONS[S.region]);
    S.regionChip.hidden = false;
    S.regionChip.textContent = name;
    S.regionChip.setAttribute('aria-label', t('region.reread', { name }));
  }

  // What you can see becomes explored, and a new region shows its name. New fog goes out once a second. How far you see
  // depends on the round's weather: dust storms shrink it (spec §3.4).
  function explore(ts) {
    const p = S.player, me = controlledCrew();
    if (!me || me.status === 'dead') return;
    const tx = Math.floor(p.x / T), ty = Math.floor(p.y / T), r = S.eva.view(p);
    if (tx !== S.seenAt[0] || ty !== S.seenAt[1] || r !== S.seenAt[2]) {
      S.seenAt = [tx, ty, r];
      S.world.reveal(tx, ty, r);
      const reg = S.world.region(tx, ty);
      if (reg !== S.region) {
        S.region = reg;
        showRegionName();
        if (S.hooks.enterRegion) S.hooks.enterRegion(W.REGIONS[reg]);
      }
    }
    if (ts - S.fogSent > 1000) {
      S.fogSent = ts;
      const diff = S.world.takeFog();
      if (S.hooks.reveal && Object.keys(diff).length) S.hooks.reveal(diff);
    }
  }

  function mapState() {
    if (!S.player) return { px: 0, py: 0, crew: [], marks: [] };
    return {
      px: S.player.x, py: S.player.y, crew: avatars().map(a => ({ x: a.x, y: a.y, color: a.color, you: !!a.you })),
      marks: S.eva.marks(S.world, S.player.x, S.player.y).concat(poiMarks()),
    };
  }
  // The maps' marks for the points of interest (src/surface-map.js poiMarks), made again only when what they show changes:
  // the landmarks discovered, the structures used or repaired (a repaired mast adds "?" marks: X.mastMarks, when the rules have it).
  function poiMarks() {
    const m = S.data.mission, x = m.expedition || {}, X = root.SolExpedition;
    const key = m.seed + '|' + Object.keys(x.landmarks || {}).join() + '|' + JSON.stringify(x.structures || {});
    if (S.poiKey !== key) { S.poiKey = key; S.poiMarks = SM.poiMarks(S.world.seed, x, X && X.mastMarks ? X.mastMarks(m) : []); }
    return S.poiMarks;
  }

  function drawDebugText() {
    const tx = Math.floor(S.player.x / T), ty = Math.floor(S.player.y / T);
    S.debugBox.textContent = SM.debugText({
      fps: Math.round(S.fps), world: S.world.stats(), paint: S.painter.stats(),
      tile: [tx, ty], chunk: [SW.chunkOf(tx), SW.chunkOf(ty)], region: S.region == null ? '-' : W.REGIONS[S.region],
    });
  }

  function controlledCrew() {
    const m = S.data.mission;
    return m.crew.find(c => c.id === S.data.controlId) || null;
  }

  // Moves your astronaut; returns how far (world px) they moved this frame (the rover's battery counts it).
  function stepPlayer(dt) {
    const p = S.player, ox = p.x, oy = p.y;
    const me = controlledCrew();
    const canMove = me && me.status === 'active';
    let vx = 0, vy = 0;
    if (canMove) {
      if (S.keys.has('KeyW') || S.keys.has('ArrowUp')) vy -= 1;
      if (S.keys.has('KeyS') || S.keys.has('ArrowDown')) vy += 1;
      if (S.keys.has('KeyA') || S.keys.has('ArrowLeft')) vx -= 1;
      if (S.keys.has('KeyD') || S.keys.has('ArrowRight')) vx += 1;
      if (!vx && !vy && (S.joy.x || S.joy.y)) { vx = S.joy.x; vy = S.joy.y; }
      if (!vx && !vy && p.path && p.path.length) {
        const [tx, ty] = p.path[0];
        const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
        if (d < 6) {
          p.path.shift();
          if (!p.path.length) {
            p.path = null;
            if (p.faceTo) {
              const fx = p.faceTo[0] - p.x, fy = p.faceTo[1] - (p.y - 8);
              if (Math.abs(fx) > 4 || Math.abs(fy) > 4) p.dir = Math.abs(fx) > Math.abs(fy) ? (fx > 0 ? 'right' : 'left') : (fy > 0 ? 'down' : 'up');
              p.faceTo = null;
            }
            if (p.autoFocus) { S.pendingAuto = p.autoFocus; p.autoFocus = null; }
          }
        } else { vx = dx / d; vy = dy / d; }
      }
    } else {
      p.path = null;
    }
    const len = Math.hypot(vx, vy);
    let moving = len > 0.05;
    const sprinting = moving && (S.keys.has('Shift') || S.sprintHeld) && p.stamina > 4 && !p.inRover;
    p.stamina = clamp(p.stamina + (sprinting ? -32 : 18) * dt, 0, 100);
    if (moving) {
      const nx = vx / Math.max(1, len), ny = vy / Math.max(1, len);
      const ground = p.inRover ? 1 : S.world.speed(Math.floor(p.x / T), Math.floor(p.y / T)); // dunes slow walking
      const sp = SPEED * (sprinting ? SPRINT_X : 1) * (p.inRover ? ROVER_X : 1) * ground * S.qa.speed * Math.min(1, len);
      const stuck = hitsWall(p.x, p.y);
      const mx = p.x + nx * sp * dt, my = p.y + ny * sp * dt;
      // A step is allowed if nothing blocks it and the exploring rules agree (an empty suit, a flat rover battery).
      const ok = (x, y) => S.qa.ghost || ((stuck || !hitsWall(x, y)) && S.eva.canMove(p, x, y));
      const okX = ok(mx, p.y);
      if (okX) p.x = mx;
      const okY = ok(p.x, my);
      if (okY) p.y = my;
      // Both refused (you are down, out of suit or battery, or in a corner): you stand still, and a click-to-walk ends here.
      if (!okX && !okY) { moving = false; p.path = null; }
      if (Math.abs(nx) > Math.abs(ny)) p.dir = nx > 0 ? 'right' : 'left'; else p.dir = ny > 0 ? 'down' : 'up';
      p.phase += dt * sp / 26;
      S.hintUntil = Math.min(S.hintUntil, S.time + 3);
    }
    // A throw obeys the exploring rules like a step: once the suit is out it ends where the collapse was asked for, not 2 tiles on.
    if (p.push && !S.eva.canMove(p, p.x + p.push.x, p.y + p.push.y)) p.push = null;
    if (p.push) { // a dust devil throws you aside (spec §3.4): a short slide that stops at walls and ends a click-to-walk
      const k = Math.min(1, dt / p.push.left), sx = p.push.x * k, sy = p.push.y * k;
      if (S.qa.ghost || !hitsWall(p.x + sx, p.y)) p.x += sx;
      if (S.qa.ghost || !hitsWall(p.x, p.y + sy)) p.y += sy;
      p.push.x -= sx;
      p.push.y -= sy;
      p.push.left -= dt;
      p.path = null;
      if (p.push.left <= 0) p.push = null;
    }
    p.moving = moving;
    p.sprinting = sprinting;
    S.staminaFill.style.width = p.stamina.toFixed(0) + '%';
    S.stamina.hidden = p.stamina >= 99.5 && !sprinting;
    return Math.hypot(p.x - ox, p.y - oy);
  }

  function jobTarget(c, job, rnd) {
    const m = S.data.mission;
    const tiles = type => m.layout.filter(x => x.type === type);
    const pick = list => list[Math.floor(rnd() * list.length)];
    const hq = D.GRID.hq;
    if (job === 'maintenance') {
      const broken = m.layout.filter(x => m.modules[x.type] && m.modules[x.type].broken > 0 && x.type !== 'hab');
      const pool = broken.length ? broken : m.layout.filter(x => ['solar', 'battery', 'recycler', 'oxygen', 'reactor'].includes(x.type));
      const tl = pick(pool);
      return tl ? spotNear(tl.x, tl.y, rnd) : spotNear(hq[0], hq[1], rnd);
    }
    if (job === 'construction') {
      const pr = m.projects.find(x => x.x != null) || (S.data.plan.builds || []).find(x => x.x != null);
      if (pr) return spotNear(pr.x, pr.y, rnd);
      return quarry(rnd);
    }
    if (job === 'farming' && tiles('greenhouse').length) { const g = pick(tiles('greenhouse')); return spotNear(g.x, g.y, rnd); }
    if (job === 'science' && tiles('lab').length) { const l = tiles('lab')[0]; return spotNear(l.x, l.y, rnd); }
    if (job === 'eva') return quarry(rnd);
    return spotNear(hq[0], hq[1], rnd);
  }

  // The crew who aren't you stay at the base: EVA work happens on the open ring 6–11 tiles from the HQ.
  function quarry(rnd) {
    for (let i = 0; i < 30; i++) {
      const x = Math.floor(rnd() * 23) - 11, y = Math.floor(rnd() * 23) - 11, d2 = x * x + y * y;
      if (d2 < 36 || d2 > 121 || isBlocked(x, y)) continue;
      const [cx, cy] = center(x, y);
      return [cx + (rnd() - 0.5) * 30, cy + (rnd() - 0.5) * 20];
    }
    return spawnPoint();
  }

  function stepNpcs(dt) {
    const m = S.data.mission;
    const controlled = new Set([S.data.controlId, ...Object.keys(S.remote)]);
    for (const c of m.crew) {
      if (controlled.has(c.id)) { delete S.npcs[c.id]; continue; }
      let n = S.npcs[c.id];
      if (!n) {
        const [x, y] = spawnPoint();
        n = S.npcs[c.id] = { x: x + (Math.random() - 0.5) * 50, y: y + Math.random() * 10, dir: 'down', phase: 0, path: null, wait: Math.random() * 1.5, job: null, rnd: seeded(c.id + m.seed), working: false };
      }
      if (c.status !== 'active') { n.path = null; n.moving = false; continue; }
      const job = (S.data.plan.jobs || {})[c.id];
      if (job !== n.job) { n.job = job; n.path = null; n.wait = 0; }
      if (!n.path) {
        n.wait -= dt;
        n.moving = false;
        n.working = n.wait > 0 && n.arrived;
        if (n.wait <= 0) {
          const tgt = jobTarget(c, job, n.rnd);
          const path = tgt && findPath(n.x, n.y, Math.floor(tgt[0] / T), Math.floor(tgt[1] / T), false);
          if (path) { if (path.length) path[path.length - 1] = tgt; else path.push(tgt); n.path = path; n.arrived = false; }
          else n.wait = 1.5;
        }
        continue;
      }
      const [tx, ty] = n.path[0];
      const dx = tx - n.x, dy = ty - n.y, d = Math.hypot(dx, dy);
      if (d < 5) {
        n.path.shift();
        if (!n.path.length) { n.path = null; n.wait = 4 + n.rnd() * 6; n.arrived = true; }
        continue;
      }
      const sp = NPC_SPEED * (job === 'eva' ? 1.1 : 1);
      n.x += dx / d * sp * dt;
      n.y += dy / d * sp * dt;
      if (Math.abs(dx) > Math.abs(dy)) n.dir = dx > 0 ? 'right' : 'left'; else n.dir = dy > 0 ? 'down' : 'up';
      n.phase += dt * sp / 26;
      n.moving = true;
    }
  }

  function stepRemote(dt) {
    for (const r of Object.values(S.remote)) {
      const k = Math.min(1, dt * 10);
      const dx = r.tx - r.x, dy = r.ty - r.y;
      r.x += dx * k;
      r.y += dy * k;
      if (Math.hypot(dx, dy) > 1) r.phase += dt * 6;
    }
  }

  function maybeSend(ts) {
    if (!S.hooks.sendPos || ts - S.lastSent < 110) return;
    const p = S.player;
    const ev = S.eva.report();
    const k = Math.round(p.x) + ',' + Math.round(p.y) + ',' + p.dir + ',' + p.moving + ',' + p.inRover + ',' + (ev.suit == null ? '-' : Math.ceil(ev.suit)) + ',' + Math.floor(ev.driven);
    if (k === S.lastSentKey && ts - S.lastSent < 2000) return;
    S.lastSent = ts;
    S.lastSentKey = k;
    // The suit level travels with the position (teammates see it), except while you are down; the driver also says how far
    // the rover has gone, and `rover: false` from the driver parks it there even if the park action was lost.
    S.hooks.sendPos({ x: Math.round(p.x), y: Math.round(p.y), dir: p.dir, moving: p.moving, rover: p.inRover, suit: ev.suit == null ? undefined : ev.suit, driven: p.inRover ? ev.driven : undefined });
  }

  // ---------- what the player is looking at ----------
  function avatars() {
    const m = S.data.mission;
    const out = [];
    const byId = id => m.crew.find(c => c.id === id);
    const color = role => A.ROLE[role] || '#ccc';
    const me = controlledCrew();
    if (me && me.status !== 'dead') out.push({ id: me.id, role: me.role, color: color(me.role), x: S.player.x, y: S.player.y, dir: S.player.dir, phase: S.player.phase, moving: S.player.moving, you: true, down: me.status === 'down' || S.eva.collapsed(me.id), rover: S.player.inRover });
    for (const [id, n] of Object.entries(S.npcs)) {
      const c = byId(id);
      if (!c || c.status === 'dead') continue;
      out.push({ id, role: c.role, color: color(c.role), x: n.x, y: n.y, dir: n.dir, phase: n.phase, moving: n.moving, down: c.status === 'down', working: n.working, job: n.job });
    }
    for (const [id, r] of Object.entries(S.remote)) {
      const c = byId(id);
      if (!c || c.status === 'dead') continue;
      out.push({ id, role: c.role, color: color(c.role), x: r.x, y: r.y, dir: r.dir, phase: r.phase, moving: r.moving, remote: true, down: c.status === 'down' || S.eva.collapsed(id), rover: r.rover, bar: S.eva.suitBar(r) });
    }
    return out;
  }

  function focusAt(wx, wy) {
    const m = S.data.mission;
    const [gx, gy] = worldToGrid(wx, wy);
    if (wx === LANDER[0] && wy === LANDER[1]) return { kind: 'lander', key: 'lander', wx, wy };
    if (!inGrid(gx, gy)) return null;
    const tile = m.layout.find(x => x.x === gx && x.y === gy);
    if (tile) {
      if (tile.type === 'hab') return { kind: 'hq', key: 'hq', gx, gy, wx, wy };
      // The rover in its bay is something to drive, unless you are down (co-op, waiting for a revive): then it is just the bay.
      const drivable = S.eva.roverAtBay(S.player) && !S.eva.collapsed(S.data.controlId);
      if (tile.type === 'rover') return drivable ? { kind: 'rover', key: 'rover', gx, gy, wx, wy, type: 'rover' } : { kind: 'structure', key: 's:' + gx + ',' + gy, gx, gy, wx, wy, type: 'rover' };
      return { kind: 'structure', key: 's:' + gx + ',' + gy, gx, gy, wx, wy, type: tile.type };
    }
    const pr = m.projects.find(x => x.x === gx && x.y === gy);
    if (pr) return { kind: 'project', key: 'p:' + gx + ',' + gy, gx, gy, wx, wy, project: pr };
    const bi = (S.data.plan.builds || []).findIndex(b => b.x === gx && b.y === gy);
    if (bi >= 0) return { kind: 'queued', key: 'q:' + gx + ',' + gy, gx, gy, wx, wy, index: bi };
    if (S.base.gridRock.has(tkey(gx, gy))) return { kind: 'rock', key: 'r:' + gx + ',' + gy, gx, gy, wx, wy };
    return { kind: 'empty', key: 'e:' + gx + ',' + gy, gx, gy, wx, wy, ice: S.base.ice.has(tkey(gx, gy)) };
  }

  function stepFocus() {
    const p = S.player;
    let f = null;
    if (S.pendingAuto) {
      const a = S.pendingAuto;
      S.pendingAuto = null;
      if (a.kind === 'crew') f = { kind: 'crew', key: 'c:' + a.id, id: a.id };
      else f = focusAt(a.tile[0], a.tile[1]);
      if (f) { S.focus = f; openMenu(); return; }
    }
    // An open menu stays put until the player walks away.
    if (S.menuOpen && !p.moving) { renderPrompt(); return; }
    const [dx, dy] = DIRS[p.dir];
    const lx = p.x + dx * 38, ly = p.y - 8 + dy * 34;
    const crew = avatars().find(a => !a.you && !a.remote && Math.hypot(a.x - lx, a.y - ly) < 30);
    if (crew) f = { kind: 'crew', key: 'c:' + crew.id, id: crew.id };
    const ef = S.eva.focusAt(lx, ly, p, S.world); // a find, a dropped load, a crewmate down outside, the parked rover
    if (!f) f = ef;
    if (!f) f = focusAt(Math.floor(lx / T), Math.floor(ly / T));
    if (!f || f.kind === 'empty') {
      const under = focusAt(Math.floor(p.x / T), Math.floor((p.y - 4) / T));
      if (under && (!f || under.kind !== 'empty' || !f)) f = under || f;
    }
    // In the rover, E gets you out, unless there is work right there: a crewmate to revive, or a find or a dropped load your
    // backpack has room for (you step out to work on it and get back in). A full backpack never keeps you in a flat rover.
    if (p.inRover) f = ef && S.eva.holdable(ef) && (ef.kind === 'revive' || S.eva.hasRoom()) ? ef : { kind: 'rover', key: 'rover-exit', driving: true };
    const changed = (f && f.key) !== (S.focus && S.focus.key);
    S.focus = f;
    if (changed && S.menuOpen) closeMenu();
    renderPrompt();
  }

  function focusLabel(f) {
    if (!f) return '';
    switch (f.kind) {
      case 'hq': return t('mod.hab');
      case 'rover': return f.driving ? t('sf.exitRover') : t('sf.boardRover');
      case 'structure': return t('mod.' + f.type);
      case 'project': return t('mod.' + f.project.type) + ' · ' + t('bld.projects');
      case 'queued': return t('mod.' + S.data.plan.builds[f.index].type) + ' · ' + t('bld.queue');
      case 'rock': return t('map.rock');
      case 'lander': return t('sf.lander');
      case 'crew': return S.data.crewName(f.id);
      case 'empty': return t('sf.buildHere') + (f.ice ? ' · ' + t('map.ice') : '');
      default: return S.eva.label(f);
    }
  }

  function renderPrompt() {
    const f = S.focus;
    const show = !!f && !S.menuOpen && controlledCrew() && controlledCrew().status === 'active';
    S.prompt.hidden = !show;
    if (show) {
      const label = focusLabel(f);
      if (S.prompt.dataset.label !== label) {
        S.prompt.dataset.label = label;
        S.prompt.textContent = '';
        const k = el('kbd', null, S.touch ? '◉' : 'E');
        S.prompt.append(k, document.createTextNode(' ' + label));
      }
    }
    S.hint.hidden = S.time > S.hintUntil || S.eva.alerting(); // the flare's banner takes the hint's place
  }

  // ---------- interaction menu ----------
  function interact() {
    const me = controlledCrew();
    if (!me || me.status !== 'active') return;
    if (S.menuOpen) { closeMenu(); return; }
    if (!S.focus) return;
    if (S.eva.holdable(S.focus)) { S.eva.start(S.focus); return; }
    if (S.focus.kind === 'rover') { toggleRover(); return; }
    openMenu();
  }

  // Getting in and out of the rover goes through the exploring rules: one driver at a time, it stays where you leave it
