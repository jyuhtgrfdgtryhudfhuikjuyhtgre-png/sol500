  const NOTES = {
    en: [
      { title: 'Radiation on the surface', body: 'Curiosity’s RAD instrument measured about 0.64 mSv per sol at Gale Crater. Mars has no global magnetic field and a thin atmosphere, so cosmic rays reach the ground. SOL 500 uses that rate, reduced by your shielding.', src: ['hassler'] },
      { title: 'Radiation budget', body: 'The cruise to Mars and back adds about 660 mSv (1.84 mSv per day for 360 days). NASA’s career limit is 600 mSv, so a real crew is already over it before landing. That is an unsolved problem. The game gives each astronaut a 300 mSv surface budget to make the trade-off visible.', src: ['zeitlin', 'ochmo'] },
      { title: 'Oxygen, water and food', body: 'NASA’s life-support baseline is about 0.84 kg of oxygen per person per day. Drinking and food water is about 3.5 kg, roughly doubled by hygiene. Packaged ISS food runs about 1.8 kg per person per day with packaging.', src: ['bvad'] },
      { title: 'Recycling water', body: 'The ISS now recovers 98 % of its water from humidity and urine. The game uses 93 %, a little below the best result, because Mars dust and gravity add risk.', src: ['water98'] },
      { title: 'Oxygen from the air', body: 'MOXIE on Perseverance pulled oxygen out of Martian CO₂ 16 times, making 122 g in total and up to 12 g per hour. The game’s O₂ plant is a scaled-up MOXIE.', src: ['moxie'] },
      { title: 'Nuclear power', body: 'NASA’s Kilopower test in 2018 ran a reactor designed to give 1 to 10 kW for at least 10 years. The Fission Surface Power project is now aiming for 40 kW for the Moon and later Mars.', src: ['kilopower', 'fsp'] },
      { title: 'Dust storms', body: 'In June 2018 a planet-wide dust storm blocked sunlight over Opportunity for months. Its solar-powered batteries ran down and the rover never woke up. In the game a global storm cuts solar output to about 8 %.', src: ['opportunity'] },
      { title: 'Dust devils', body: 'Solar panels on Spirit and Opportunity slowly gathered dust, but passing whirlwinds sometimes blew them clean and boosted power. The game models dust as a slow loss that maintenance and dust devils undo.', src: ['spirit'] },
      { title: 'Perchlorate', body: 'The Phoenix lander found perchlorate salts, about 0.5 % of the soil by weight. They are toxic to people and must be washed out before soil is used for growing food.', src: ['perchlorate'] },
      { title: 'Solar conjunction', body: 'About every two years the Sun sits between Earth and Mars. NASA stops sending commands for about two weeks because the Sun’s plasma can corrupt radio signals.', src: ['conjunction'] },
      { title: 'Fresh food', body: 'Astronauts grow lettuce and other crops in the ISS Veggie chamber. Studies show that tending plants and eating fresh food help crew morale.', src: ['veggie'] },
      { title: 'Mission length', body: 'NASA’s Design Reference Architecture 5.0 plans a conjunction-class mission with about 500 days on the surface while Earth and Mars line up again for the trip home. Cargo landers go ahead of the crew, which inspired the orbital supply drops.', src: ['dra5'] },
      { title: 'What is simplified', body: 'Rounds are 25 sols long. Shielding percentages, build times, breakdown rates and science points are game values, chosen so that the trade-offs behave like the real ones.', src: [] },
      { title: 'Regions of Mars', body: 'The six regions of the endless map are modelled on real places: the floor of Jezero Crater (Plains), the Bagnold Dunes (Dune Sea), the cratered southern highlands (Crater Field), Valles Marineris (Canyon Lands), the shallow ice of Arcadia Planitia (Icy Plains) and the possible cave skylights of Arsia Mons (Volcanic Flanks).', src: ['jezero', 'bagnold', 'dichotomy', 'valles', 'iceMap', 'skylights'] },
    ],
    vi: [
      { title: 'Bức xạ trên bề mặt', body: 'Thiết bị RAD trên Curiosity đo được khoảng 0,64 mSv mỗi sol tại hố Gale. Sao Hỏa không có từ trường toàn cầu và khí quyển mỏng, nên tia vũ trụ xuống tới mặt đất. SOL 500 dùng con số này, giảm đi nhờ lớp che chắn của bạn.', src: ['hassler'] },
      { title: 'Giới hạn bức xạ', body: 'Chuyến bay tới sao Hỏa và trở về thêm khoảng 660 mSv (1,84 mSv mỗi ngày trong 360 ngày). Giới hạn cả sự nghiệp của NASA là 600 mSv, nên phi hành đoàn thật đã vượt mức trước cả khi hạ cánh. Đây là bài toán chưa có lời giải. Trò chơi cho mỗi phi hành gia 300 mSv trên bề mặt để thấy rõ sự đánh đổi.', src: ['zeitlin', 'ochmo'] },
      { title: 'Oxy, nước và thực phẩm', body: 'Theo mức chuẩn của NASA, mỗi người cần khoảng 0,84 kg oxy mỗi ngày. Nước uống và nấu ăn khoảng 3,5 kg, gấp đôi khi tính cả vệ sinh. Thực phẩm đóng gói trên ISS khoảng 1,8 kg mỗi người mỗi ngày tính cả bao bì.', src: ['bvad'] },
      { title: 'Tái chế nước', body: 'ISS giờ thu hồi 98 % nước từ hơi ẩm và nước tiểu. Trò chơi dùng 93 %, thấp hơn kết quả tốt nhất một chút, vì bụi và trọng lực sao Hỏa thêm rủi ro.', src: ['water98'] },
      { title: 'Oxy từ không khí', body: 'MOXIE trên Perseverance đã tách oxy từ CO₂ sao Hỏa 16 lần, tổng cộng 122 g và tối đa 12 g mỗi giờ. Trạm tạo oxy trong trò chơi là một MOXIE phóng to.', src: ['moxie'] },
      { title: 'Điện hạt nhân', body: 'Năm 2018, NASA thử lò Kilopower được thiết kế cho 1 đến 10 kW trong ít nhất 10 năm. Dự án Fission Surface Power hiện nhắm tới 40 kW cho Mặt Trăng và sau đó là sao Hỏa.', src: ['kilopower', 'fsp'] },
      { title: 'Bão bụi', body: 'Tháng 6/2018, một cơn bão bụi toàn cầu che nắng trên Opportunity suốt nhiều tháng. Pin năng lượng mặt trời cạn dần và robot không bao giờ tỉnh lại. Trong trò chơi, bão toàn cầu giảm điện mặt trời còn khoảng 8 %.', src: ['opportunity'] },
      { title: 'Lốc bụi', body: 'Tấm pin của Spirit và Opportunity bám bụi dần, nhưng thỉnh thoảng lốc xoáy thổi sạch và làm điện tăng lên. Trò chơi mô phỏng bụi là sự hao hụt chậm, được bảo trì và lốc bụi xóa đi.', src: ['spirit'] },
      { title: 'Perchlorat', body: 'Tàu Phoenix tìm thấy muối perchlorat chiếm khoảng 0,5 % khối lượng đất. Chúng độc với con người và phải được rửa sạch trước khi dùng đất trồng cây.', src: ['perchlorate'] },
      { title: 'Giao hội Mặt Trời', body: 'Khoảng hai năm một lần, Mặt Trời nằm giữa Trái Đất và sao Hỏa. NASA ngừng gửi lệnh khoảng hai tuần vì plasma Mặt Trời có thể làm hỏng tín hiệu vô tuyến.', src: ['conjunction'] },
      { title: 'Rau tươi', body: 'Phi hành gia trồng xà lách và các loại cây khác trong buồng Veggie trên ISS. Nghiên cứu cho thấy chăm cây và ăn rau tươi giúp tinh thần phi hành đoàn.', src: ['veggie'] },
      { title: 'Độ dài nhiệm vụ', body: 'Kiến trúc tham chiếu 5.0 của NASA dự kiến nhiệm vụ kiểu giao hội với khoảng 500 ngày trên bề mặt, chờ Trái Đất và sao Hỏa thẳng hàng lại để trở về. Các tàu chở hàng đi trước phi hành đoàn, và đó là cảm hứng cho các chuyến hàng từ quỹ đạo.', src: ['dra5'] },
      { title: 'Điều gì đã được đơn giản hóa', body: 'Mỗi vòng dài 25 sol. Phần trăm che chắn, thời gian xây, tỉ lệ hỏng hóc và điểm khoa học là giá trị của trò chơi, được chọn để các sự đánh đổi diễn ra giống thực tế.', src: [] },
      { title: 'Các vùng của sao Hỏa', body: 'Sáu vùng trên bản đồ vô tận được mô phỏng theo những nơi có thật: đáy hố Jezero (Đồng bằng), cồn cát Bagnold (Biển cồn cát), cao nguyên phía nam có nhiều hố va chạm (Cánh đồng hố va chạm), Valles Marineris (Vùng hẻm núi), lớp băng nông ở đồng bằng Arcadia (Đồng bằng băng) và các cửa sổ hang động có thể có trên núi Arsia Mons (Sườn núi lửa).', src: ['jezero', 'bagnold', 'dichotomy', 'valles', 'iceMap', 'skylights'] },
    ],
  };

  const STR = { en, vi };

  function t(lang, key, params) {
    const table = STR[lang] || en;
    let s = table[key];
    if (s == null) s = en[key];
    if (s == null) return key;
    if (params) s = s.replace(/\{(\w+)\}/g, (m, k) => (params[k] != null ? String(params[k]) : m));
    return s;
  }

  function has(lang, key) {
    return (STR[lang] && STR[lang][key] != null) || en[key] != null;
  }

  return { t, has, STR, SOURCES, REGION_SOURCES, NOTES, LANGS: ['en', 'vi'] };
});

<script>
/*
 * SOL 500 — small SVG line charts for the debrief.
 * One y-axis per chart, 2 px lines, legend + direct end labels, crosshair tooltip, and a data table for screen readers.
 * lineChart config: { title, unit, series: [{ name, color, points: [[x, y], ...] }], refLines: [{ y, label }], xLabel, fmt,
 *                     xMin, xMax, xTicks (defaults: 0, max(500, data), 100: the sol axis) }
 * barChart config:  { title, rows: [{ label, value }], color, fmt, tableLabel }: horizontal bars, one hue, value at the tip
 */
(function (root) {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const W = 640, H = 230, M = { l: 48, r: 104, t: 14, b: 30 };

  function el(tag, attrs, parent) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }

  function niceMax(v) {
    if (v <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p;
    return 10 * p;
  }

  function lineChart(container, cfg) {
    const fmt = cfg.fmt || (v => Math.round(v).toLocaleString());
    const series = cfg.series.filter(s => s.points.length);
    const xs = series.flatMap(s => s.points.map(p => p[0]));
    const ys = series.flatMap(s => s.points.map(p => p[1]));
    const xMin = cfg.xMin != null ? cfg.xMin : 0;
    const xMax = cfg.xMax != null ? cfg.xMax : Math.max(500, ...xs);
    const xStep = cfg.xTicks || 100;
    const yMaxData = Math.max(1, ...ys, ...(cfg.refLines || []).map(r => r.y));
    const yMax = niceMax(yMaxData * 1.05);
    const lowest = Math.min(0, ...ys);
    const yMin = lowest < 0 ? -niceMax(-lowest * 1.05) : 0;
    const X = x => M.l + (x - xMin) / Math.max(1e-9, xMax - xMin) * (W - M.l - M.r);
    const Y = y => H - M.b - ((y - yMin) / (yMax - yMin)) * (H - M.t - M.b);

    const wrap = document.createElement('div');
    wrap.className = 'chart';
    if (series.length > 1) {
      const lg = document.createElement('div');
      lg.className = 'chart-legend';
      for (const s of series) {
        const item = document.createElement('span');
        const sw = document.createElement('i');
        sw.style.background = s.color;
        item.appendChild(sw);
        item.appendChild(document.createTextNode(s.name));
        lg.appendChild(item);
      }
      wrap.appendChild(lg);
    }

    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': cfg.title || '' });
    el('title', {}, svg).textContent = cfg.title || '';

    // grid + y axis
    const ticks = 4;
    for (let i = 0; i <= ticks; i++) {
      const v = yMin + ((yMax - yMin) / ticks) * i;
      const y = Y(v);
      el('line', { x1: M.l, x2: W - M.r, y1: y, y2: y, stroke: 'var(--line)', 'stroke-width': Math.abs(v) < 1e-9 ? 1.2 : 0.8 }, svg);
      const t = el('text', { x: M.l - 8, y: y + 4, 'text-anchor': 'end', fill: 'var(--fg-3)', 'font-size': 11, 'font-family': 'var(--font-data)' }, svg);

        const t = el('text', { x: W - M.r + 8, y: e.y + 4, fill: 'var(--fg-2)', 'font-size': 11 }, svg);

      }

    const dots = series.map(s => el('circle', { r: 4, fill: s.color, stroke: 'var(--panel)', 'stroke-width': 2, visibility: 'hidden' }, svg));
    const hit = el('rect', { x: M.l, y: M.t, width: W - M.l - M.r, height: H - M.t - M.b, fill: 'transparent' }, svg);
    const tip = document.createElement('div');
    tip.className = 'tip';
    tip.hidden = true;

      const box = svg.getBoundingClientRect();
      const vx = ((evt.clientX - box.left) / box.width) * W;
      const sol = xMin + ((vx - M.l) / (W - M.l - M.r)) * (xMax - xMin);
      let best = allX[0];
      for (const x of allX) if (Math.abs(x - sol) < Math.abs(best - sol)) best = x;
      const cx = X(best);
      cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('visibility', 'visible');
      tip.textContent = '';
      const head = document.createElement('div');
      head.textContent = (cfg.xLabel || 'x') + ' ' + best;
      tip.appendChild(head);
      series.forEach((s, i) => {
        const p = s.points.find(q => q[0] === best);
        if (!p) { dots[i].setAttribute('visibility', 'hidden'); return; }
        dots[i].setAttribute('cx', X(p[0])); dots[i].setAttribute('cy', Y(p[1])); dots[i].setAttribute('visibility', 'visible');
        const row = document.createElement('div');

      const label = el('text', { x: LW - 10, y: y + BAR / 2 + 4, 'text-anchor': 'end', fill: 'var(--fg-2)', 'font-size': 12 }, svg);
      label.textContent = r.label;

        const d = `M${LW} ${y} H${x2 - rr} Q${x2} ${y} ${x2} ${y + rr} V${y + BAR - rr} Q${x2} ${y + BAR} ${x2 - rr} ${y + BAR} H${LW} Z`;

        tip.style.top = (top / BH) * 100 + '%';

      hit.addEventListener('pointerdown', show);

    wrap.appendChild(tip);

    const sum = document.createElement('summary');
    sum.className = 'hint';
    sum.textContent = cfg.tableLabel || 'Data table';

    table.className = 'log';

    tw.appendChild(table);
    det.appendChild(tw);
    wrap.appendChild(det);
    container.appendChild(wrap);
    return wrap;
  }

<script>
/*
 * SOL 500 — co-op client. Talks to server.js: JSON POSTs for actions, one WebSocket for live updates.
 * Works on the home network (ws://) and through the Cloudflare share link (wss://).
 * Session { code, playerId, token } lives in sessionStorage, so each browser tab is its own player.
 */
(function (root) {
  'use strict';
  const KEY = 'sol500.lan';
  let session = null;
  let ws = null;        // the live socket, or null
  let handlers = null;  // { onRoom, onStatus, onPos } while connected
  let retry = 0;
  let timer = null;
  let gen = 0;          // bumped by disconnect(): tells an in-flight recover() it is stale
  let hiddenAt = 0;

  async function info() {
    if (!/^https?:$/.test(location.protocol)) return null;
    try {
      const r = await fetch('/api/info', { cache: 'no-store' });
      if (!r.ok) return null;
      const j = await r.json();
      return j && j.lan ? j : null;
    } catch (e) {
      return null;
    }
  }

  async function post(path, body) {
    try {
      const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      return await r.json();
    } catch (e) {
      return { error: 'network' };
    }
  }

  function save(s) {
    session = { code: s.code, playerId: s.playerId, token: s.token };
    try { sessionStorage.setItem(KEY, JSON.stringify(session)); } catch (e) { /* private mode: keep in memory */ }
  }

  function restore() {
    try {
      const s = JSON.parse(sessionStorage.getItem(KEY) || 'null');
      if (s && s.code && s.playerId && s.token) session = s;
    } catch (e) { session = null; }
    return session;
  }

  function clear() {
    session = null;
    try { sessionStorage.removeItem(KEY); } catch (e) { /* ignore */ }
  }

  async function create(name) {
    const j = await post('/api/room/create', { name });
    if (j.code) save(j);
    return j;
  }

  async function join(code, name) {
    const j = await post('/api/room/join', { code: String(code || '').trim().toUpperCase(), name });
    if (j.code) save(j);
    return j;
  }

  function socketUrl() {
    const q = new URLSearchParams({ code: session.code, player: session.playerId, token: session.token });
    return (location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/ws?' + q.toString();
  }

  function connect(onRoom, onStatus, onPos) {
    if (!session) return;
    disconnect();
    handlers = { onRoom, onStatus, onPos };
    open();
  }

  function open() {
    timer = null;
    if (!session || !handlers) return;
    if (ws) { const old = ws; ws = null; old.close(); } // never leave two sockets open
    const h = handlers;
    const sock = new WebSocket(socketUrl());
    ws = sock;
    sock.onopen = () => { retry = 0; h.onStatus('open'); };
    sock.onmessage = e => {
      let msg;
      try { msg = JSON.parse(e.data); } catch (err) { return; }
      if (!msg) return;
      if (msg.t === 'room') h.onRoom(msg.d);
      else if (msg.t === 'pos') { if (h.onPos) h.onPos(msg.d); }
      else if (msg.t === 'event' && msg.d && (msg.d.kind === 'kicked' || msg.d.kind === 'closed')) gone(msg.d.kind);
    };
    sock.onclose = () => {
      if (ws !== sock) return; // closed on purpose
      ws = null;
      h.onStatus('error');
      recover();
    };
  }

  // A refused socket looks just like a network error, so ask the server whether this seat still exists.
  async function recover() {
    const s = session;
    const g = gen;
    if (!s || !handlers) return;
    try {
      const q = new URLSearchParams({ code: s.code, player: s.playerId, token: s.token });
      const r = await fetch('/api/room/state?' + q.toString(), { cache: 'no-store' });
      if (r.status === 403) { gone(); return; }
    } catch (e) { /* host unreachable for now: keep trying */ }
    if (g !== gen || session !== s || !handlers) return; // disconnected or reconnected meanwhile
    timer = setTimeout(open, Math.min(5000, 500 * Math.pow(2, retry++)));
  }

  // kind: 'kicked' | 'closed' when the host said why; a refused seat (403) has no reason.
  function gone(kind) {
    const h = handlers;
    disconnect();
    clear();
    if (h) h.onStatus('gone', kind);
  }

  function disconnect() {
    gen++;
    clearTimeout(timer);
    timer = null;
    handlers = null;
    const s = ws;
    ws = null;
    if (s) s.close();
  }

  // After sleep or a silent Wi-Fi drop the browser can keep a dead socket without firing onclose: replace it.
  function refresh() {
    if (!session || !handlers) return;
    gen++;
    clearTimeout(timer);
    retry = 0;
    const old = ws;
    ws = null; // so its onclose is ignored
    if (old) old.close();
    open();
  }

  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('online', refresh);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { hiddenAt = Date.now(); return; }
      if (hiddenAt && Date.now() - hiddenAt > 15000) refresh();
      hiddenAt = 0;
    });
  }

  function act(type, payload) {
    if (!session) return Promise.resolve({ error: 'noSession' });
    return post('/api/room/act', Object.assign({ code: session.code, player: session.playerId, token: session.token, type }, payload || {}));
  }

  function sendPos(pos) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'pos', d: pos }));
  }

  // Play-testing hook: drops the socket the way a Wi-Fi blip would, so reconnection can be checked in a real browser.
  function dropForTest() { if (ws) ws.close(); }

  // A finished solo game, for the host's admin panel. Fire and forget: the game never waits on it. The explored-map
  // bitsets (from M3) are dropped first so the mission stays far under the server's 64 KB limit.
  function recordSolo(mission, player) {
    const m = Object.assign({}, mission);
    if (m.expedition) m.expedition = Object.assign({}, m.expedition, { revealed: {} });
    return post('/api/history/solo', { mission: m, player: player || '' });
  }

  root.SolNet = { info, create, join, restore, clear, connect, disconnect, act, sendPos, dropForTest, recordSolo, session: () => session };
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
/*
 * SOL 500 — the endless world. Every tile is a pure function of (seed, x, y), so a chunk can be built in any order,
 * on any client or on the server, and always comes out byte-identical. The world is never sent over the network.
 *
 * Determinism rules: integer hashing with Math.imul; the only floating-point maths is + − × ÷, %, Math.sqrt,
 * Math.floor/ceil/abs/min/max, which IEEE 754 makes identical in every JavaScript engine. Math.sin/cos/atan2/pow/
 * exp/hypot are never used here (engines may round them differently), and neither is Math.random.
 *
 * World tiles are integers in both directions (negative too). The base's 9×5 build grid has its top-left at
 * (−4, −2), so the HQ is at (0, 0). Nothing that blocks is ever placed within FLAT_RADIUS tiles of the HQ.
 *
 * API: seedOf(missionSeed) → uint32 · regionAt(seed, x, y) → index into REGIONS
 *      chunk(seed, cx, cy) → { cx, cy, tiles: Uint8Array(1024), regions: Uint8Array(512) }   (32×32, row-major)
 *      tileOf(chunk, lx, ly) · regionOf(chunk, lx, ly)
 *      featuresNear(seed, x0, y0, x1, y1) → { canyons, craters, mesas } touching that tile box (inclusive)
 *      hash(seed, a, b, c) → uint32 · unit(h) → [0, 1) · noise(seed, salt, x, y, size) → [0, 1]

    RAMP: 9, ICE: 10, POLYGON: 11, LAVA: 12, TUBE_FLOOR: 13, TUBE_WALL: 14, SKYLIGHT: 15, STRUCT_FLOOR: 16,

    // Browser QA: a hash of a painted chunk's pixels proves a deleted chunk comes back identical.
    function chunkHash(ix, iy) {
      const e = images.get(ix + ',' + iy);
      if (!e) return null;
      const px = e.c.getContext('2d').getImageData(0, 0, PX, PX).data;
      let h = 2166136261;
      for (let i = 0; i < px.length; i++) h = Math.imul(h ^ px[i], 16777619);
      return (h >>> 0).toString(16).padStart(8, '0');
    }
    function stats() {
      const sorted = times.slice().sort((a, b) => a - b);
      return {
        images: images.size, cap: Math.max(cap, need), queue: queue.length, minis: minis.size, miniQueue: miniWant.size,
        renders, paintMedian: sorted.length ? sorted[sorted.length >> 1] : 0,
      };
    }
    return {
      retainView, work, drawGround, workMinis, chunkHash, stats,
      mini: (cx, cy) => mini(cx, cy, false),
      has: (ix, iy) => images.has(ix + ',' + iy),
      pending: () => queue.map(q => [q[0], q[1]]),
    };
  }

  // ---------- fog over the view ----------
  // Unseen tiles are covered; seen tiles outside your view radius are dimmed; tiles in view are clear.
  const FOG = '#120a0c';
  function drawFog(ctx, world, x0, y0, x1, y1, px, py, rad) {
    const tx0 = Math.floor(x0 / T), ty0 = Math.floor(y0 / T), tx1 = Math.floor(x1 / T), ty1 = Math.floor(y1 / T);
    ctx.fillStyle = FOG;
    for (let ty = ty0; ty <= ty1; ty++) {
      const ky = Math.floor(ty / CH), ly = ty - ky * CH;
      let run = null, kx = null, fogBits = null;
      for (let tx = tx0; tx <= tx1 + 1; tx++) {
        let hidden = false;
        if (tx <= tx1) {
          const cx = Math.floor(tx / CH);
          if (cx !== kx) { kx = cx; fogBits = world.fogBits(cx, ky); }
          hidden = !fogBits || !F.has(fogBits, tx - cx * CH, ly);
        }
        if (hidden && run === null) run = tx;
        else if (!hidden && run !== null) { ctx.fillRect(run * T, ty * T, (tx - run) * T, T + 0.5); run = null; }
      }
    }
    const g = ctx.createRadialGradient(px, py, Math.max(0, rad - T * 1.5), px, py, rad);
    g.addColorStop(0, 'rgba(10,6,8,0)');
    g.addColorStop(1, 'rgba(10,6,8,0.5)');
    ctx.fillStyle = g;
    ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
  }

  // ---------- sprites (moved from surface.js) ----------
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawRock(ctx, d) {
    const cx = d.wx * T + T / 2 + (d.ox || 0), cy = d.wy * T + T / 2 + (d.oy || 0);
    const s = d.s;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(cx, cy + 14 * s, 22 * s, 7 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4c3b37';
    ctx.beginPath(); ctx.ellipse(cx - 4 * s, cy + 4 * s, 20 * s, 14 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5e4a45';
    ctx.beginPath(); ctx.ellipse(cx + 10 * s, cy - 2 * s, 12 * s, 10 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6f5a54';
    ctx.beginPath(); ctx.ellipse(cx - 8 * s, cy - 1 * s, 7 * s, 3 * s, 0, 0, Math.PI * 2); ctx.fill();
  }

  function drawLander(ctx, wx, wy) {
    const cx = wx * T + T / 2, cy = wy * T + T / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0, 22, 34, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#9aa0a6';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-18, 2); ctx.lineTo(-30, 22); ctx.moveTo(18, 2); ctx.lineTo(30, 22); ctx.moveTo(0, 6); ctx.lineTo(0, 22); ctx.stroke();
    ctx.fillStyle = '#c9c1b5';
    ctx.beginPath(); ctx.moveTo(-24, 4); ctx.lineTo(24, 4); ctx.lineTo(16, -14); ctx.lineTo(-16, -14); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#d9aa7a';
    ctx.fillRect(-22, -2, 44, 5);
    ctx.fillStyle = '#86b8ea';
    ctx.fillRect(-12, -12, 7, 12); ctx.fillRect(5, -12, 7, 12);
    ctx.restore();
  }

  function badge(ctx, x, y, kind) {
    ctx.save();
    ctx.translate(x, y);
    if (kind === 'broken') {
      ctx.fillStyle = '#f46e5f';
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2a1214';
      ctx.fillRect(-1.5, -5.5, 3, 7); ctx.fillRect(-1.5, 3, 3, 2.6);
    } else {
      ctx.fillStyle = '#3a2e33';
      ctx.strokeStyle = '#9a877f';
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#f2b84f';
      ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(0, 1, 4.5, -Math.PI * 0.25, Math.PI * 1.25); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(0, 0); ctx.stroke();
    }
    ctx.restore();
  }

  // a: { x, y, dir, phase, moving, you, down, rover, working, color }. Name tags are queued in `tags`
  // and laid out by drawTags once every sprite is drawn.
  function drawAvatar(ctx, a, name, time, tags, roverImg) {
    const color = a.color || '#ccc';
    const x = a.x, y = a.y;
    const tag = (tx, ty, text, c, you) => { if (text) tags.push({ x: tx, y: ty, text, color: c, you }); };
    ctx.save();
    if (a.you) {
      const pulse = 0.55 + 0.45 * Math.sin(time * 4);
      ctx.strokeStyle = `rgba(140,188,236,${0.5 + pulse * 0.4})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(x, y + 2, 17, 6, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(x, y + 2, 12, 4.5, 0, 0, Math.PI * 2); ctx.fill();
    if (a.rover) {
      if (roverImg) {
        ctx.save();
        if (a.dir === 'left') { ctx.translate(x, 0); ctx.scale(-1, 1); ctx.translate(-x, 0); }
        ctx.drawImage(roverImg, x - 34, y - 52, 68, 68);
        ctx.restore();
      }
      tag(x, y - 50, name, color, a.you);
      ctx.restore();
      return;
    }
    if (a.down) {
      ctx.translate(x, y - 6);
      ctx.fillStyle = '#e9e2d8';
      roundRect(ctx, -16, -6, 26, 12, 5); ctx.fill();
      ctx.fillStyle = color; ctx.fillRect(-10, -6, 3, 12);
      ctx.fillStyle = '#f3eee7'; ctx.beginPath(); ctx.arc(14, 0, 8, 0, Math.PI * 2); ctx.fill();
      const pulse = 0.5 + 0.5 * Math.sin(time * 5);
      ctx.fillStyle = `rgba(244,110,95,${0.6 + pulse * 0.4})`;
      ctx.fillRect(-2, -26, 4, 14); ctx.fillRect(-7, -21, 14, 4);
      ctx.restore();
      tag(x, y - 34, name, '#f46e5f', a.you);
      return;
    }
    const bob = a.moving ? Math.abs(Math.sin(a.phase)) * 2 : Math.sin(time * 2 + x) * 0.6;
    const swing = a.moving ? Math.sin(a.phase) * 4 : 0;
    // legs
    ctx.fillStyle = '#d6cec3';
    roundRect(ctx, x - 7, y - 11 + (swing > 0 ? 0 : 1), 6, 11 - (swing > 0 ? 0 : 1) + Math.max(0, swing * 0.3), 2); ctx.fill();
    roundRect(ctx, x + 1, y - 11 + (swing < 0 ? 0 : 1), 6, 11 - (swing < 0 ? 0 : 1) + Math.max(0, -swing * 0.3), 2); ctx.fill();
    ctx.fillStyle = '#6d6266';
    ctx.fillRect(x - 7, y - 2, 6, 2); ctx.fillRect(x + 1, y - 2, 6, 2);
    const by = y - 12 - bob;
    // backpack behind (visible from the sides and back)
    if (a.dir !== 'down') {
      ctx.fillStyle = '#9da3a9';
      const bx = a.dir === 'left' ? x + 4 : a.dir === 'right' ? x - 14 : x - 9;
      roundRect(ctx, bx, by - 18, a.dir === 'up' ? 18 : 10, 16, 3); ctx.fill();
    }
    // arms
    ctx.fillStyle = '#e1d9ce';
    roundRect(ctx, x - 13, by - 17 + swing * 0.5, 5, 12, 2.5); ctx.fill();
    roundRect(ctx, x + 8, by - 17 - swing * 0.5, 5, 12, 2.5); ctx.fill();
    // torso
    ctx.fillStyle = '#ece5db';
    roundRect(ctx, x - 9, by - 19, 18, 19, 5); ctx.fill();
    ctx.fillStyle = color;
    ctx.fillRect(x - 9, by - 9, 18, 3);
    if (a.dir === 'down') { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x + 4, by - 14, 2.2, 0, Math.PI * 2); ctx.fill(); }
    // helmet
    const hy = by - 27;
    ctx.fillStyle = '#f4efe8';
    ctx.strokeStyle = '#b9afa4';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x, hy, 10.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = color;
    roundRect(ctx, x - 3.5, hy - 12, 7, 3, 1.5); ctx.fill();
    if (a.dir !== 'up') {
      const ox = a.dir === 'left' ? -3 : a.dir === 'right' ? 3 : 0;
      const grad = ctx.createLinearGradient(x, hy - 6, x, hy + 6);
      grad.addColorStop(0, '#0e1a2b');
      grad.addColorStop(0.65, '#1f3c62');
      grad.addColorStop(1, color);
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.ellipse(x + ox, hy + 1, a.dir === 'down' ? 7.5 : 6, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(x + ox - 1, hy, 4.5, Math.PI * 1.1, Math.PI * 1.45); ctx.stroke();
    }
    if (a.working) {
      const wob = Math.sin(time * 6) * 1.5;
      ctx.fillStyle = 'rgba(20,14,16,0.85)';
      ctx.beginPath(); ctx.arc(x + 15, hy - 14 + wob, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(x + 15, hy - 14 + wob, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    tag(x, hy - 17, name, color, a.you);
  }

  // Name tags are laid out after all sprites so they never pile on top of each other.
  function drawTags(ctx, tags) {
    const placed = [];
    ctx.font = '600 10px "Be Vietnam Pro", system-ui, sans-serif';
    const list = tags.slice().sort((a, b) => (b.you - a.you) || (b.y - a.y));
    for (const tg of list) {
      const w = ctx.measureText(tg.text).width + 16;
      let y = tg.y;
      for (let i = 0; i < 6; i++) {
        const hit = placed.some(r => Math.abs(r.x - tg.x) < (r.w + w) / 2 + 2 && Math.abs(r.y - y) < 16);
        if (!hit) break;
        y -= 16;
      }
      placed.push({ x: tg.x, y, w });
      drawTag(ctx, tg.x, y, tg.text, tg.color, tg.you, w);
    }
    tags.length = 0;
  }

  function drawTag(ctx, x, y, text, color, you, w) {
    ctx.save();
    ctx.fillStyle = you ? 'rgba(140,188,236,0.92)' : 'rgba(20,14,16,0.78)';
    roundRect(ctx, x - w / 2, y - 14, w, 15, 7); ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x - w / 2 + 7, y - 6.5, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = you ? '#0c1a29' : '#f4e9df';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x - w / 2 + 12, y - 6.2);
    ctx.restore();
  }

  return {
    IMG, PX, REGION_COLORS, tileRGB, decorFor, createPainter, drawFog,
    sprites: { drawAvatar, drawTags, roundRect, badge, drawRock, drawLander },
  };
});

<script>
/*
 * SOL 500 — the minimap (160×160 tiles, one pixel per tile, centred on you) and the full-screen map of everything
 * the crew has explored, with pan and zoom. Both draw the painter's one-pixel-per-tile "mini" images of explored
 * chunks, so they never need the full ground painting. Also formats the debug overlay (?debug=chunks or F3).
 *
 * API: SolMap.create({ t, onOpen, onClose }) → map
 *        map.attach(world, painter)          a new mission's world
 *        map.minimap · map.el                elements for the surface overlay
 *        map.drawMini(state, now)            state: { px, py, crew: [{ x, y, color, you }] } (world pixels)
 *        map.open(state?) · map.close() · map.isOpen() · map.key(keyEvent) → used?
 *        map.frame(state, deadline)          every animation frame (does nothing while closed)
 *        map.relabel()                       after a language change
 *      SolMap.debugText(stats) → string
 */
(function (root) {
  'use strict';
  const W = root.SolWorldgen, P = root.SolPaint;
  const T = 64, CH = W.CHUNK, MINI = 160;
  const ZOOMS = [1, 2, 3, 4, 6, 8]; // screen pixels per tile on the full map
  const PAN = { ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0], ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1] };

  function create(opts) {
    const t = opts.t;
    let world = null, painter = null, last = null, lastMini = -1e9;
    let open = false, zi = 2, cx = 0, cy = 0, drag = null;
    const dpr = () => Math.min(2, root.devicePixelRatio || 1);
    const node = (tag, cls, text) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    };

    // The HQ, then every crew member as a dot in their role colour (you with a white ring).
    function markers(g, st, at) {
      const [bx, by] = at(T / 2, T / 2); // the HQ is tile (0, 0)
      g.fillStyle = '#f4e9df';
      g.strokeStyle = '#120a0c';
      g.lineWidth = 1;
      g.fillRect(bx - 3.5, by - 3.5, 7, 7);
      g.strokeRect(bx - 3.5, by - 3.5, 7, 7);
      for (const c of st.crew) {
        const [x, y] = at(c.x, c.y);
        g.fillStyle = c.color;
        g.beginPath(); g.arc(x, y, c.you ? 3.5 : 2.5, 0, Math.PI * 2); g.fill();
        if (c.you) { g.strokeStyle = '#ffffff'; g.lineWidth = 1.5; g.stroke(); }
      }
    }

    // ---------- minimap ----------
    const minimap = node('button', 'sf-mini');
    minimap.type = 'button';
    const mc = node('canvas');
    minimap.appendChild(mc);
    minimap.addEventListener('click', () => openMap());

    function drawMini(st, now) {
      last = st;
      if (!world || open || now - lastMini < 150) return;
      lastMini = now;
      const size = minimap.clientWidth || MINI, k = dpr();
      if (mc.width !== Math.round(size * k)) { mc.width = Math.round(size * k); mc.height = Math.round(size * k); }
      const g = mc.getContext('2d');
      const z = size / MINI; // CSS pixels per tile: 1, or less on small screens
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.imageSmoothingEnabled = false;
      g.fillStyle = '#120a0c';
      g.fillRect(0, 0, mc.width, mc.height);
      const ox = Math.floor(st.px / T) - MINI / 2, oy = Math.floor(st.py / T) - MINI / 2;
      for (let ky = Math.floor(oy / CH); ky <= Math.floor((oy + MINI - 1) / CH); ky++) {
        for (let kx = Math.floor(ox / CH); kx <= Math.floor((ox + MINI - 1) / CH); kx++) {
          const c = painter.mini(kx, ky);
          if (c) blit(g, c, kx * CH - ox, ky * CH - oy, k * z);
        }
      }
      g.setTransform(k, 0, 0, k, 0, 0);
      markers(g, st, (x, y) => [(x / T - ox) * z, (y / T - oy) * z]);
    }

    // Draws a chunk's mini image snapped to whole device pixels (s = device pixels per tile), so neighbouring
    // chunks meet exactly, with no seam.
    function blit(g, c, tx, ty, s) {
      const x0 = Math.round(tx * s), y0 = Math.round(ty * s), x1 = Math.round((tx + CH) * s), y1 = Math.round((ty + CH) * s);
      g.drawImage(c, x0, y0, x1 - x0, y1 - y0);
    }

    // ---------- full map ----------
    const el = node('div', 'sf-map');
    el.hidden = true;
    el.setAttribute('role', 'dialog');
    const fc = node('canvas');
    const head = node('div', 'sf-map-head');
    const title = node('b');
    const legend = node('div', 'sf-map-legend');
    const button = (label, onClick) => { const b = node('button', null, label); b.type = 'button'; b.addEventListener('click', onClick); return b; };
    const zoomOut = button('−', () => zoom(-1)), zoomIn = button('+', () => zoom(1)), shut = button('×', () => closeMap());
    head.append(title, legend, zoomOut, zoomIn, shut);
    const hint = node('p', 'sf-map-hint');
    el.append(fc, head, hint);

    function relabel() {
      title.textContent = t('sf.mapTitle');
      hint.textContent = t('sf.mapHint');
      el.setAttribute('aria-label', t('sf.mapTitle'));
      minimap.setAttribute('aria-label', t('sf.minimap'));
      zoomIn.setAttribute('aria-label', t('sf.zoomIn'));
      zoomOut.setAttribute('aria-label', t('sf.zoomOut'));
      shut.setAttribute('aria-label', t('common.close'));
      legend.textContent = '';
      W.REGIONS.forEach((id, i) => {
        const item = node('span');
        const swatch = node('i');
        swatch.style.background = P.REGION_COLORS[i];
        item.append(swatch, document.createTextNode(t('region.' + id)));
        legend.appendChild(item);
      });
    }

    function openMap(st) {
      if (!world) return;
      const s = st || last;
      if (s) { cx = s.px / T; cy = s.py / T; }
      open = true;
      el.hidden = false;
      if (opts.onOpen) opts.onOpen();
      shut.focus({ preventScroll: true });
    }
    function closeMap() {
      if (!open) return;
      open = false;
      el.hidden = true;
      drag = null;
      if (opts.onClose) opts.onClose();
    }
    function zoom(d) { zi = Math.max(0, Math.min(ZOOMS.length - 1, zi + d)); }
    // Keys while the map is open; returns true when the key was used.
    function key(e) {
      if (e.code === 'Escape' || e.code === 'KeyM') { closeMap(); return true; }
      if (e.key === '+' || e.key === '=') { zoom(1); return true; }
      if (e.key === '-' || e.key === '_') { zoom(-1); return true; }
      const d = PAN[e.code];
      if (!d) return false;
      const step = 48 / ZOOMS[zi];
      cx += d[0] * step;
      cy += d[1] * step;
      return true;
    }
    fc.addEventListener('pointerdown', e => { drag = { id: e.pointerId, x: e.clientX, y: e.clientY }; fc.setPointerCapture(e.pointerId); });
    fc.addEventListener('pointermove', e => {
      if (!drag || drag.id !== e.pointerId) return;
      const z = ZOOMS[zi];
      cx -= (e.clientX - drag.x) / z;
      cy -= (e.clientY - drag.y) / z;
      drag.x = e.clientX;
      drag.y = e.clientY;
    });
    const endDrag = () => { drag = null; };
    fc.addEventListener('pointerup', endDrag);
    fc.addEventListener('pointercancel', endDrag);
    fc.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY < 0 ? 1 : -1); }, { passive: false });

    function frame(st, deadline) {
      last = st;
      if (!open || !world) return;
      painter.workMinis(deadline);
      const k = dpr(), w = el.clientWidth, h = el.clientHeight;
      if (fc.width !== Math.round(w * k) || fc.height !== Math.round(h * k)) { fc.width = Math.round(w * k); fc.height = Math.round(h * k); }
      const g = fc.getContext('2d');
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.imageSmoothingEnabled = false;
      g.fillStyle = '#120a0c';
      g.fillRect(0, 0, fc.width, fc.height);
      const z = ZOOMS[zi], ox = cx - w / 2 / z, oy = cy - h / 2 / z;
      for (const fk of world.fogKeys()) {
        const comma = fk.indexOf(',');
        const kx = Number(fk.slice(0, comma)), ky = Number(fk.slice(comma + 1));
        const sx = (kx * CH - ox) * z, sy = (ky * CH - oy) * z;
        if (sx > w || sy > h || sx + CH * z < 0 || sy + CH * z < 0) continue;
        const c = painter.mini(kx, ky);
        if (c) blit(g, c, kx * CH - ox, ky * CH - oy, k * z);
      }
      g.setTransform(k, 0, 0, k, 0, 0);
      markers(g, st, (x, y) => [(x / T - ox) * z, (y / T - oy) * z]);
    }

    return {
      minimap, el, drawMini, frame, key, relabel,
      attach(w, p) { world = w; painter = p; closeMap(); },
      open: openMap, close: closeMap, isOpen: () => open,
    };
  }

  function debugText(s) {
    return [
      'fps ' + s.fps,
      'data ' + s.world.data + '/' + s.world.cap + '  queue ' + s.world.queue + '  built ' + s.world.built,
      'images ' + s.paint.images + '/' + s.paint.cap + '  queue ' + s.paint.queue + '  paint ' + s.paint.paintMedian.toFixed(2) + ' ms',
      'minis ' + s.paint.minis + ' (+' + s.paint.miniQueue + ')  fog chunks ' + s.world.fog,
      'tile ' + s.tile.join(',') + '  chunk ' + s.chunk.join(',') + '  ' + s.region,
    ].join('\n');
  }

  root.SolMap = { create, debugText };
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
/*
 * SOL 500 — the walkable surface: your astronaut walks around the outpost and out into the endless world, builds on
 * tiles, inspects and switches machines, drives the rover, and meets the rest of the crew, who walk to their jobs.
 * Canvas 2D + a small DOM overlay. It never changes the mission itself: every action goes through ui.js hooks,
 * so the surface and the mission console always show the same plan.
